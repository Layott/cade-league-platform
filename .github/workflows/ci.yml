name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Type check only — full `next build` requires runtime env vars
      # (Supabase URL, service-role key) for prerender; Vercel handles
      # the real production build with those secrets in scope.
      - run: npx --workspace apps/web tsc --noEmit
