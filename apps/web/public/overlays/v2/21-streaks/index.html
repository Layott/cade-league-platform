:root {
  --green: #6bcd06;
  --green-glow: rgba(107,205,6,0.55);
  --pink:  #fe036d;
  --pink-glow: rgba(254,3,109,0.55);
  --ink:   #050505;
  --ink-2: #0d0d0d;
  --ink-3: #1a1a1a;
  --chalk: rgba(255,255,255,0.92);
  --chalk-2: rgba(255,255,255,0.62);
  --chalk-3: rgba(255,255,255,0.30);
  --display: 'Agharti', 'Impact', sans-serif;
  --body: 'Quedora', 'Inter', system-ui, sans-serif;
  /* Reserved space for partner strip — content must stay above this. */
  --partner-zone-h: 180px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent !important; color-scheme: dark; color: #fff; font-family: var(--body); }
body { opacity: 1 !important; background: transparent !important; }

/* === Opacity gate: stage hidden until cade-visible === */
.canvas { opacity: 0; transition: opacity 360ms ease-out; }
body.cade-visible .canvas { opacity: 1; }
body.cade-exiting .canvas { opacity: 0; }

.canvas { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
/* ── Standard ELITE S2 BG (matches production v2 overlays) ── */
.bg-fill { position: absolute; inset: 0; background-image: url('/overlays/v2/_assets/designsample/ELITE%20S2%20BG.png'); background-size: cover; background-position: center; z-index: 0; }
.bg-vignette { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.55) 100%); z-index: 1; pointer-events: none; }

/* ── Top brand strip ── */
.brand-strip { position: absolute; top: 30px; left: 36px; display: flex; align-items: center; gap: 14px; z-index: 12; }
.brand-strip img { height: 56px; width: auto; object-fit: contain; }
.brand-strip .sep { width: 1px; height: 38px; background: rgba(255,255,255,0.30); }

/* ── Live pill ── */
.live-pill { position: absolute; top: 38px; right: 40px; display: flex; align-items: center; gap: 8px; padding: 8px 18px; background: var(--pink); border-radius: 4px; z-index: 12; }
.live-pill::before { content: ""; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #fff; }
.live-pill span { font-family: var(--display); letter-spacing: 0.30em; font-size: 14px; font-weight: 700; }

/* ── Season/Match-day corner watermarks ── */
.season-mark { position: absolute; bottom: 14px; right: 36px; font-family: var(--display); font-size: 12px; letter-spacing: 0.40em; color: rgba(255,255,255,0.78); text-transform: uppercase; z-index: 13; }
.matchday-mark { position: absolute; bottom: 14px; left: 36px; font-family: var(--display); font-size: 12px; letter-spacing: 0.40em; color: rgba(255,255,255,0.78); text-transform: uppercase; z-index: 13; }

/* ── Partner strip (bottom-center, NEVER overlapped) ── */
.partners { position: absolute; left: 0; right: 0; bottom: 36px; height: 70px; display: flex; justify-content: center; align-items: center; gap: 64px; z-index: 14; padding: 0 40px; }
.partners .partner { height: 50px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45)); }

/* Hard-boundary stage: content NEVER enters partner zone */
.stage { position: absolute; left: 0; right: 0; top: 0; bottom: var(--partner-zone-h); z-index: 5; padding: 0 80px; box-sizing: border-box; overflow: hidden; }

/* Heading helpers */
.kicker { font-family: var(--display); font-size: 18px; letter-spacing: 0.42em; color: var(--chalk-2); text-transform: uppercase; }
.title-h1 { font-family: var(--display); font-size: 110px; line-height: 1; letter-spacing: 0.04em; }
.title-h1 .accent-g { color: var(--green); }
.title-h1 .accent-p { color: var(--pink); }
.sub-h1 { font-family: var(--display); font-size: 24px; letter-spacing: 0.36em; color: var(--chalk-2); margin-top: 6px; text-transform: uppercase; }

.streak-stage { padding-top: 90px; display: flex; flex-direction: column; }
.streak-head { margin-bottom: 24px; flex-shrink: 0; }
.streak-list { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow: hidden; }
.streak-row { display: grid; grid-template-columns: 70px 78px 1fr 120px 180px; align-items: center; gap: 24px; padding: 10px 26px; background: linear-gradient(90deg, rgba(107,205,6,0.10) 0%, rgba(0,0,0,0.40) 60%); border-left: 5px solid var(--green); }

.streak-row .org-logo-wrap { width: 120px; height: 70px; display: flex; align-items: center; justify-content: center; }
.streak-row .org-logo-wrap img { max-height: 60px; max-width: 120px; width: auto; height: auto; object-fit: contain; opacity: 0.92; }
.streak-row .stat { text-align: right; }
.streak-row .stat .num { font-family: var(--display); font-size: 58px; line-height: 1; color: var(--green); text-shadow: 0 0 20px var(--green-glow); }
.streak-row.featured .stat .num { font-size: 80px; }
.streak-row .stat .label { font-family: var(--display); letter-spacing: 0.30em; font-size: 13px; color: var(--chalk-2); }

<script>
(function cadeGate() {
  'use strict';
  function show() {
    document.body.classList.remove('cade-exiting');
    document.body.classList.add('cade-visible');
  }
  function hide() {
    document.body.classList.remove('cade-visible');
    document.body.classList.add('cade-exiting');
  }
  function slugify(name) {
    return (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  }
  function update(data) {
    if (!data || typeof data !== 'object') return;
    var payload = data.payload || data;
    var streaks = Array.isArray(payload.streaks) ? payload.streaks : [];
    var rows = document.querySelectorAll('.streak-list .streak-row');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var r = streaks[i];
      if (!r) { row.style.display = 'none'; continue; }
      row.style.display = '';
      var rank = row.querySelector('.rank'); if (rank) rank.textContent = '#' + (i + 1);
      var img = row.querySelector('img.photo');
      if (img) img.src = r.photoUrl || '/overlays/v2/_assets/players/processed/' + (r.slug || slugify(r.displayName)) + '/headshot_01_nobg.png';
      var nameEl = row.querySelector('.who .name'); if (nameEl) nameEl.textContent = (r.displayName || '').toUpperCase();
      var orgEl = row.querySelector('.who .org'); if (orgEl) orgEl.textContent = (r.orgName || '').toUpperCase();
      var orgImg = row.querySelector('.org-logo-wrap img');
      if (orgImg && r.orgLogoUrl) orgImg.src = r.orgLogoUrl;
      var num = row.querySelector('.stat .num'); if (num) num.textContent = String(r.streak);
    }
  }
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'show') { show(); if (msg.data) update(msg.data); }
    else if (msg.type === 'update') update(msg.data || msg);
    else if (msg.type === 'hide') hide();
  }, false);
})();
</script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  var SEL = '.canvas';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    document.querySelectorAll(SEL).forEach(function(el){
      if (!el.dataset.cadeTransition) {
        el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
        el.dataset.cadeTransition = '1';
      }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.setProperty('visibility', 'visible', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  setTimeout(function(){ fire('show'); }, 200);
})();
</script>
