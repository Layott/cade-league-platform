<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #07-LEADERBOARD — "TWO-COLUMN ELITE TABLE"
  Two-column standings: rows 1-6 LEFT, rows 7-13 RIGHT.
  Columns: POS · PLAYER · MP · W · L · D · GD · PTS.
  Top-2 of each column (1, 2 + 7, 8) highlighted with green-fill chip.
  Bottom partner strip: GameEvo · Gamepride · ESN · TRACE · OAS esport.

  DATA CONTRACT (per CLAUDE.md §14):
    postMessage envelope { type: 'show'|'hide'|'update', data, slot? }
    data shape supports any of:
      - { rows: [{pos, name, mp, w, l, d, gd, pts}] }
      - { standings: [...] }
      - { payload: { rows: [...] } }
    server feed at /api/broadcast/sessions/[id]/leaderboard returns
      { rows: [{rank, player_name, displayName, slug, matches_played, wins, draws, losses, goals_for, goals_against, goal_difference, points}] }
    so we map server snake_case + display* fields into the local view.

  GATE CONTRACT:
    body default = no cade-visible class. Inner gated via CSS rule
    `body:not(.cade-visible):not(.cade-exiting) .gated { opacity: 0 }`.
    cade-visible-gate-observer-v2 forces inline opacity:1 on cade-visible
    so Chrome cross-origin iframe stuck-transition cannot leave anything
    at 0. Demo loop fires only with ?demo=1.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — Elite League Leaderboard</title>


<script id="cade-token-bootstrap">
(function() {
  // Wave 2 Stage 3 — cross-document design + text + partner propagation.
  //
  // Read base64-encoded JSON token maps from the iframe URL query
  // string and emit <style> blocks that win the CSS source-order
  // cascade (appended LATER in <head> than the author defaults).
  //
  // Token shapes:
  //   tokens / previewTokens     — { 'bg-color': '#000', ... }
  //   textTokens / previewTextTokens — { '<elementId>': { visible?,
  //     content?, styles?: { color, fontFamily, fontSize, ... } } }
  //   partnerTokens / previewPartnerTokens — {
  //     layout?: { anchor, positionXPx, positionYPx, scalePct,
  //                itemSpacingPx, orientation, justification,
  //                zIndex, visible },
  //     logos?: [ { partnerKey, label, alt, fileUrl, visible?, sort? } ]
  //   }
  //
  // Spec: docs/superpowers/specs/2026-04-29-overlay-design-page-v2.md §6.2
  function decodeTokens(param) {
    if (!param) return null;
    try {
      var json = decodeURIComponent(escape(atob(param)));
      var obj = JSON.parse(json);
      if (typeof obj !== 'object' || !obj) return null;
      return obj;
    } catch (e) { return null; }
  }
  function buildCssVars(tokens) {
    if (!tokens) return '';
    var parts = [];
    var imageKeys = { 'bg-image': 1 };
    for (var k in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, k)) continue;
      var v = tokens[k];
      if (typeof v !== 'string') continue;
      var safe = v.replace(/[;{}<>"']/g, '');
      if (imageKeys[k]) {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': url("' + safe + '")');
      } else {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': ' + safe);
      }
    }
    return parts.length ? ':root{' + parts.join(';') + ';}' : '';
  }
  function sanitizeCss(v) {
    return String(v == null ? '' : v).replace(/[;{}<>"\\`]/g, '');
  }
  function buildTextRules(tokens) {
    if (!tokens || typeof tokens !== 'object') return '';
    var rules = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      var s = t.styles || {};
      var declarations = [];
      if (s.color)         declarations.push('color:' + sanitizeCss(s.color));
      if (s.fontFamily)    declarations.push("font-family:'" + sanitizeCss(s.fontFamily) + "'");
      if (s.fontWeight)    declarations.push('font-weight:' + (+s.fontWeight || 400));
      if (s.fontSize)      declarations.push('font-size:' + sanitizeCss(s.fontSize));
      if (s.letterSpacing) declarations.push('letter-spacing:' + sanitizeCss(s.letterSpacing));
      if (s.lineHeight != null) declarations.push('line-height:' + (+s.lineHeight || 1));
      if (s.textAlign)     declarations.push('text-align:' + sanitizeCss(s.textAlign));
      if (s.opacity != null) declarations.push('opacity:' + (+s.opacity || 0));
      // Y-position bug fix (2026-04-28): switch from `left/top + position:absolute`
      // to the CSS individual `translate:` property. `absolute` resolved against
      // the nearest positioned ancestor (often a transformed centering wrapper),
      // so `top:Npx` did not move the element on the 1920x1080 canvas. `translate`
      // is a pure visual displacement and composes with existing `transform: ...`
      // animation keyframes via the Transforms 2 spec.
      if (s.left || s.top) {
        var tx = s.left ? sanitizeCss(s.left) : '0px';
        var ty = s.top ? sanitizeCss(s.top) : '0px';
        declarations.push('translate:' + tx + ' ' + ty + ' !important');
      }
      if (s.zIndex != null) declarations.push('z-index:' + (+s.zIndex || 0));
      if (t.visible === false) declarations.push('display:none');
      if (declarations.length) {
        rules.push('[data-element-id="' + elId + '"]{' + declarations.join(';') + ';}');
      }
    }
    return rules.join('\n');
  }
  function applyTextContent(tokens) {
    if (!tokens || typeof tokens !== 'object') return;
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      if (typeof t.content !== 'string') continue;
      if (t.content === '' || t.content == null) continue;
      var node = document.querySelector('[data-element-id="' + elId + '"]');
      if (!node) continue;
      try { node.textContent = t.content; } catch (e) { /* read-only */ }
    }
  }
  function buildPartnerLayoutRule(layout) {
    if (!layout || typeof layout !== 'object') return '';
    if (layout.visible === false) {
      return '[data-element-id="partners-strip"]{display:none !important;}';
    }
    var declarations = [];
    declarations.push('display:flex');
    declarations.push('flex-direction:' + (layout.orientation === 'vertical' ? 'column' : 'row'));
    declarations.push('justify-content:' + sanitizeCss(layout.justification || 'center'));
    declarations.push('align-items:center');
    declarations.push('gap:' + ((+layout.itemSpacingPx) || 0) + 'px');
    declarations.push('z-index:' + ((+layout.zIndex) || 12));
    declarations.push('position:absolute');
    var anchor = layout.anchor || 'bottom-center';
    var px = (+layout.positionXPx) || 0;
    var py = (+layout.positionYPx) || 0;
    var sx = ((+layout.scalePct) || 100) / 100;
    var transformOps = [];
    if (anchor.indexOf('top') === 0) {
      declarations.push('top:' + py + 'px');
      declarations.push('bottom:auto');
    } else if (anchor.indexOf('bottom') === 0) {
      declarations.push('bottom:' + (1080 - py) + 'px');
      declarations.push('top:auto');
    } else {
      declarations.push('top:' + py + 'px');
      declarations.push('bottom:auto');
      transformOps.push('translateY(-50%)');
    }
    if (anchor.indexOf('left') !== -1) {
      declarations.push('left:' + px + 'px');
      declarations.push('right:auto');
    } else if (anchor.indexOf('right') !== -1) {
      declarations.push('right:' + (1920 - px) + 'px');
      declarations.push('left:auto');
    } else {
      declarations.push('left:50%');
      declarations.push('right:auto');
      transformOps.push('translateX(-50%)');
    }
    if (sx !== 1) declarations.push('scale:' + sx);
    if (transformOps.length) {
      declarations.push('transform:' + transformOps.join(' '));
      declarations.push('transform-origin:center center');
    }
    return '[data-element-id="partners-strip"]{' + declarations.join(';') + ';}';
  }
  function applyPartnerLogos(logos, layout) {
    if (!Array.isArray(logos)) return false;
    var strip = document.querySelector('[data-element-id="partners-strip"]');
    if (!strip) return false;
    // Filter visible + sort.
    var sorted = logos
      .filter(function(l) { return l && l.visible !== false && typeof l.fileUrl === 'string'; })
      .slice()
      .sort(function(a, b) {
        var sa = typeof a.sort === 'number' ? a.sort : 999;
        var sb = typeof b.sort === 'number' ? b.sort : 999;
        return sa - sb;
      });
    if (sorted.length === 0 && (!layout || layout.visible !== false)) {
      // No logos but layout present — leave existing children alone.
      return false;
    }
    // Wipe existing children.
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    // Mark as flex container so the layout CSS takes effect even without
    // browser quirks.
    sorted.forEach(function(l) {
      var img = document.createElement('img');
      var safeKey = sanitizeCss(l.partnerKey || 'x');
      img.className = 'partner partner--' + safeKey;
      img.src = sanitizeCss(l.fileUrl);
      img.alt = sanitizeCss(l.alt || l.label || '');
      img.setAttribute('data-partner-key', safeKey);
      strip.appendChild(img);
    });
    return true;
  }
  // ────────── Stage 4 — element animations ──────────
  //
  // Build @keyframes BODY for a given preset anim type. Mirrors
  // server/overlays/animations/elements.ts::buildKeyframesBody — same
  // values across server-side resolver + client-side bootstrap so
  // SSR-emitted styles + URL-borne overrides yield identical motion.
  function buildPresetKeyframes(animType, name, customBody) {
    switch (animType) {
      case 'slide-left':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-right':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-up':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}';
      case 'slide-down':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(-32px)}to{opacity:1;transform:translateY(0)}}';
      case 'fade':
        return '@keyframes ' + name + '{from{opacity:0}to{opacity:1}}';
      case 'scale':
        return '@keyframes ' + name + '{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}';
      case 'rotate':
        return '@keyframes ' + name + '{from{opacity:0;transform:rotate(-12deg)}to{opacity:1;transform:rotate(0)}}';
      case 'bounce':
        return '@keyframes ' + name + '{0%{opacity:0;transform:translateY(20px)}60%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}';
      case 'pulse':
        return '@keyframes ' + name + '{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}';
      case 'glow':
        return '@keyframes ' + name + '{0%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}50%{filter:drop-shadow(0 0 24px rgba(107,205,6,0.55))}100%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}}';
      case 'shake':
        return '@keyframes ' + name + '{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
      case 'flip':
        return '@keyframes ' + name + '{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:perspective(800px) rotateY(0)}}';
      case 'custom-css':
        // Defence-in-depth: strip url(), at-rules, and angle/backtick
        // characters even if server sanitizer was bypassed (URL-borne).
        if (typeof customBody !== 'string') return '';
        if (/\burl\s*\(/i.test(customBody)) return '';
        if (/@(import|font-face|charset|media|supports|keyframes)\b/i.test(customBody)) return '';
        if (/[<>\`]/.test(customBody)) return '';
        return '@keyframes ' + name + '{' + customBody + '}';
      case 'none':
      default:
        return '';
    }
  }
  function buildAnimRulesAndKeyframes(tokens) {
    if (!tokens || typeof tokens !== 'object') return { keyframes: '', rules: '' };
    var keyframesParts = [];
    var rulesParts = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var phases = tokens[elId];
      if (!phases || typeof phases !== 'object') continue;
      for (var phase in phases) {
        if (!Object.prototype.hasOwnProperty.call(phases, phase)) continue;
        if (phase !== 'entry' && phase !== 'exit' && phase !== 'continuous') continue;
        var p = phases[phase];
        if (!p || typeof p !== 'object') continue;
        if (p.enabled === false) continue;
        if (!p.animType || p.animType === 'none') continue;
        var animName = 'cade-' + elId + '-' + phase;
        var kf = buildPresetKeyframes(
          p.animType,
          animName,
          p.customCssKeyframes || ''
        );
        if (!kf) continue;
        keyframesParts.push(kf);
        var duration = (+p.durationMs) || 360;
        var delay = (+p.delayMs) || 0;
        var easing = sanitizeCss(p.easing || 'ease-out');
        var iterations = sanitizeCss(p.iterationCount || '1');
        // Phase-gated selector. Continuous animations only run while
        // the overlay is visible (cade-visible class on body).
        var sel =
          phase === 'exit'
            ? 'body.cade-exiting [data-element-id="' + elId + '"]'
            : 'body.cade-visible [data-element-id="' + elId + '"]';
        var rule =
          'animation:' + animName +
          ' ' + duration + 'ms' +
          ' ' + easing +
          ' ' + delay + 'ms' +
          ' ' + iterations +
          ' both;';
        rulesParts.push(sel + '{' + rule + '}');
      }
    }
    return {
      keyframes: keyframesParts.join('\n'),
      rules: rulesParts.join('\n'),
    };
  }
  try {
    var qs = new URLSearchParams(location.search);
    var design = decodeTokens(qs.get('tokens'));
    var preview = decodeTokens(qs.get('previewTokens'));
    var textTokens = decodeTokens(qs.get('textTokens'));
    var previewTextTokens = decodeTokens(qs.get('previewTextTokens'));
    var partnerTokens = decodeTokens(qs.get('partnerTokens'));
    var previewPartnerTokens = decodeTokens(qs.get('previewPartnerTokens'));
    var animTokens = decodeTokens(qs.get('animTokens'));
    var previewAnimTokens = decodeTokens(qs.get('previewAnimTokens'));
    // Source order: design first, preview second so preview wins.
    var cssVarRule = buildCssVars(design) + buildCssVars(preview);
    var textRule = buildTextRules(textTokens) + (buildTextRules(textTokens).length && buildTextRules(previewTextTokens).length ? '\n' : '') + buildTextRules(previewTextTokens);
    // Partner layout: preview wins by being applied second (later
    // <style> block wins on identical selector via source-order).
    var partnerRules = [];
    if (partnerTokens && partnerTokens.layout) {
      var r1 = buildPartnerLayoutRule(partnerTokens.layout);
      if (r1) partnerRules.push(r1);
    }
    if (previewPartnerTokens && previewPartnerTokens.layout) {
      var r2 = buildPartnerLayoutRule(previewPartnerTokens.layout);
      if (r2) partnerRules.push(r2);
    }
    // Stage 4 — element animations. Build keyframes + rules from both
    // design + preview maps. Source-order wins on identical names: the
    // preview block emits second, so its keyframes & rules overwrite
    // design's via CSS cascade (same selector + same animation-name).
    var animDesign = buildAnimRulesAndKeyframes(animTokens);
    var animPreview = buildAnimRulesAndKeyframes(previewAnimTokens);
    var animKeyframesCss = animDesign.keyframes +
      (animDesign.keyframes && animPreview.keyframes ? '\n' : '') +
      animPreview.keyframes;
    var animRulesCss = animDesign.rules +
      (animDesign.rules && animPreview.rules ? '\n' : '') +
      animPreview.rules;
    var emit = function() {
      if (!document.head) return;
      if (cssVarRule) {
        var s1 = document.createElement('style');
        s1.id = 'cade-injected-tokens';
        s1.textContent = cssVarRule;
        document.head.appendChild(s1);
      }
      if (textRule) {
        var s2 = document.createElement('style');
        s2.id = 'cade-injected-text';
        s2.textContent = textRule;
        document.head.appendChild(s2);
      }
      if (partnerRules.length) {
        var s3 = document.createElement('style');
        s3.id = 'cade-injected-partners-layout';
        s3.textContent = partnerRules.join('\n');
        document.head.appendChild(s3);
      }
      // Stage 4 — animation keyframes block FIRST (must precede rules
      // so the named animations resolve).
      if (animKeyframesCss) {
        var s4 = document.createElement('style');
        s4.id = 'cade-injected-anim-keyframes';
        s4.textContent = animKeyframesCss;
        document.head.appendChild(s4);
      }
      if (animRulesCss) {
        var s5 = document.createElement('style');
        s5.id = 'cade-injected-anim-rules';
        s5.textContent = animRulesCss;
        document.head.appendChild(s5);
      }
      // Apply textContent edits AFTER DOM is parsed.
      applyTextContent(textTokens);
      applyTextContent(previewTextTokens);
      // Rebuild partner strip children — preview wins by being applied
      // second (overwrites design's children).
      if (partnerTokens && Array.isArray(partnerTokens.logos)) {
        applyPartnerLogos(partnerTokens.logos, partnerTokens.layout);
      }
      if (previewPartnerTokens && Array.isArray(previewPartnerTokens.logos)) {
        applyPartnerLogos(previewPartnerTokens.logos, previewPartnerTokens.layout);
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', emit);
    } else {
      emit();
    }
  } catch (e) {
    // Bootstrap MUST never throw — fall back to HTML defaults.
  }
})();
</script>

    font-weight: 700; font-style: normal; font-display: block;

  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Black.woff2') format('woff2');
    font-weight: 900; font-style: normal; font-display: block;

  /* ============================================================
     DESIGN TOKENS (consumed via CSS variables) — Phase 2 of overlay
     design system. SSR may inject `:root { --overlay-* }` overrides
     above this declaration; fallbacks here keep first-deploy a no-op.
     See docs/superpowers/specs/2026-04-29-overlay-design-system.md §3.2.
  ============================================================ */
  :root {
    --overlay-bg-color: #050505;
    --overlay-accent-color: #6bcd06;
    --overlay-secondary-color: #fe036d;
    --overlay-text-color: #ffffff;
    --overlay-font-display: 'Agharti';
    --overlay-font-body: 'Quedora';
    --overlay-row-highlight-count: 2;
    --overlay-pattern: halftone;
    --overlay-partner-strip-show: flex;
  }

  /* ── LOCAL BRAND TOKENS ─────────────────────────────────────
     Local aliases consume the spec-level overlay tokens above so
     existing `var(--green)` / `var(--pink)` / `var(--ink)` consumers
     flow through to the design system. Hex fallbacks keep visual
     defaults unchanged when no SSR token override is injected. */
  :root {
    --green:        var(--overlay-accent-color, #6bcd06);
    --green-glow:   rgba(107, 205, 6, 0.55);
    --green-deep:   #5cb305;
    --green-bright: #82e018;
    --pink:         var(--overlay-secondary-color, #fe036d);
    --pink-glow:    rgba(254, 3, 109, 0.55);
    --black:        var(--overlay-bg-color, #050505);
    --ink:          var(--overlay-text-color, #ffffff);
    --ink-muted:    rgba(255, 255, 255, 0.78);
    --display:      var(--overlay-font-display, 'Agharti'), 'Impact', sans-serif;
    --accent:       var(--overlay-font-body, 'Quedora'), 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: transparent !important;
    color-scheme: dark; color: var(--ink);
    font-family: var(--accent);
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  body { opacity: 1 !important; }

  /* Gate inner content until cade-visible. Background stays gated too
     so the ELITE S2 BG doesn't leak when the overlay is dormant. */
  body:not(.cade-visible):not(.cade-exiting) .bg-fill,
  body:not(.cade-visible):not(.cade-exiting) .bg-vignette,
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .corner-badge,
  body:not(.cade-visible):not(.cade-exiting) .headline,
  body:not(.cade-visible):not(.cade-exiting) .table-block,
  body:not(.cade-visible):not(.cade-exiting) .col-headers,
  body:not(.cade-visible):not(.cade-exiting) .rows,
  body:not(.cade-visible):not(.cade-exiting) .row,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .matchday-mark,
  body:not(.cade-visible):not(.cade-exiting) .season-mark {
    opacity: 0 !important;
  }
  body.cade-exiting .bg-fill,
  body.cade-exiting .bg-vignette,
  body.cade-exiting .top-band,
  body.cade-exiting .corner-badge,
  body.cade-exiting .headline,
  body.cade-exiting .table-block,
  body.cade-exiting .partners,
  body.cade-exiting .matchday-mark,
  body.cade-exiting .season-mark {
    opacity: 0 !important;
    transition: opacity 0.5s cubic-bezier(0.7, 0, 0.84, 0);
  }

  /* TRANSPARENT canvas */
  .stage {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
    isolation: isolate;
  }

  /* ============================================================
     BACKGROUND — ELITE S2 BG (matches the rest of the v2 family).
     Phase A — admins can override `--overlay-bg-image` per variant.
     Phase B1 — dropped the legacy green-wall + halftone-dot pair;
     ELITE S2 BG already carries its own texture so no overlay
     pattern element is needed.
  ============================================================ */
  .bg-fill {
    position: absolute; inset: 0;
    background-image: var(--overlay-bg-image, url('/overlays/v2/_assets/designsample/ELITE%20S2%20BG.png'));
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }
  .bg-vignette {
    position: absolute; inset: 0;
    /* Subtle radial fade tuned for dark ELITE S2 BG — the original
       multi-stop gradient was tuned for the green-wall variant and
       was over-darkening the corners. Simple center-out falloff
       reads cleanly on the dark backdrop. */
    background:
      radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* ============================================================
     TOP HEADER BAND — CADE Esports logo (left) + League badge (right)
  ============================================================ */
  .top-band {
    position: absolute;
    top: 30px;
    left: 0; right: 0;
    height: 130px;
    z-index: 10;
  }
  .top-band .logo-cade {
    position: absolute;
    top: 8px; left: 50px;
    height: 116px; width: auto;
    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.35));
  }
  .corner-badge {
    position: absolute;
    top: 28px; right: 56px;
    z-index: 10;
  }
  .corner-badge img {
    height: 100px; width: auto;
    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.35));
  }

  /* ============================================================
     HEADLINE — "ELITE LEAGUE" small + "LEADERBOARD" giant
  ============================================================ */
  .headline {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 1100px;
    text-align: center;
    z-index: 12;
  }
  .headline .eyebrow {
    font-family: var(--display);
    font-weight: 900; font-stretch: 75%;
    font-size: 64px; line-height: 0.92;
    letter-spacing: 0.012em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow:
      0 0 1px rgba(255, 255, 255, 0.55),
      0 4px 18px rgba(0, 0, 0, 0.30);
    margin-bottom: -8px;
  }
  .headline .title {
    font-family: var(--display);
    font-weight: 900; font-stretch: 75%;
    font-size: 158px; line-height: 0.86;
    letter-spacing: -0.005em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow:
      0 0 1px rgba(255, 255, 255, 0.85),
      0 6px 22px rgba(0, 0, 0, 0.45),
      0 0 36px rgba(255, 255, 255, 0.18);
  }

  /* ============================================================
     TABLE BLOCK — TWO COLUMNS (1-6 LEFT, 7-13 RIGHT)
  ============================================================ */
  .table-block {
    position: absolute;
    top: 320px;
    left: 50%;
    transform: translateX(-50%);
    width: 1820px;
    z-index: 14;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 56px;
    row-gap: 0;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  /* Column header strip — must match `.row` grid exactly */
  .col-headers {
    display: grid;
    grid-template-columns:
      62px      /* POS */
      1fr       /* PLAYER NAME */
      54px      /* MP */
      54px      /* W */
      54px      /* L */
      54px      /* D */
      72px      /* GD */
      78px;     /* PTS */
    column-gap: 6px;
    align-items: end;
    padding: 0 14px 8px;
    height: 38px;
    font-family: var(--display);
    font-weight: 700; font-stretch: 75%;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }
  .col-headers .h--name { text-align: left; padding-left: 4px; }
  .col-headers .h--center { text-align: center; }
  .col-headers .h--pts { text-align: center; }

  /* Row track */
  .rows {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ROW
     The card is a black HUD strip with angled corner cuts. Top-2 rows
     in each column get a green-fill chip via .is-top class.
     `--row-y` not used for two-column layout (rows are in flow). */
  .row {
    display: grid;
    grid-template-columns:
      62px 1fr 54px 54px 54px 54px 72px 78px;
    column-gap: 6px;
    align-items: center;
    padding: 0 14px;
    height: 56px;
    background: rgba(8, 12, 8, 0.92);
    color: var(--ink);
    /* angled corner cuts (chevron-tab on the LEFT — matches the
       reference image's leading-edge accent) */
    clip-path: polygon(
      18px 0,
      100% 0,
      100% 100%,
      18px 100%,
      0 50%
    );
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.06),
      0 4px 14px rgba(0, 0, 0, 0.22);
    transition: opacity 360ms ease-out, transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }

  /* Top 2 in each column — green-fill highlight (per reference) */
  .row.is-top {
    background: var(--green);
    color: var(--black);
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, 0.18),
      0 4px 14px rgba(0, 0, 0, 0.30);
  }
  .row.is-top .pos-num,
  .row.is-top .player-name,
  .row.is-top .stat,
  .row.is-top .pts {
    color: var(--black);
    text-shadow: none;
  }
  .row.is-top .stat-gd.pos { color: rgba(0, 0, 0, 0.78); }
  .row.is-top .stat-gd.neg { color: rgba(0, 0, 0, 0.62); }

  /* ROW INTERNALS */
  .pos-num {
    font-family: var(--display);
    font-weight: 900; font-stretch: 75%;
    font-size: 32px; line-height: 1;
    color: var(--ink);
    text-align: center;
    letter-spacing: -0.02em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }

  .player-name {
    font-family: var(--display);
    font-weight: 900; font-stretch: 75%;
    font-size: 26px; line-height: 1;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.012em;
    text-align: left;
    padding-left: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }

  /* Numeric stat cells (MP / W / L / D / GD / PTS) */
  .stat {
    font-family: var(--display);
    font-weight: 800; font-stretch: 100%;
    font-size: 24px; line-height: 1;
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.005em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }
  .stat-gd.pos { color: var(--green-bright); }
  .stat-gd.neg { color: #ffb6cf; }

  .pts {
    font-family: var(--display);
    font-weight: 900; font-stretch: 100%;
    font-size: 26px; line-height: 1;
    color: var(--ink);
    text-align: center;
    letter-spacing: -0.005em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }

  /* ============================================================
     STAGGERED ENTRANCE
     Each row slides in from the left when body.cade-visible.
     The gate observer sets opacity:1 inline; transition handles the flip.
  ============================================================ */
  body:not(.cade-visible) .row { opacity: 0; transform: translateX(-32px); }
  body.cade-visible .row { opacity: 1; transform: translateX(0); }
  body.cade-visible .col-left .row:nth-child(1)  { transition-delay: 60ms;   }
  body.cade-visible .col-left .row:nth-child(2)  { transition-delay: 120ms;  }
  body.cade-visible .col-left .row:nth-child(3)  { transition-delay: 180ms;  }
  body.cade-visible .col-left .row:nth-child(4)  { transition-delay: 240ms;  }
  body.cade-visible .col-left .row:nth-child(5)  { transition-delay: 300ms;  }
  body.cade-visible .col-left .row:nth-child(6)  { transition-delay: 360ms;  }
  body.cade-visible .col-right .row:nth-child(1) { transition-delay: 90ms;   }
  body.cade-visible .col-right .row:nth-child(2) { transition-delay: 150ms;  }
  body.cade-visible .col-right .row:nth-child(3) { transition-delay: 210ms;  }
  body.cade-visible .col-right .row:nth-child(4) { transition-delay: 270ms;  }
  body.cade-visible .col-right .row:nth-child(5) { transition-delay: 330ms;  }
  body.cade-visible .col-right .row:nth-child(6) { transition-delay: 390ms;  }
  body.cade-visible .col-right .row:nth-child(7) { transition-delay: 450ms;  }

  /* ============================================================
     PARTNER STRIP — bottom row, 5 logos (added OAS esport)
  ============================================================ */
  .partners {
    position: absolute;
    left: 0; right: 0;
    bottom: 36px;
    display: var(--overlay-partner-strip-show, flex);
    justify-content: center;
    align-items: center;
    gap: 64px;
    z-index: 12;
    padding: 14px 40px;
  }
  .partners .partner {
    height: 58px; width: auto;
    object-fit: contain;
    filter:
      drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35))
      drop-shadow(0 0 1px rgba(0, 0, 0, 0.20));
  }
  /* OAS logo PNG is already transparent — no backdrop chip needed.
     Inherits the standard `.partner` styling above (transparent bg). */
  .partners .partner--oas {
    height: 58px;
  }

  /* ============================================================
     CORNER WATERMARKS
  ============================================================ */
  .matchday-mark {
    position: absolute;
    bottom: 16px; left: 36px;
    font-family: var(--accent);
    font-weight: 700; font-size: 12px;
    letter-spacing: 0.40em;
    /* Dark backdrop — pale ink reads where rgba(0,0,0,0.55) disappeared. */
    color: rgba(255, 255, 255, 0.85);
    text-transform: uppercase;
    z-index: 12;
  }
  .season-mark {
    position: absolute;
    bottom: 16px; right: 36px;
    font-family: var(--accent);
    font-weight: 700; font-size: 12px;
    letter-spacing: 0.40em;
    /* Dark backdrop — pale ink reads where rgba(0,0,0,0.55) disappeared. */
    color: rgba(255, 255, 255, 0.85);
    text-transform: uppercase;
    z-index: 12;
  }
</style>
</head>
<body>
  <main class="stage">

    <!-- BG : ELITE S2 BG image + soft vignette for dark-bg readability -->
    <div class="bg-fill" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>

    <!-- Corner marks -->
    <div data-element-id="matchday-mark" class="matchday-mark">Live Update</div>
    <div data-element-id="season-mark" class="season-mark">Elite League &middot; Season 2</div>

    <!-- Top header: CADE Esports left, League badge right -->
    <header class="top-band">
      <img data-element-id="top-band-logo" class="logo-cade"
           src="/overlays/v2/_assets/logos/1cade%20esport.png"
           alt="CADE Esports" />
    </header>
    <div class="corner-badge">
      <img src="/overlays/v2/_assets/logos/pro%20league%20.png"
           alt="National E-Soccer Pro League" />
    </div>

    <!-- Headline -->
    <section class="headline">
      <div data-element-id="eyebrow" class="eyebrow">Elite League</div>
      <h1 data-element-id="title" class="title">Leaderboard</h1>
    </section>

    <!-- TABLE — TWO COLUMNS -->
    <section class="table-block">
      <div class="col col-left">
        <div class="col-headers" aria-hidden="true">
          <div class="h--center">Pos</div>
          <div class="h--name">Player Name</div>
          <div class="h--center">MP</div>
          <div class="h--center">W</div>
          <div class="h--center">L</div>
          <div class="h--center">D</div>
          <div class="h--center">GD</div>
          <div class="h--pts">PTS</div>
        </div>
        <div class="rows" id="rows-left"></div>
      </div>
      <div class="col col-right">
        <div class="col-headers" aria-hidden="true">
          <div class="h--center">Pos</div>
          <div class="h--name">Player Name</div>
          <div class="h--center">MP</div>
          <div class="h--center">W</div>
          <div class="h--center">L</div>
          <div class="h--center">D</div>
          <div class="h--center">GD</div>
          <div class="h--pts">PTS</div>
        </div>
        <div class="rows" id="rows-right"></div>
      </div>
    </section>

    <!-- Partner strip — GameEvo, Gamepride, ESN, TRACE + OAS esport -->
    <footer data-element-id="partners-strip" class="partners" aria-label="Official Partners">
      <img class="partner partner--gameevo" src="/overlays/v2/_assets/logos/processed/GameEvo%20Esports%20Black_strip.png" alt="GameEvo Esports" />
      <img class="partner partner--pride"   src="/overlays/v2/_assets/logos/processed/Gamepride%20Green-01_strip.png" alt="Gamepride" />
      <img class="partner partner--esn"     src="/overlays/v2/_assets/logos/processed/eSports%20Federation%20of%20Nigeria-1_strip.png" alt="eSports Federation of Nigeria" />
      <img class="partner partner--trace"   src="/overlays/v2/_assets/logos/processed/TRACE_2010_logo.svg_strip.png" alt="Trace" />
      <img class="partner partner--oas"     src="/overlays/v2/_assets/logos/processed/OAS%20esport_strip.png" alt="OAS esport" />
    </footer>

  </main>

<script>
  /* ============================================================
     DATA + RENDER — postMessage listener (data-feed driven).
     CONTRACT (per CLAUDE.md §14):
       show   → render data + add cade-visible
       hide   → swap cade-visible → cade-exiting
       update → re-render with new data, NO class change

     Accepts:
       { type:'update', data:{ rows: [{pos,name,mp,w,l,d,gd,pts}] } }
       { type:'update', data:{ standings: [...] } }
       { type:'update', data:{ payload:{ rows: [...] } } }
     Server feed normalization:
       rank/displayName → pos/name
       matches_played/wins/draws/losses → mp/w/l/d
       goal_difference/points → gd/pts
  ============================================================ */
  (function () {
    var rowsLeft  = document.getElementById('rows-left');
    var rowsRight = document.getElementById('rows-right');

    function fmtSigned(n) {
      n = Number(n) || 0;
      if (n > 0) return '+' + n;
      if (n < 0) return String(n);
      return '0';
    }

    function buildRow(s, posIdx, isTop) {
      s = s || {};
      var pos = posIdx + 1;
      var gd = Number(s.gd != null ? s.gd : (s.goal_difference != null ? s.goal_difference : 0));
      var gdClass = gd > 0 ? 'pos' : (gd < 0 ? 'neg' : '');
      var name = s.name || s.displayName || s.player_name || '—';
      var mp   = (s.mp != null ? s.mp : (s.matches_played != null ? s.matches_played : (s.p != null ? s.p : 0)));
      var w    = (s.w  != null ? s.w  : (s.wins   || 0));
      var l    = (s.l  != null ? s.l  : (s.losses || 0));
      var d    = (s.d  != null ? s.d  : (s.draws  || 0));
      var pts  = (s.pts != null ? s.pts : (s.points != null ? s.points : 0));
      var klass = ['row'];
      if (isTop) klass.push('is-top');
      var pid = s.playerId || s.player_id || s.slug || ('row' + posIdx);
      return '<div class="' + klass.join(' ') + '" id="pid-' + pid + '" data-pos="' + pos + '">' +
        '<div class="pos-num">' + pos + '</div>' +
        '<div class="player-name">' + name + '</div>' +
        '<div class="stat">' + mp + '</div>' +
        '<div class="stat">' + w  + '</div>' +
        '<div class="stat">' + l  + '</div>' +
        '<div class="stat">' + d  + '</div>' +
        '<div class="stat stat-gd ' + gdClass + '">' + fmtSigned(gd) + '</div>' +
        '<div class="pts">' + pts + '</div>' +
      '</div>';
    }

    function rerender(standings) {
      if (!rowsLeft || !rowsRight || !Array.isArray(standings)) return;
      // Empty rows (or single TBD stub) means "trigger visibility, don't
      // override data" — real data from initial fetch / Realtime stays.
      if (standings.length === 0) return;
      if (standings.length === 1) {
        var only = standings[0];
        var nm = (only && (only.displayName || only.name)) || '';
        if (String(nm).trim().toUpperCase() === 'TBD') return;
      }
      // Top-2 of each column (positions 1-2 in left, 7-8 in right).
      var leftHtml  = standings.slice(0, 6).map(function (s, i) {
        return buildRow(s, i, i < 2);
      }).join('');
      var rightHtml = standings.slice(6, 13).map(function (s, i) {
        return buildRow(s, i + 6, i < 2);
      }).join('');
      rowsLeft.innerHTML  = leftHtml;
      rowsRight.innerHTML = rightHtml;

      // Force-show new rows when body is cade-visible (gate observer
      // doesn't pick up dynamically inserted rows; Chrome iframe
      // stuck-transition bug otherwise leaves them at opacity 0).
      if (document.body.classList.contains('cade-visible')) {
        document.querySelectorAll('.rows .row').forEach(function (el) {
          el.style.setProperty('opacity', '1', 'important');
          el.style.setProperty('visibility', 'visible', 'important');
          el.style.removeProperty('transform');
        });
      }
    }

    /**
     * Pull a standings row list out of the message payload, regardless
     * of which shape arrived:
     *   - {standings: [...]} (legacy postMessage relay)
     *   - {rows: [...]} (Realtime `standings.changed` direct shape)
     *   - {payload: {rows: [...], topN}} (initial-fetch from
     *     /api/broadcast/sessions/<id>/leaderboard)
     *   - {payload: {standings: [...]}} (defensive)
     */
    function readStandings(data) {
      if (!data) return null;
      if (Array.isArray(data.standings)) return data.standings;
      if (Array.isArray(data.rows)) return data.rows;
      if (data.payload && typeof data.payload === 'object') {
        if (Array.isArray(data.payload.standings)) return data.payload.standings;
        if (Array.isArray(data.payload.rows)) return data.payload.rows;
      }
      return null;
    }

    function update(data) {
      if (!data) return;
      var rows = readStandings(data);
      if (rows) {
        var normalized = rows.map(function (r) {
          return {
            playerId: r.playerId || r.player_id || r.slug,
            slug: r.slug,
            name: r.name || r.displayName || r.player_name || '',
            mp:  r.mp  != null ? r.mp  : (r.matches_played != null ? r.matches_played : (r.p != null ? r.p : 0)),
            w:   r.w   != null ? r.w   : (r.wins   || 0),
            d:   r.d   != null ? r.d   : (r.draws  || 0),
            l:   r.l   != null ? r.l   : (r.losses || 0),
            gf:  r.gf  != null ? r.gf  : (r.goals_for     || 0),
            ga:  r.ga  != null ? r.ga  : (r.goals_against || 0),
            gd:  r.gd  != null ? r.gd  : (r.goal_difference || 0),
            pts: r.pts != null ? r.pts : (r.points || 0)
          };
        });
        rerender(normalized);
      }
    }

    function show() {
      document.body.classList.remove('cade-exiting');
      document.body.classList.add('cade-visible');
    }
    function hide() {
      document.body.classList.remove('cade-visible');
      document.body.classList.add('cade-exiting');
    }

    /* DEMO data — used both for ?demo=1 and as a first-paint fallback so
       the overlay reads sensibly even before live data arrives. */
    var DEMO_ROWS = [
      { pos: 1,  name: 'BAJI JNR',     mp: 2, w: 2, l: 0, d: 0, gd: 11, pts: 6 },
      { pos: 2,  name: 'TACTICAL',     mp: 2, w: 2, l: 0, d: 0, gd:  6, pts: 6 },
      { pos: 3,  name: 'KAYKAY',       mp: 2, w: 1, l: 1, d: 0, gd: 15, pts: 3 },
      { pos: 4,  name: 'MITCH',        mp: 2, w: 1, l: 1, d: 0, gd: 10, pts: 3 },
      { pos: 5,  name: 'KING NONEX',   mp: 2, w: 1, l: 1, d: 0, gd:  5, pts: 3 },
      { pos: 6,  name: 'GURU',         mp: 2, w: 1, l: 1, d: 0, gd:  8, pts: 3 },
      { pos: 7,  name: 'ADEFOLA',      mp: 2, w: 1, l: 1, d: 1, gd: -1, pts: 3 },
      { pos: 8,  name: 'WOLEVATION',   mp: 2, w: 1, l: 1, d: 1, gd: -1, pts: 3 },
      { pos: 9,  name: 'FARUK',        mp: 0, w: 0, l: 0, d: 0, gd:  0, pts: 0 },
      { pos: 10, name: 'MR OGA',       mp: 1, w: 0, l: 1, d: 0, gd: -3, pts: 0 },
      { pos: 11, name: 'KILLER FREAK', mp: 2, w: 0, l: 2, d: 0, gd: -5, pts: 0 },
      { pos: 12, name: 'ANIFE',        mp: 1, w: 0, l: 1, d: 0, gd: -7, pts: 0 },
      { pos: 13, name: 'DADABOI',      mp: 2, w: 0, l: 2, d: 0, gd: -12, pts: 0 }
    ];
    rerender(DEMO_ROWS);

    window.addEventListener('message', function (ev) {
      var msg = ev && ev.data;
      if (!msg || typeof msg !== 'object') return;
      console.info('[overlay/07-leaderboard] message', msg.type || msg.event || '?', msg.payload || msg.data);
      if (msg.type === 'show') {
        update(msg.data || msg.payload || {});
        show();
      } else if (msg.type === 'update') {
        update(msg.data || msg.payload || {});
      } else if (msg.type === 'hide') {
        hide();
      }
    }, false);
  })();
</script>

<script data-tag="cade-visible-gate-observer-v2">
(function () {
  /* Top-level gated containers — these must be hidden by CSS rule when no
     cade-visible class on body. Force-set to opacity:1 on cade-visible so
     Chrome cross-origin iframe stuck-transition bug cannot leave them at 0. */
  var SEL = '.bg-fill,.bg-vignette,.col-headers,.headline,.matchday-mark,.partners,.row,.rows,.season-mark,.table-block,.top-band,.corner-badge';
  /* Inner row internals — when the row's own entrance transition has
     burnt out before cade-visible, force-set opacity 1.
     NB: `.row` itself is omitted — its slide-in transition animates
     opacity 0 → 1 + translateX(-32px → 0); if the observer forced inline
     opacity:1 the transition couldn't run. */
  var INNER_SEL = '.pos-num,.player-name,.stat,.stat-gd,.pts,.eyebrow,.title,.logo-cade';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    var exit = b.classList.contains('cade-exiting');
    document.querySelectorAll(SEL).forEach(function (el) {
      if (!el.dataset.cadeTransition) {
        el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
        el.dataset.cadeTransition = '1';
      }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.setProperty('visibility', 'visible', 'important');
      } else if (exit) {
        el.style.setProperty('opacity', '0', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
    document.querySelectorAll(INNER_SEL).forEach(function (el) {
      if (!el.dataset.cadeTransition) {
        el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
        el.dataset.cadeTransition = '1';
      }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
      } else if (!exit) {
        el.style.removeProperty('opacity');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>

<script data-tag="cade-demo-mode">
(function () {
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type) {
    window.dispatchEvent(new MessageEvent('message', { data: { type: type } }));
  }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function () { fire('show'); }, 200);
  // Loop: show 8s, hide 4s, repeat.
  setInterval(function () { fire('hide'); }, 12000);
  setTimeout(function () {
    setInterval(function () { fire('show'); }, 12000);
  }, 12000 - 8000); // offset so show fires 8s after each hide
})();
</script>
