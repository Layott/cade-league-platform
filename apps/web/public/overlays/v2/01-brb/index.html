<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #01-MARQUEE — "INTERMISSION" (MARQUEE VARIANT)
  Full-screen brand-heavy waiting screen. Halftone-green stadium BG.
  No upcoming-match list. No ad. No timer. Pure brand presence.
  This is the MARQUEE VARIANT of the pilot — partner logos at the bottom
  scroll continuously left-to-right in a slow news-ticker style.
  All other elements (top logos, title, halftone bg, chevrons, kicker pill,
  watermark) are unchanged from the static pilot at ../01-brb/index.html.

  DATA WIRES: none (pure waiting screen)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — INTERMISSION (Marquee)</title>

<style>
  /* ── REAL BRAND FONTS ───────────────────────────────────────── */
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BoldCondensed.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BlackCondensed.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }

  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: block;
  }

  /* ============================================================
     DESIGN TOKENS (consumed via CSS variables) — Phase 2 of overlay
     design system. SSR may inject `:root { --overlay-* }` overrides
     above this declaration; fallbacks here keep first-deploy a no-op.
     See docs/superpowers/specs/2026-04-29-overlay-design-system.md §3.2.
  ============================================================ */
  :root {
    --overlay-bg-color: #050505;
    --overlay-accent-color: #6bcd06;
    --overlay-secondary-color: #fe036d;
    --overlay-text-color: #ffffff;
    --overlay-font-display: 'Agharti';
    --overlay-font-body: 'Quedora';
    --overlay-partner-strip-show: flex;
  }

  /* ── DESIGN TOKENS (locked brand palette) ─────────────────────
     Local aliases consume the spec-level overlay tokens above so
     existing `var(--green)` / `var(--pink)` / `var(--ink)` consumers
     flow through to the design system. Hex fallbacks keep visual
     defaults unchanged when no SSR token override is injected. */
  :root {
    --green:        var(--overlay-accent-color, #6bcd06);
    --green-glow:   rgba(107, 205, 6, 0.55);
    --green-faint:  rgba(107, 205, 6, 0.18);
    --pink:         var(--overlay-secondary-color, #fe036d);
    --pink-glow:    rgba(254, 3, 109, 0.55);
    --black:        var(--overlay-bg-color, #050505);
    --ink:          var(--overlay-text-color, #ffffff);
    --display:      var(--overlay-font-display, 'Agharti'), 'Impact', sans-serif;
    --accent:       var(--overlay-font-body, 'Quedora'), 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    color-scheme: dark;
    color: var(--ink);
    font-family: var(--accent);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* === STRICT GATE (Category B full-canvas, default-OFF):
     bg-image + inner shells ALL hidden until cade-visible.
     Nothing renders on initial load — postMessage drives visibility. === */
  body { opacity: 1 !important; }
  .bg-image, .bg-vignette, .bg-grain { opacity: 0; }
  .top-band, .partners, .chevrons, .season-mark {
    opacity: 0;
    transform: translateY(12px);
  }
  /* .body has its own absolute centering transform — exclude it from the combined translateY animation. */
  .body { opacity: 0; transform: translate(-50%, calc(-50% + 12px)); }
  body.cade-visible .bg-image,
  body.cade-visible .bg-vignette,
  body.cade-visible .bg-grain { opacity: 1; }
  body.cade-visible .top-band,
  body.cade-visible .partners,
  body.cade-visible .chevrons,
  body.cade-visible .season-mark {
    opacity: 1;
    transform: translateY(0);
  }
  body.cade-visible .body {
    opacity: 1;
    transform: translate(-50%, -50%);
  }
  body.cade-exiting .bg-image,
  body.cade-exiting .bg-vignette,
  body.cade-exiting .bg-grain { opacity: 0; }
  body.cade-exiting .top-band,
  body.cade-exiting .partners,
  body.cade-exiting .chevrons,
  body.cade-exiting .season-mark {
    opacity: 0;
    transform: translateY(-12px);
  }
  body.cade-exiting .body {
    opacity: 0;
    transform: translate(-50%, calc(-50% - 12px));
  }

  /* ── STAGE (1920×1080 transparent canvas, default-OFF) ─────── */
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    isolation: isolate;
  }

  /* ── BG: halftone-green stadium texture ─────────────────────── */
  .bg-image {
    position: absolute;
    inset: -3% -3%;
    background-image: url('/overlays/v2/_assets/designsample/ELITE%20S2%20BG.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform-origin: 50% 50%;
    animation: bg-drift 20s ease-in-out infinite alternate,
               bg-breathe 6s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes bg-drift {
    0%   { transform: scale(1.00) translate(0, 0); }
    100% { transform: scale(1.04) translate(-1.2%, -0.6%); }
  }
  @keyframes bg-breathe {
    0%, 100% { filter: brightness(1.00) saturate(1.00); }
    50%      { filter: brightness(1.02) saturate(1.05); }
  }

  /* dark gradient overlay so text reads cleanly (heavier at bottom 30%) */
  .bg-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(5,5,5,0) 0%, rgba(5,5,5,0.30) 55%, rgba(5,5,5,0.78) 100%),
      linear-gradient(to bottom, rgba(5,5,5,0.10) 0%, rgba(5,5,5,0.10) 50%, rgba(5,5,5,0.55) 75%, rgba(5,5,5,0.85) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* subtle scanline grain to match samples' "screen" feel */
  .bg-grain {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0 1px,
        transparent 1px 3px
      );
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* ── TOP HEADER BAND (CADE | PRO LEAGUE) ────────────────────── */
  .top-band {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    z-index: 10;
  }

  .top-band .logo {
    height: 140px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
  }

  .top-band .logo--cade { height: 128px; }
  .top-band .logo--pro  { height: 152px; }

  .top-band .divider {
    width: 2px;
    height: 110px;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 20%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 80%,
      rgba(255,255,255,0) 100%
    );
    border-radius: 1px;
  }

  /* ── SIDE CHEVRONS (decorative motif from samples) ──────────── */
  .chevrons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 38px;
    z-index: 5;
    pointer-events: none;
  }
  .chevrons--left  { left: 70px; }
  .chevrons--right { right: 70px; }

  .chevron {
    width: 88px;
    height: 64px;
    color: var(--green);
    opacity: 0.55;
    animation: chev-pulse 4.2s ease-in-out infinite;
  }
  .chevron svg { width: 100%; height: 100%; display: block; }

  .chevrons--left  .chevron:nth-child(1) { animation-delay: 0s;    }
  .chevrons--left  .chevron:nth-child(2) { animation-delay: 0.4s;  }
  .chevrons--left  .chevron:nth-child(3) { animation-delay: 0.8s;  }
  .chevrons--left  .chevron:nth-child(4) { animation-delay: 1.2s;  }
  .chevrons--right .chevron:nth-child(1) { animation-delay: 0.6s;  }
  .chevrons--right .chevron:nth-child(2) { animation-delay: 1.0s;  }
  .chevrons--right .chevron:nth-child(3) { animation-delay: 1.4s;  }
  .chevrons--right .chevron:nth-child(4) { animation-delay: 1.8s;  }

  @keyframes chev-pulse {
    0%, 100% { opacity: 0.30; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(6px); }
  }
  .chevrons--right .chevron {
    animation-name: chev-pulse-right;
  }
  @keyframes chev-pulse-right {
    0%, 100% { opacity: 0.30; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(-6px); }
  }

  /* ── BODY: kicker + giant title + subtitle ──────────────────── */
  .body {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1500px;
    text-align: center;
    z-index: 20;
  }

  .kicker {
    display: inline-block;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 32px;
    letter-spacing: 0.22em;
    color: var(--ink);
    text-transform: uppercase;
    padding: 10px 26px;
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    margin-bottom: 24px;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .title {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 320px;
    line-height: 0.86;
    letter-spacing: -0.012em;
    color: var(--ink);
    text-transform: uppercase;
    margin: 0;
    /* layered glow + crisp edge */
    text-shadow:
      0 0 1px rgba(255,255,255,0.85),
      0 6px 22px rgba(0,0,0,0.65),
      0 0 38px rgba(107,205,6,0.18);
    animation: title-pulse 3.4s ease-in-out infinite;
  }

  @keyframes title-pulse {
    0%, 100% {
      text-shadow:
        0 0 1px rgba(255,255,255,0.85),
        0 6px 22px rgba(0,0,0,0.65),
        0 0 22px rgba(107,205,6,0.10);
    }
    50% {
      text-shadow:
        0 0 1px rgba(255,255,255,1),
        0 6px 22px rgba(0,0,0,0.65),
        0 0 64px rgba(107,205,6,0.34);
    }
  }

  /* a thin pink underline accent — micro brand cue */
  .title-rule {
    width: 220px;
    height: 5px;
    margin: 28px auto 22px;
    background: var(--pink);
    border-radius: 3px;
    box-shadow:
      0 0 14px var(--pink-glow),
      0 0 28px rgba(254,3,109,0.30);
  }

  .subtitle {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 38px;
    letter-spacing: 0.32em;
    color: var(--ink);
    text-transform: uppercase;
    opacity: 0.92;
    animation: subtitle-breathe 4s ease-in-out infinite;
  }

  @keyframes subtitle-breathe {
    0%, 100% { opacity: 0.72; letter-spacing: 0.32em; }
    50%      { opacity: 1.00; letter-spacing: 0.36em; }
  }

  /* ── BOTTOM PARTNER STRIP (MARQUEE VARIANT) ─────────────────── */
  /*  Logos scroll continuously right→left in a steady news-ticker.
      The strip wrapper uses overflow:hidden; inside, a track of the
      partner row duplicated 3× translates from 0 → -33.333% over
      40s linear, looping seamlessly because the duplicates are exact
      copies of the single source row.
      Label "OFFICIAL PARTNERS" stays static above the strip.        */
  .partners {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 64px;
    display: var(--overlay-partner-strip-show, flex);
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 12;
  }

  .partners-label {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.70);
    text-transform: uppercase;
  }

  /* Outer container clips the moving track + provides the chrome
     (rounded glass card) that the static pilot used. */
  .marquee {
    position: relative;
    width: 1080px;
    max-width: 90%;
    overflow: hidden;
    padding: 18px 0;
    background: rgba(8,8,8,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    /* Fade the very edges so logos do not pop in/out hard. */
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
            mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
  }

  /* The moving track: width auto so it grows with all child rows.
     We translate by -33.333% so the second copy slides into the
     position the first copy started at — looking identical → loops. */
  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 40s linear infinite;
    will-change: transform;
  }

  @keyframes marquee-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-33.3333%); }
  }

  /* Each repeated group keeps the same internal spacing as the
     original static row so cadence reads identical to the pilot. */
  .marquee-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 76px;
    padding: 0 38px;
    flex-shrink: 0;
  }

  .marquee-group .partner {
    height: 80px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }

  .marquee-group .partner--gameevo  { height: 80px; }
  .marquee-group .partner--pride    { height: 80px; }
  .marquee-group .partner--africa   { height: 80px; }
  .marquee-group .partner--trace    { height: 80px; }
  .marquee-group .partner--oas      { height: 80px; }

  /* ── CORNER WATERMARK (season ID, very subtle) ──────────────── */
  .season-mark {
    position: absolute;
    top: 30px;
    right: 38px;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.40em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    z-index: 12;
  }
  .season-mark::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 10px;
    transform: translateY(-1px);
    box-shadow: 0 0 10px var(--green-glow);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.55; transform: translateY(-1px) scale(1); }
    50%      { opacity: 1;    transform: translateY(-1px) scale(1.2); }
  }
</style>
</head>
<body>
  <main class="stage">

    <!-- BG halftone + vignette + grain -->

    <div class="bg-vignette" aria-hidden="true"></div>

    <!-- Season watermark -->

    <header class="top-band">

          <path d="M48 6 L76 32 L48 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

        <svg viewBox="0 0 88 64" fill="none" xmlns="http://www.w3.org/2000/svg">

          <path d="M48 6 L76 32 L48 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="chevron">

    <!-- Right chevrons (mirrored) -->
    <div class="chevrons chevrons--right" aria-hidden="true">
      <div class="chevron">
        <svg viewBox="0 0 88 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M74 6 L46 32 L74 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 6 L12 32 L40 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="chevron">
        <svg viewBox="0 0 88 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M74 6 L46 32 L74 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 6 L12 32 L40 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="chevron">
        <svg viewBox="0 0 88 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M74 6 L46 32 L74 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 6 L12 32 L40 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="chevron">
        <svg viewBox="0 0 88 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M74 6 L46 32 L74 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 6 L12 32 L40 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Body: kicker + INTERMISSION + subtitle -->
    <section class="body">

  <script>
    /* === SPLIT GATE: master visibility ===
       Body always opacity 1 — bg-image stays visible.
       Body class cade-visible/cade-exiting drives inner-content opacity. */
    (function cadeGate() {
      'use strict';
      function show() {
        document.body.classList.remove('cade-exiting');
        document.body.classList.add('cade-visible');
      }
      function hide() {
        document.body.classList.remove('cade-visible');
        document.body.classList.add('cade-exiting');
      }
      window.addEventListener('message', function (ev) {
        var msg = ev && ev.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'show' || msg.type === 'update') show();
        else if (msg.type === 'hide') hide();
      }, false);
    })();
  </script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  var SEL = '.bg-image,.bg-vignette,.bg-grain,.body,.chevrons,.partners,.season-mark,.top-band';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    document.querySelectorAll(SEL).forEach(function(el){
      // Set transition once so opacity flips animate smoothly.
      if (!el.dataset.cadeTransition) {
        el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
        el.dataset.cadeTransition = '1';
      }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.setProperty('visibility', 'visible', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function(){ fire('show'); }, 200);
  // Loop: show 5s, hide 3s, repeat.
  setInterval(function(){ fire('hide'); }, 8000);
  setTimeout(function(){
    setInterval(function(){ fire('show'); }, 8000);
  }, 8000 - 5000); // offset so show fires 5s after each hide
})();
</script>
