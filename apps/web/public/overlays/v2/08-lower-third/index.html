<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CADE Lower Third — Name Intro</title>
<!-- DATA WIRES: name (string), role (string) -->
<style>
  /* ============================================================
     CADE Esports League — Overlay #08 : Lower Third (Name Intro)
     Canvas : 1920x1080, transparent
     Anchor : bottom-left, 80px margin from left + bottom
     Size   : auto-fit content width, ~150px tall
     Entry  : pre-tip accent stroke -> bar slide from left
              -> name letters scale-in -> role slide up   (~0.9s)
     Exit   : name + role fade (0.25s) -> bar slide out left
     Control: postMessage driven (no auto-loop)
              window.postMessage({ type:'update', data:{ name, role } }, '*')
              window.postMessage({ type:'show' }, '*')
              window.postMessage({ type:'hide' }, '*')
     ============================================================ */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    font-family: "Quedora", "Inter", sans-serif;
  }
  /* === STRICT GATE: nothing renders / animates until {type:'show'} === */
  body { opacity: 0; transition: opacity 0.4s ease; }
  body.cade-visible { opacity: 1; }
  body.cade-exiting { opacity: 0; }
  body:not(.cade-visible):not(.cade-exiting) * {
    animation-play-state: paused !important;
  }

  /* ---- REAL BRAND FONTS (woff2 from PILOT BRB paths) ---- */
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BoldCondensed.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BlackCondensed.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: block;
  }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }

  /* ===== Lower third anchored group =====
     Auto-fits content width (no fixed 860px). */
  .lt {
    position: absolute;
    left: 80px;
    bottom: 80px;
    width: fit-content;
    min-height: 130px;
    display: inline-block;
    /* Initial state: hidden until first show/update message */
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
  }

  /* When entering: visible + animations play forward */
  .lt.entering { opacity: 1; }

  /* When exiting: animations play in reverse */
  .lt.exiting  { opacity: 1; }

  /* ===== Pre-tip accent (thin green stroke ahead of bar) ===== */
  .pretip {
    position: absolute;
    left: -14px;
    top: 14px;
    bottom: 14px;
    width: 6px;
    background: #6bcd06;
    box-shadow:
      0 0 16px rgba(107, 205, 6, 0.65),
      0 0 32px rgba(107, 205, 6, 0.35);
    transform-origin: top center;
    transform: scaleY(0);
    border-radius: 1px;
    opacity: 0;
  }

  .pretip::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 50%;
    height: 2px;
    width: 0;
    background: linear-gradient(90deg, #6bcd06 0%, rgba(107, 205, 6, 0) 100%);
    transform: translateY(-50%);
    opacity: 0;
  }

  .lt.entering .pretip {
    animation: pretipDraw 0.6s ease-out forwards;
  }
  .lt.entering .pretip::after {
    animation: pretipTrail 0.7s ease-out forwards;
  }
  .lt.exiting .pretip { opacity: 0; }
  .lt.exiting .pretip::after { opacity: 0; width: 0; }

  @keyframes pretipDraw {
    0%   { transform: scaleY(0); opacity: 0; }
    20%  { opacity: 1; }
    40%  { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  @keyframes pretipTrail {
    0%   { width: 0; opacity: 0; }
    20%  { opacity: 1; }
    100% { width: 140px; opacity: 1; }
  }

  /* ===== The main bar (black w/ subtle gradient) ===== */
  .bar {
    position: relative;
    display: inline-block;
    background:
      linear-gradient(135deg,
        rgba(15, 15, 15, 0.96) 0%,
        rgba(0, 0, 0, 0.96) 55%,
        rgba(10, 10, 10, 0.98) 100%);
    border-left: 8px solid #6bcd06;
    border-radius: 4px 10px 10px 4px;
    box-shadow:
      0 14px 40px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset,
      0 0 28px rgba(107, 205, 6, 0.12);
    transform: translateX(calc(-100% - 120px));
    overflow: hidden;
    will-change: transform;
  }

  .lt.entering .bar {
    animation: barSlideIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.18s;
  }
  .lt.exiting .bar {
    animation: barSlideOut 0.7s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    animation-delay: 0.25s;
  }

  /* Pink edge accent + thin sweep shine */
  .bar::before {
    content: "";
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg,
      rgba(254, 3, 109, 0) 0%,
      #fe036d 25%,
      #fe036d 75%,
      rgba(254, 3, 109, 0) 100%);
    opacity: 0.85;
  }

  .bar::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -40%;
    width: 40%;
    background: linear-gradient(110deg,
      transparent 0%,
      rgba(255, 255, 255, 0.06) 45%,
      rgba(107, 205, 6, 0.18) 50%,
      rgba(255, 255, 255, 0.06) 55%,
      transparent 100%);
    transform: skewX(-18deg);
    opacity: 0;
  }

  .lt.entering .bar::after {
    animation: barShine 1.1s ease-in-out forwards;
    animation-delay: 0.5s;
  }

  @keyframes barSlideIn {
    0%   { transform: translateX(calc(-100% - 120px)); }
    100% { transform: translateX(0); }
  }

  @keyframes barSlideOut {
    0%   { transform: translateX(0); }
    100% { transform: translateX(calc(-100% - 120px)); }
  }

  @keyframes barShine {
    0%   { left: -40%; opacity: 0; }
    20%  { opacity: 1; }
    100% { left: 110%; opacity: 0; }
  }

  /* ===== Content container (inside the bar) =====
     Auto-fits content width via inline-flex; left padding accounts
     for the optional Pro League logo block when present. */
  .content {
    position: relative;
    padding: 18px 28px 18px 22px;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    min-height: 130px;
  }

  /* ===== Pro League logo slot (left side, before green accent) ===== */
  .logo-slot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    opacity: 0;
    transform: translateX(-8px) scale(0.85);
  }

  .lt.entering .logo-slot {
    animation: logoIn 0.5s cubic-bezier(0.18, 1.25, 0.4, 1) forwards;
    animation-delay: 0.35s;
  }
  .lt.exiting .logo-slot {
    animation: logoOut 0.25s ease-out forwards;
  }

  .logo-slot img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(107, 205, 6, 0.35));
  }

  /* Fallback chevron (shown when image fails or is missing) */
  .logo-slot .chevron {
    display: none;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 10px 0 10px 14px;
    border-color: transparent transparent transparent #6bcd06;
    filter: drop-shadow(0 0 8px rgba(107, 205, 6, 0.6));
  }
  .logo-slot.fallback img { display: none; }
  .logo-slot.fallback .chevron { display: block; }

  @keyframes logoIn {
    0%   { opacity: 0; transform: translateX(-8px) scale(0.85); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes logoOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== Text block (name + role stacked) ===== */
  .text-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }

  /* ===== NAME : Agharti, per-letter scale-in ===== */
  .name {
    font-family: "Agharti", "Oswald", "Impact", sans-serif;
    font-size: 68px;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    gap: 2px;
    text-shadow:
      0 2px 10px rgba(107, 205, 6, 0.25),
      0 0 1px rgba(255, 255, 255, 0.8);
  }

  .name .letter {
    display: inline-block;
    opacity: 0;
    transform: scale(0.4) translateY(8px);
    will-change: transform, opacity;
  }
  /* preserve word breaks (real spaces collapse in flex; use width) */
  .name .letter.space { width: 0.4em; }

  .lt.entering .name .letter {
    animation: letterIn 0.5s cubic-bezier(0.18, 1.25, 0.4, 1) forwards;
  }
  .lt.exiting .name .letter {
    animation: letterOut 0.25s ease-out forwards;
  }

  @keyframes letterIn {
    0%   { opacity: 0; transform: scale(0.4) translateY(8px); }
    60%  { opacity: 1; transform: scale(1.08) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes letterOut {
    0%   { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(1) translateY(-4px); }
  }

  /* ===== ROLE : Quedora, slide up after name lands ===== */
  .role-wrap {
    overflow: hidden;
    height: 36px;
  }

  .role {
    font-family: "Quedora", "Inter", sans-serif;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #e8e8e8;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    transform: translateY(100%);
    opacity: 0;
    will-change: transform, opacity;
  }

  .role::before {
    content: "";
    display: inline-block;
    width: 24px;
    height: 2px;
    background: #fe036d;
    box-shadow: 0 0 10px rgba(254, 3, 109, 0.8);
    transform: translateY(-2px);
  }

  .lt.entering .role {
    animation: roleSlideIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.55s;
  }
  .lt.exiting .role {
    animation: roleSlideOut 0.25s ease-out forwards;
  }

  @keyframes roleSlideIn {
    0%   { transform: translateY(100%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes roleSlideOut {
    0%   { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }

  /* small floating tag block anchored top-right of bar */
  .pip {
    position: absolute;
    top: 12px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Quedora", "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    opacity: 0;
  }
  .pip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #6bcd06;
    box-shadow: 0 0 10px rgba(107, 205, 6, 0.9);
    animation: pipPulse 1.4s ease-in-out infinite;
  }
  .lt.entering .pip {
    animation: pipIn 0.5s ease-out forwards;
    animation-delay: 0.7s;
  }
  .lt.exiting .pip {
    animation: pipOut 0.25s ease-out forwards;
  }
  @keyframes pipIn  { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes pipOut { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pipPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.4; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="lt" data-overlay="08-lower-third" id="lt">
      <!-- pre-tip accent stroke (arrives before the bar) -->
      <span class="pretip" aria-hidden="true"></span>

      <!-- main bar -->
      <div class="bar">
        <div class="content">
          <!-- Pro League logo slot (left of green accent) -->
          <div class="logo-slot" id="logoSlot">
            <img id="logoImg" src="/overlays/v2/_assets/logos/pro%20league%20.png" alt="Pro League" />
            <span class="chevron" aria-hidden="true"></span>
          </div>

          <!-- Stacked name + role -->
          <div class="text-block">
            <!-- NAME (wire: name) - letters split for per-letter stagger -->
            <div class="name" id="nameEl" data-wire="name">
              <span class="letter">J</span><span class="letter">O</span><span class="letter">S</span><span class="letter">H</span>
            </div>

            <!-- ROLE (wire: role) -->
            <div class="role-wrap">
              <div class="role" id="roleEl" data-wire="role">HEAD CASTER</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ====== Element refs ======
  var lt        = document.getElementById('lt');
  var nameEl    = document.getElementById('nameEl');
  var roleEl    = document.getElementById('roleEl');
  var logoSlot  = document.getElementById('logoSlot');
  var logoImg   = document.getElementById('logoImg');

  // ====== Current data state ======
  var current = {
    name: nameEl.textContent.trim() || 'JOSH',
    role: (roleEl.textContent || '').trim() || 'HEAD CASTER'
  };

  // ====== Logo: graceful fallback to chevron on 404 ======
  if (logoImg) {
    logoImg.addEventListener('error', function () {
      logoSlot.classList.add('fallback');
    });
    // If already cached and broken
    if (logoImg.complete && logoImg.naturalWidth === 0) {
      logoSlot.classList.add('fallback');
    }
  }

  // ====== Helper: split a string into per-letter spans with staggered delays ======
  function splitIntoLetters(target, text) {
    target.innerHTML = '';
    var clean = String(text == null ? '' : text).toUpperCase();
    var letters = Array.from(clean);
    var visibleIdx = 0;
    for (var i = 0; i < letters.length; i++) {
      var ch  = letters[i];
      var span = document.createElement('span');
      span.className = 'letter';
      if (ch === ' ') {
        span.classList.add('space');
        span.innerHTML = '&nbsp;';
      } else {
        span.textContent = ch;
      }
      // stagger 60ms per visible letter (matches original feel)
      span.style.animationDelay = (visibleIdx * 60) + 'ms';
      visibleIdx++;
      target.appendChild(span);
    }
  }

  // ====== Render data into DOM (no animation triggering) ======
  // Accepts either {name, role} (legacy demo) or {displayName, gamerTag}
  // (Plan 51 lowerThirdSchema from broadcast v2 control panel).
  function render(data) {
    if (!data) return;
    var nm = (typeof data.name === 'string' && data.name) ||
             (typeof data.displayName === 'string' && data.displayName) || '';
    var rl = (typeof data.role === 'string' && data.role) ||
             (typeof data.gamerTag === 'string' && data.gamerTag) || '';
    if (nm) {
      current.name = nm;
      splitIntoLetters(nameEl, current.name);
    }
    if (rl) {
      current.role = rl;
      roleEl.textContent = String(current.role).toUpperCase();
    }
  }

  // ====== Force reflow so animation restarts cleanly ======
  function reflow(el) {
    // eslint-disable-next-line no-unused-expressions
    el.offsetWidth;
  }

  // ====== Animation control ======
  function playEntry() {
    lt.classList.remove('exiting');
    lt.classList.remove('entering');
    reflow(lt);
    lt.classList.add('entering');
  }

  function playExit() {
    lt.classList.remove('entering');
    lt.classList.remove('exiting');
    reflow(lt);
    lt.classList.add('exiting');
    // After exit completes, hide fully so it's off the canvas
    var EXIT_MS = 1100; // longest combined exit duration
    setTimeout(function () {
      // Only hide if still in exiting state (no new show() during the exit)
      if (lt.classList.contains('exiting')) {
        lt.classList.remove('exiting');
        // back to baseline opacity:0 (set on .lt) — no class active
      }
    }, EXIT_MS);
  }

  // Initial state: hidden, no animation. Pre-render letters from default copy
  // so first 'show' has something to animate even without an 'update'.
  splitIntoLetters(nameEl, current.name);
  roleEl.textContent = current.role.toUpperCase();
  // (no class on .lt -> opacity:0 baseline, off-screen visually)

  // ====== postMessage listener ======
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;

    switch (msg.type) {
      case 'update':
        render(msg.data || {});
        playEntry();
        break;
      case 'show':
        playEntry();
        break;
      case 'hide':
        playExit();
        break;
      default:
        // ignore unknown types
        break;
    }
  });

  // Expose a tiny debug hook (handy when opened directly in a browser)
  window.__lowerThird = {
    update: function (data) { render(data || {}); playEntry(); },
    show: playEntry,
    hide: playExit,
    state: function () { return Object.assign({}, current); }
  };
})();
</script>

<script>
/* === STRICT GATE: master visibility, controlled ONLY by parent postMessage. ===
   Operator drives via Update & Show / Hide. No auto-demo, no fallback timers. */
(function cadeGate() {
  'use strict';
  var inIframe = true;
  try { inIframe = window.top !== window.self; } catch (e) { inIframe = true; }
  function show() {
    document.body.classList.remove('cade-exiting');
    document.body.classList.add('cade-visible');
  }
  function hide() {
    document.body.classList.remove('cade-visible');
    document.body.classList.add('cade-exiting');
  }
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'show' || msg.type === 'update') show();
    else if (msg.type === 'hide') hide();
  }, false);
})();
</script>
</body>
