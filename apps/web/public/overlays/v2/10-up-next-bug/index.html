<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CADE Up Next Bug</title>
<!-- DATA WIRES: player1 = {name, slug}, player2 = {name, slug} -->
<!-- postMessage API:
       { type: 'update', data: { player1: { name, slug }, player2: { name, slug } } }
       { type: 'show' }
       { type: 'hide' }
     Photos resolved as: /overlays/v2/_assets/players/processed/<slug>/headshot_01_nobg.png
-->
<style>
  /* ============================================================
     CADE Esports League — Overlay #10 : Up Next Bug
     Canvas   : 1920x1080 transparent
     Position : bottom-center, 60px margin
     Size     : auto-fit (capped at 900px) composite bar
     Brand    : #6bcd06 green / #fe036d pink / black
     Fonts    : Agharti (names) / Quedora (label)
     ============================================================ */

  /* ---------- Real font faces ---------- */
  @font-face {
    font-family: "Agharti";
    src: url("/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.woff2") format("woff2"),
         url("/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Agharti";
    src: url("/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.woff2") format("woff2"),
         url("/overlays/v2/_assets/fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.ttf") format("truetype");
    font-weight: 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Quedora";
    src: url("/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Bold.woff2") format("woff2"),
         url("/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/ttf/Quedora-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Quedora";
    src: url("/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Extrabold.woff2") format("woff2"),
         url("/overlays/v2/_assets/fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/ttf/Quedora-Extrabold.ttf") format("truetype");
    font-weight: 800;
    font-style: normal;
    font-display: block;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: "Agharti", "Oswald", "Bebas Neue", "Impact", sans-serif;
    color: #fff;
  }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: transparent;
  }

  /* ------------------------------------------------------------
     Root bug container (bottom-center anchor) — auto-fit width
     ------------------------------------------------------------ */
  .bug {
    position: absolute;
    left: 50%;
    bottom: 60px;
    /* width is set inline by JS to fit names; default starting state */
    width: auto;
    height: 180px;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }
  .bug.visible {
    visibility: visible;
  }
  .bug.entering {
    animation: bugEnter 1.1s cubic-bezier(.77,.0,.18,1) forwards;
  }
  .bug.exiting {
    animation: bugExit 0.5s cubic-bezier(.77,.0,.18,1) forwards;
  }
  @keyframes bugEnter {
    0%   { transform: translateX(-50%) translateY(260px); opacity: 0; }
    50%  { transform: translateX(-50%) translateY(260px); opacity: 0; }
    85%  { transform: translateX(-50%) translateY(-14px); opacity: 1; }  /* overshoot */
    100% { transform: translateX(-50%) translateY(0);     opacity: 1; }  /* land */
  }
  @keyframes bugExit {
    0%   { transform: translateX(-50%) translateY(0)  scaleX(1);    opacity: 1; }
    100% { transform: translateX(-50%) translateY(0)  scaleX(0.05); opacity: 0; }
  }

  /* ------------------------------------------------------------
     Label strip ("UP NEXT") — flashes in first
     ------------------------------------------------------------ */
  .label-strip {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%) scaleX(0.1);
    width: 280px;
    height: 38px;
    background: #fe036d;
    border: 2px solid #fe036d;
    border-bottom: none;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 0 30px rgba(254, 3, 109, 0.55);
    z-index: 6;
    opacity: 0;
  }
  .bug.entering .label-strip { animation: labelFlash 1.1s cubic-bezier(.77,.0,.18,1) forwards; animation-delay: 0.05s; }
  @keyframes labelFlash {
    0%   { opacity: 0; transform: translateX(-50%) scaleX(0.1); }
    20%  { opacity: 1; transform: translateX(-50%) scaleX(1.08); }  /* flash appear */
    35%  { opacity: 0.2; transform: translateX(-50%) scaleX(1); }
    50%  { opacity: 1; transform: translateX(-50%) scaleX(1); }
    65%  { opacity: 0.4; transform: translateX(-50%) scaleX(1); }
    100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
  }

  .label-strip .dot {
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px #fff;
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%,100% { opacity: 0.3; transform: scale(0.85); }
    50%     { opacity: 1;   transform: scale(1.15); }
  }
  .label-strip .label-text {
    font-family: "Quedora", "Rajdhani", "Saira Condensed", "Oswald", sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #fff;
    text-transform: uppercase;
  }

  /* ------------------------------------------------------------
     Main bar — black body with green accent frame
     ------------------------------------------------------------ */
  .bar {
    position: absolute;
    top: 30px;
    left: 0;
    width: 100%;
    height: 150px;
    background: linear-gradient(180deg, #0d0d0d 0%, #000 100%);
    border: 2px solid rgba(107, 205, 6, 0.9);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.8) inset,
      0 0 24px rgba(107, 205, 6, 0.35),
      0 10px 28px rgba(0,0,0,0.6);
    clip-path: polygon(
      24px 0, calc(100% - 24px) 0,
      100% 24px, 100% calc(100% - 24px),
      calc(100% - 24px) 100%, 24px 100%,
      0 calc(100% - 24px), 0 24px
    );
    overflow: hidden;
  }

  /* inner green hairline */
  .bar::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(107, 205, 6, 0.35);
    clip-path: polygon(
      20px 0, calc(100% - 20px) 0,
      100% 20px, 100% calc(100% - 20px),
      calc(100% - 20px) 100%, 20px 100%,
      0 calc(100% - 20px), 0 20px
    );
    pointer-events: none;
  }

  /* subtle diagonal sheen */
  .bar::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(107, 205, 6, 0.08) 45%,
      rgba(255, 255, 255, 0.12) 50%,
      rgba(107, 205, 6, 0.08) 55%,
      transparent 100%
    );
    transform: skewX(-18deg);
    pointer-events: none;
    opacity: 0;
  }
  .bug.entering .bar::after { animation: barSheen 1.4s ease-in-out forwards; animation-delay: 0.45s; }
  @keyframes barSheen {
    0%   { left: -40%; opacity: 0; }
    50%  { left: 140%; opacity: 0.9; }
    100% { left: 140%; opacity: 0; }
  }

  /* ------------------------------------------------------------
     Player panels (left & right) — flexible widths
     ------------------------------------------------------------ */
  .player {
    position: absolute;
    top: 30px;
    height: 150px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 28px;
    z-index: 3;
    opacity: 0;
  }

  .player-left {
    left: 0;
    justify-content: flex-start;
  }
  .player-right {
    right: 0;
    justify-content: flex-end;
    flex-direction: row-reverse;
  }
  .bug.entering .player-left  { animation: panelInLeft  0.7s cubic-bezier(.77,.0,.18,1) forwards; animation-delay: 0.35s; }
  .bug.entering .player-right { animation: panelInRight 0.7s cubic-bezier(.77,.0,.18,1) forwards; animation-delay: 0.35s; }

  @keyframes panelInLeft {
    0%   { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes panelInRight {
    0%   { opacity: 0; transform: translateX(60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* circular avatar with real photo + accent ring */
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
    border: 3px solid #000;
    box-shadow:
      0 0 0 4px #6bcd06,
      0 0 0 5px #000,
      0 0 22px rgba(107, 205, 6, 0.55),
      0 6px 14px rgba(0,0,0,0.55);
  }
  .player-right .avatar {
    box-shadow:
      0 0 0 4px #fe036d,
      0 0 0 5px #000,
      0 0 22px rgba(254, 3, 109, 0.55),
      0 6px 14px rgba(0,0,0,0.55);
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 18%;
    display: block;
  }
  /* subtle inner gloss */
  .avatar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.18) 0%, transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35) 0%, transparent 55%);
    pointer-events: none;
  }

  .name-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
  }
  .player-right .name-block {
    align-items: flex-end;
  }
  .name-block .tag {
    font-family: "Quedora", "Rajdhani", "Saira Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #6bcd06;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .player-right .name-block .tag {
    color: #fe036d;
  }
  .name-block .name {
    font-family: "Agharti", "Oswald", "Bebas Neue", "Impact", sans-serif;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ------------------------------------------------------------
     VS divider — pops with scale + rotation
     ------------------------------------------------------------ */
  .vs {
    position: absolute;
    top: 30px;
    left: 50%;
    width: 110px;
    height: 150px;
    transform: translateX(-50%) scale(0) rotate(-180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
  }
  .bug.entering .vs { animation: vsPop 0.85s cubic-bezier(.55,1.6,.5,1) forwards; animation-delay: 0.55s; }

  .vs .vs-core {
    position: relative;
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    border: 2px solid #fe036d;
    transform: rotate(45deg);
    box-shadow:
      0 0 0 3px #000,
      0 0 24px rgba(254, 3, 109, 0.55),
      inset 0 0 12px rgba(254, 3, 109, 0.25);
  }
  .vs .vs-core::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(107, 205, 6, 0.55);
  }
  .vs .vs-text {
    font-family: "Agharti", "Oswald", "Bebas Neue", sans-serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    transform: rotate(-45deg);
    text-shadow:
      0 0 10px rgba(254, 3, 109, 0.9),
      0 2px 2px rgba(0,0,0,0.6);
  }

  @keyframes vsPop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0) rotate(-180deg); }
    35%  { opacity: 1; transform: translateX(-50%) scale(1.25) rotate(10deg); }
    55%  { opacity: 1; transform: translateX(-50%) scale(0.92) rotate(-6deg); }
    75%  { opacity: 1; transform: translateX(-50%) scale(1.05) rotate(2deg); }
    100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
  }

  /* ------------------------------------------------------------
     Corner accents on the main bar
     ------------------------------------------------------------ */
  .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    z-index: 2;
  }
  .corner.tl { top: 8px;  left: 8px;  border-top: 2px solid #6bcd06; border-left: 2px solid #6bcd06; }
  .corner.tr { top: 8px;  right: 8px; border-top: 2px solid #6bcd06; border-right: 2px solid #6bcd06; }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid #6bcd06; border-left: 2px solid #6bcd06; }
  .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid #6bcd06; border-right: 2px solid #6bcd06; }

  /* helper for off-screen name measurement */
  .measure {
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    pointer-events: none;
    left: -9999px;
    top: -9999px;
    font-family: "Agharti", "Oswald", "Bebas Neue", "Impact", sans-serif;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="bug" id="bug">

    <!-- ============== UP NEXT label strip ============== -->
    <div class="label-strip">
      <span class="dot"></span>
      <span class="label-text">UP NEXT</span>
      <span class="dot"></span>
    </div>

    <!-- ============== Main bar ============== -->
    <div class="bar">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <!-- ============== Player LEFT ============== -->
    <div class="player player-left">
      <div class="avatar">
        <img id="photo1" alt="" />
      </div>
      <div class="name-block">
        <div class="tag">Player 1</div>
        <div class="name" id="name1">FARUK</div>
      </div>
    </div>

    <!-- ============== VS divider ============== -->
    <div class="vs">
      <div class="vs-core">
        <div class="vs-text">VS</div>
      </div>
    </div>

    <!-- ============== Player RIGHT ============== -->
    <div class="player player-right">
      <div class="avatar">
        <img id="photo2" alt="" />
      </div>
      <div class="name-block">
        <div class="tag">Player 2</div>
        <div class="name" id="name2">KAYKAY</div>
      </div>
    </div>

  </div>

  <span class="measure" id="measure"></span>

</div>

<script>
  (function () {
    var bug = document.getElementById('bug');
    var name1El = document.getElementById('name1');
    var name2El = document.getElementById('name2');
    var photo1El = document.getElementById('photo1');
    var photo2El = document.getElementById('photo2');
    var measureEl = document.getElementById('measure');

    var state = {
      player1: { name: 'FARUK',  slug: 'faruk'  },
      player2: { name: 'KAYKAY', slug: 'kaykay' }
    };

    function photoUrl(slug) {
      return '/overlays/v2/_assets/players/processed/' + slug + '/headshot_01_nobg.png';
    }

    /**
     * Auto-fit bar width to player names.
     * Avatar(120) + gap(20) + name + padding(28*2) per side = ~196 + name width.
     * Plus 110 VS column. Capped at 900px, floor at 620px.
     */
    function computeWidth() {
      measureEl.textContent = state.player1.name;
      var w1 = measureEl.getBoundingClientRect().width;
      measureEl.textContent = state.player2.name;
      var w2 = measureEl.getBoundingClientRect().width;
      var widest = Math.max(w1, w2);
      // each side panel: avatar 120 + gap 20 + name + padding 28*2 = 196 + name
      var sidePanel = 196 + widest;
      // total = 2 sides + VS 110
      var total = (sidePanel * 2) + 110;
      // clamp
      if (total < 620) total = 620;
      if (total > 900) total = 900;
      return Math.round(total);
    }

    function applyWidth() {
      bug.style.width = computeWidth() + 'px';
    }

    function applyContent() {
      name1El.textContent = state.player1.name;
      name2El.textContent = state.player2.name;
      photo1El.src = photoUrl(state.player1.slug);
      photo2El.src = photoUrl(state.player2.slug);
      photo1El.alt = state.player1.name;
      photo2El.alt = state.player2.name;
      applyWidth();
    }

    function playEntry() {
      bug.classList.add('visible');
      bug.classList.remove('exiting');
      // restart entry animation
      bug.classList.remove('entering');
      // force reflow
      void bug.offsetWidth;
      bug.classList.add('entering');
    }

    function show() {
      playEntry();
    }

    function hide() {
      bug.classList.remove('entering');
      bug.classList.add('exiting');
      // hide visibility after exit animation
      setTimeout(function () {
        if (bug.classList.contains('exiting')) {
          bug.classList.remove('visible');
        }
      }, 520);
    }

    function update(data) {
      if (!data) return;
      if (data.player1) {
        if (typeof data.player1.name === 'string') state.player1.name = data.player1.name;
        if (typeof data.player1.slug === 'string') state.player1.slug = data.player1.slug;
      }
      if (data.player2) {
        if (typeof data.player2.name === 'string') state.player2.name = data.player2.name;
        if (typeof data.player2.slug === 'string') state.player2.slug = data.player2.slug;
      }
      applyContent();
      playEntry();
    }

    window.addEventListener('message', function (ev) {
      var msg = ev && ev.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'update') {
        update(msg.data || {});
      } else if (msg.type === 'show') {
        show();
      } else if (msg.type === 'hide') {
        hide();
      }
    }, false);

    // Initial render: visible with FARUK vs KAYKAY
    applyContent();
    // wait for fonts so width measurement uses real glyphs
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        applyWidth();
        playEntry();
      });
    } else {
      playEntry();
    }
  })();
</script>

</body>
</html>
