<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #14 — TOP SCORERS (GOLDEN PAD)
  Top-10 goal-scorer board. Podium-style: top 3 elevated as cards
  (#1 centered + tallest + subtle gold halo / crown / rim, #2 left,
  #3 right). Positions 4-10 occupy a 7-column tail strip below.
  Pilot design system: halftone-green stadium BG, top CADE+Pro League
  logo pair, side chevrons, bottom marquee partner strip.

  GOLD IS RESTRAINED: appears ONLY on the #1 player (crown halo, rim,
  pink→gold rank tint). Everything else is pilot green/pink.

  DATA WIRES: scorers[] = {rank, name, slug, photoUrl, goals}
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — Top Scorers · Golden Pad</title>


<script id="cade-token-bootstrap">
(function() {
  // Wave 2 Stage 3 — cross-document design + text + partner propagation.
  //
  // Read base64-encoded JSON token maps from the iframe URL query
  // string and emit <style> blocks that win the CSS source-order

  //   tokens / previewTokens     — { 'bg-color': '#000', ... }
  //   textTokens / previewTextTokens — { '<elementId>': { visible?,
  //     content?, styles?: { color, fontFamily, fontSize, ... } } }

  //     layout?: { anchor, positionXPx, positionYPx, scalePct,
  //                itemSpacingPx, orientation, justification,
  //                zIndex, visible },
  //     logos?: [ { partnerKey, label, alt, fileUrl, visible?, sort? } ]
  //   }

        // does NOT fall through to the HTML hard-coded default).

          parts.push('--overlay-' + k + ': url("' + safe + '")');

      if (s.top)           declarations.push('top:' + sanitizeCss(s.top));

      if (!t || typeof t !== 'object') continue;

    declarations.push('flex-direction:' + (layout.orientation === 'vertical' ? 'column' : 'row'));

    declarations.push('align-items:center');
    declarations.push('gap:' + ((+layout.itemSpacingPx) || 0) + 'px');
    declarations.push('z-index:' + ((+layout.zIndex) || 12));
    declarations.push('position:absolute');

    var px = (+layout.positionXPx) || 0;
    var py = (+layout.positionYPx) || 0;
    var sx = ((+layout.scalePct) || 100) / 100;
    var transformOps = [];
    var paddingTop = 0, paddingRight = 0, paddingBottom = 0, paddingLeft = 0;

    // the chosen anchor edge:
    //   top-* + py=60        → top:60px (60px from canvas top)
    //   bottom-* + py=60     → bottom:60px (60px from canvas bottom)
    //   left-* + px=120      → left:120px
    //   right-* + px=120     → right:120px (120px from canvas right)

    //                          span + flex/align center + padding shift)
    //
    // Earlier impl was inconsistent: top/left used direct offsets but
    // bottom/right used canvas-coordinate (bottom = 1080 - py / right
    // = 1920 - px). That meant picking the bottom-center default (py=
    // 60) drove the strip near the TOP of the canvas instead of near
    // the bottom. Migration 20260903000010 converts existing saved
    // rows so visuals stay byte-identical after the bootstrap flip.
    if (anchor.indexOf('top') === 0) {
      declarations.push('top:' + py + 'px');
      declarations.push('bottom:auto');
    } else if (anchor.indexOf('bottom') === 0) {
      declarations.push('bottom:' + py + 'px');
      declarations.push('top:auto');
    } else {
      // middle-* — span full canvas height + align center + Y nudge.
      declarations.push('top:0');
      declarations.push('bottom:0');
      declarations.push('height:auto');
      if (py > 0) paddingTop = 2 * py;
      else if (py < 0) paddingBottom = 2 * -py;
    }
    if (anchor.indexOf('left') !== -1) {
      declarations.push('left:' + px + 'px');
      declarations.push('right:auto');
    } else if (anchor.indexOf('right') !== -1) {
      declarations.push('right:' + px + 'px');
      declarations.push('left:auto');
    } else {
      // *-center — span full canvas width + center via flex + X nudge.
      declarations.push('left:0');
      declarations.push('right:0');
      declarations.push('width:auto');
      if (px > 0) paddingLeft = 2 * px;
      else if (px < 0) paddingRight = 2 * -px;
    }
    if (paddingTop || paddingRight || paddingBottom || paddingLeft) {
      declarations.push(
        'padding:' + paddingTop + 'px ' + paddingRight + 'px ' + paddingBottom + 'px ' + paddingLeft + 'px',
      );
    }
    if (sx !== 1) transformOps.push('scale(' + sx + ')');
    if (transformOps.length) {
      declarations.push('transform:' + transformOps.join(' '));
      declarations.push('transform-origin:center center');
    }
    return '[data-element-id="partners-strip"]{' + declarations.join(';') + ';}';
  }
  function applyPartnerLogos(logos, layout) {
    if (!Array.isArray(logos)) return false;
    var strip = document.querySelector('[data-element-id="partners-strip"]');
    if (!strip) return false;
    // Filter visible + sort.
    var sorted = logos
      .filter(function(l) { return l && l.visible !== false && typeof l.fileUrl === 'string'; })
      .slice()
      .sort(function(a, b) {
        var sa = typeof a.sort === 'number' ? a.sort : 999;
        var sb = typeof b.sort === 'number' ? b.sort : 999;
        return sa - sb;
      });
    if (sorted.length === 0 && (!layout || layout.visible !== false)) {
      // No logos but layout present — leave existing children alone.
      return false;
    }
    // Wipe existing children.
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    // Mark as flex container so the layout CSS takes effect even without
    // browser quirks.
    sorted.forEach(function(l) {
      var img = document.createElement('img');
      var safeKey = sanitizeCss(l.partnerKey || 'x');
      img.className = 'partner partner--' + safeKey;
      img.src = sanitizeCss(l.fileUrl);
      img.alt = sanitizeCss(l.alt || l.label || '');
      img.setAttribute('data-partner-key', safeKey);
      strip.appendChild(img);
    });
    return true;
  }
  // ────────── Stage 4 — element animations ──────────
  //
  // Build @keyframes BODY for a given preset anim type. Mirrors
  // server/overlays/animations/elements.ts::buildKeyframesBody — same
  // values across server-side resolver + client-side bootstrap so
  // SSR-emitted styles + URL-borne overrides yield identical motion.
  function buildPresetKeyframes(animType, name, customBody) {
    switch (animType) {
      case 'slide-left':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-right':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-up':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}';
      case 'slide-down':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(-32px)}to{opacity:1;transform:translateY(0)}}';
      case 'fade':
        return '@keyframes ' + name + '{from{opacity:0}to{opacity:1}}';
      case 'scale':
        return '@keyframes ' + name + '{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}';
      case 'rotate':
        return '@keyframes ' + name + '{from{opacity:0;transform:rotate(-12deg)}to{opacity:1;transform:rotate(0)}}';
      case 'bounce':
        return '@keyframes ' + name + '{0%{opacity:0;transform:translateY(20px)}60%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}';
      case 'pulse':
        return '@keyframes ' + name + '{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}';
      case 'glow':
        return '@keyframes ' + name + '{0%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}50%{filter:drop-shadow(0 0 24px rgba(107,205,6,0.55))}100%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}}';
      case 'shake':
        return '@keyframes ' + name + '{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
      case 'flip':
        return '@keyframes ' + name + '{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:perspective(800px) rotateY(0)}}';

        // Defence-in-depth: strip url(), at-rules, and angle/backtick
        // characters even if server sanitizer was bypassed (URL-borne).

        if (/\burl\s*\(/i.test(customBody)) return '';
        if (/@(import|font-face|charset|media|supports|keyframes)\b/i.test(customBody)) return '';

  function buildAnimRulesAndKeyframes(tokens) {
    if (!tokens || typeof tokens !== 'object') return { keyframes: '', rules: '' };

    var rulesParts = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var phases = tokens[elId];
      if (!phases || typeof phases !== 'object') continue;
      for (var phase in phases) {
        if (!Object.prototype.hasOwnProperty.call(phases, phase)) continue;

        var p = phases[phase];
        if (!p || typeof p !== 'object') continue;
        if (p.enabled === false) continue;
        if (!p.animType || p.animType === 'none') continue;

          p.animType,
          animName,
          p.customCssKeyframes || ''

        var delay = (+p.delayMs) || 0;
        var easing = sanitizeCss(p.easing || 'ease-out');

          'animation:' + animName +
          ' ' + duration + 'ms' +
          ' ' + easing +
          ' ' + delay + 'ms' +

      keyframes: keyframesParts.join('\n'),
      rules: rulesParts.join('\n'),
    };
  }
  try {

    var previewTextTokens = decodeTokens(qs.get('previewTextTokens'));

        var s1 = document.createElement('style');

        s1.textContent = cssVarRule;
        document.head.appendChild(s1);

        var s2 = document.createElement('style');
        s2.id = 'cade-injected-text';
        s2.textContent = textRule;
        document.head.appendChild(s2);

    //   3. Preview token bg-persistent (admin live-edit)
    // Empty / missing → treat as 'true' (persistent default per Task B).
    // Toggles body.cade-bg-persistent. CSS rule in each overlay then
    // forces .bg-image / .bg-fill / .bg-vignette / .bg-grain opacity:1
    // regardless of cade-visible state.
    function applyBgPersistent() {
      try {
        var on = true; // default = persistent
        if (design && Object.prototype.hasOwnProperty.call(design, 'bg-persistent')) {
          on = (design['bg-persistent'] === 'true' || design['bg-persistent'] === '1');
        }
        if (preview && Object.prototype.hasOwnProperty.call(preview, 'bg-persistent')) {
          on = (preview['bg-persistent'] === 'true' || preview['bg-persistent'] === '1');
        }
        // If neither token speaks but the HTML has a :root --overlay-bg-persistent
        // default, honour it. (Hard-coded false on excluded overlays.)
        if (
          (!design || !Object.prototype.hasOwnProperty.call(design, 'bg-persistent')) &&
          (!preview || !Object.prototype.hasOwnProperty.call(preview, 'bg-persistent'))
        ) {
          var hv = '';
          try {
            hv = getComputedStyle(document.documentElement)
              .getPropertyValue('--overlay-bg-persistent').trim()
              .replace(/^['"]|['"]$/g, '');
          } catch (e) { /* ignore */ }
          if (hv === 'false' || hv === '0') on = false;
        }
        if (document.body) {
          document.body.classList.toggle('cade-bg-persistent', on);
        }
      } catch (e) { /* never throw */ }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyBgPersistent);
    } else {
      applyBgPersistent();
    }

    // Bootstrap MUST never throw — fall back to HTML defaults.
  }

    object-position: center top;
  }

  .pod-name {
    position: relative;
    z-index: 2;
    margin-top: 16px;
    text-align: center;
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 34px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 4px 14px rgba(0,0,0,0.7);
    padding: 0 14px;
    word-break: keep-all;
    white-space: nowrap;
  }

  .pod-goals-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
    padding-bottom: 26px;
    width: 100%;
    text-align: center;
  }
  .pod-goals {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 96px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--green);
    text-shadow:
      0 0 18px var(--green-glow),
      0 4px 14px rgba(0,0,0,0.6);
  }
  .pod-goals-label {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.30em;
    color: rgba(255,255,255,0.78);
    text-transform: uppercase;
    transform: translateY(-12px);
  }

  /* ── PODIUM POSITIONING (#1 center tallest, #2 left, #3 right) */
  .pod-card--p1 {
    grid-column: 2;
    grid-row: 1;
    height: 420px;
    align-self: end;
    z-index: 2;
  }
  .pod-card--p2 {
    grid-column: 1;
    grid-row: 1;
    height: 390px;
    align-self: end;
    margin-bottom: 0;
  }
  .pod-card--p3 {
    grid-column: 3;
    grid-row: 1;
    height: 380px;
    align-self: end;
  }
  /* Tighter spacing on shorter P2 + P3 cards; smaller goals font so block fits */
  .pod-card--p2 .pod-photo-wrap,
  .pod-card--p3 .pod-photo-wrap {
    margin-top: 38px;
    width: 148px;
    height: 148px;
  }
  .pod-card--p2 .pod-name,
  .pod-card--p3 .pod-name {
    font-size: 30px;
    margin-top: 12px;
  }
  .pod-card--p2 .pod-goals-row,
  .pod-card--p3 .pod-goals-row {
    margin-top: 6px;
    padding-bottom: 18px;
  }
  .pod-card--p2 .pod-goals,
  .pod-card--p3 .pod-goals {
    font-size: 72px;
  }
  .pod-card--p2 .pod-goals-label,
  .pod-card--p3 .pod-goals-label {
    font-size: 16px;
  }

  /* #1 — slight gold rim halo + crown accent + gold rank number */
  .pod-card--p1 {
    background:
      linear-gradient(180deg, rgba(20,16,4,0.82) 0%, rgba(8,6,2,0.95) 100%);
    border: 1px solid rgba(230,200,50,0.32);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.65),
      0 0 32px rgba(230,200,50,0.18),
      0 0 0 1px rgba(230,200,50,0.10) inset;
  }
  .pod-card--p1 .pod-rim {
    background:
      linear-gradient(180deg,
        rgba(248,226,122,0.65) 0%,
        rgba(230,200,50,0.22) 30%,
        transparent 60%,
        rgba(230,200,50,0.30) 100%);
    animation: gold-rim-shimmer 3.6s ease-in-out infinite;
  }
  @keyframes gold-rim-shimmer {
    0%, 100% {
      filter: brightness(1) saturate(1);
      opacity: 0.9;
    }
    50% {
      filter: brightness(1.35) saturate(1.2);
      opacity: 1;
    }
  }
  .pod-card--p1 .pod-photo-ring {
    border-color: var(--gold);
    box-shadow:
      0 0 28px var(--gold-glow),
      0 0 48px rgba(230,200,50,0.35),
      inset 0 0 14px rgba(230,200,50,0.20);
    animation: ring-shimmer 3.6s ease-in-out infinite;
  }
  @keyframes ring-shimmer {
    0%, 100% {
      box-shadow:
        0 0 22px var(--gold-glow),
        0 0 44px rgba(230,200,50,0.30),
        inset 0 0 14px rgba(230,200,50,0.18);
    }
    50% {
      box-shadow:
        0 0 36px rgba(248,226,122,0.85),
        0 0 70px rgba(230,200,50,0.55),
        inset 0 0 18px rgba(230,200,50,0.32);
    }
  }
  .pod-card--p1 .pod-rank {
    color: var(--gold);
    -webkit-text-stroke: 1px rgba(248,226,122,0.55);
    text-shadow:
      0 0 0.5px rgba(255,255,255,0.4),
      0 8px 28px rgba(0,0,0,0.6),
      0 0 36px rgba(230,200,50,0.55);
  }
  .pod-card--p1 .pod-goals {
    color: var(--gold-hi);
    text-shadow:
      0 0 22px var(--gold-glow),
      0 4px 14px rgba(0,0,0,0.6);
  }

  /* CROWN — small gold accent above #1 photo */
  .pod-crown {
    position: absolute;
    top: -54px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 46px;
    z-index: 6;
    color: var(--gold);
    filter: drop-shadow(0 0 8px var(--gold-glow))
            drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    animation: crown-bob 3.2s ease-in-out infinite;
  }
  .pod-crown svg { width: 100%; height: 100%; display: block; }
  @keyframes crown-bob {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, -4px); }
  }

  /* HALO behind #1 photo — soft gold glow disc */
  .pod-halo {
    position: absolute;
    width: 280px;
    height: 280px;
    left: 50%;
    top: 32px;
    transform: translateX(-50%);
    border-radius: 50%;
    background:
      radial-gradient(circle,
        rgba(248,226,122,0.32) 0%,
        rgba(230,200,50,0.16) 30%,
        rgba(230,200,50,0.05) 55%,
        transparent 75%);
    z-index: 1;
    pointer-events: none;
    filter: blur(4px);
    animation: halo-breathe 3.6s ease-in-out infinite;
  }
  @keyframes halo-breathe {
    0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.06); }
  }

  /* #2 + #3 keep green rim, pink rank — pure pilot palette */

  /* ── PODIUM ENTRY ANIMATIONS (sequenced #3 → #2 → #1) ──────── */
  /* #3 first */
  .pod-card--p3 {
    animation: pod-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both,
               pod-out 0.55s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.10s) both;
  }
  /* #2 next */
  .pod-card--p2 {
    animation: pod-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both,
               pod-out 0.55s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.05s) both;
  }
  /* #1 last with gold flash burst */
  .pod-card--p1 {
    animation: pod-rise-king 0.85s cubic-bezier(0.16, 1, 0.3, 1) 1.18s both,
               pod-out 0.55s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0s) both;
  }
  @keyframes pod-rise {
    from { opacity: 0; transform: translateY(80px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pod-rise-king {
    0%   { opacity: 0; transform: translateY(80px) scale(0.94); filter: brightness(1); }
    60%  { opacity: 1; transform: translateY(-8px) scale(1.02); filter: brightness(1.6); }
    78%  {                                                       filter: brightness(2.4); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
  }
  @keyframes pod-out {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(40px); }
  }

  /* Crown only appears AFTER #1 lands */
  .pod-crown {
    opacity: 0;
    animation: crown-in 0.5s ease-out 1.85s both,
               crown-bob 3.2s ease-in-out 2.35s infinite,
               crown-out 0.4s ease-in calc(var(--exit-start) + 0s) both;
  }
  @keyframes crown-in {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.5); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  @keyframes crown-out {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
  .pod-halo {
    opacity: 0;
    animation: halo-in 0.7s ease-out 1.7s both,
               halo-breathe 3.6s ease-in-out 2.4s infinite,
               halo-out 0.5s ease-in calc(var(--exit-start) + 0s) both;
  }
  @keyframes halo-in {
    from { opacity: 0; transform: translateX(-50%) scale(0.4); }
    to   { opacity: 0.85; transform: translateX(-50%) scale(1); }
  }
  @keyframes halo-out {
    from { opacity: 0.85; }
    to   { opacity: 0; }
  }

  /* Goals digit-roll — uses CSS counter trick via animated text */
  .pod-goals[data-target] {
    --goals-target: 0;
  }
  /* digit-roll handled by a JS-free pure-CSS technique: we simply
     animate counter via a CSS @property (when supported) or a
     transform-based slot reel. Here we use a simple opacity-burst
     'pop' on the number and let it land at the target — keeps this
     OBS-friendly without JS. */
  .pod-goals {
    animation: goals-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.55s both;
  }
  .pod-card--p2 .pod-goals { animation-delay: 1.30s; }
  .pod-card--p3 .pod-goals { animation-delay: 0.95s; }
  @keyframes goals-pop {
    0%   { opacity: 0; transform: scale(0.4); filter: blur(8px); }
    60%  { opacity: 1; transform: scale(1.12); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── TAIL ROW (positions 4-10) — 7-column compact strip ─────── */
  .tail-strip {
    position: absolute;
    top: 738px;
    left: 50%;
    transform: translateX(-50%);
    width: 1620px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    column-gap: 12px;
    z-index: 13;
  }

  .tail-cell {
    position: relative;
    background:
      linear-gradient(180deg, rgba(8,12,8,0.72) 0%, rgba(5,8,4,0.92) 100%);
    border: 1px solid rgba(107,205,6,0.18);
    border-radius: 10px;
    padding: 12px 12px 14px;
    overflow: hidden;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    box-shadow:
      0 6px 18px rgba(0,0,0,0.55),
      0 0 0 1px rgba(107,205,6,0.04) inset;
    opacity: 0;
    transform: translateX(40px);
    will-change: transform, opacity;
  }

  .tail-cell::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }

  .tail-rank {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--pink);
    text-shadow: 0 0 12px rgba(254,3,109,0.42);
    -webkit-text-stroke: 0.5px rgba(255,255,255,0.30);
  }

  .tail-photo-wrap {
    position: relative;
    width: 70px;
    height: 70px;
    margin: 4px auto 6px;
  }
  .tail-photo-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid var(--green);
    box-shadow:
      0 0 12px rgba(107,205,6,0.45),
      inset 0 0 6px rgba(107,205,6,0.18);
  }
  .tail-photo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(107,205,6,0.16) 0%, rgba(0,0,0,0.55) 65%);
  }
  .tail-photo img {
    position: absolute;
    width: 130%;
    height: 130%;
    left: -15%;
    top: -10%;
    object-fit: cover;
    object-position: center 25%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .tail-name {
    margin-top: 2px;
    text-align: center;
    font-family: var(--display);
    font-weight: 700;
    font-stretch: 75%;
    font-size: 17px;
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
  }

  .tail-goals-row {
    margin-top: 6px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .tail-goals {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--green-hi);
    text-shadow: 0 0 14px var(--green-glow);
  }
  .tail-goals-label {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
    transform: translateY(-4px);
  }

  /* Header strip inside tail cell with rank + tiny "GOALS" hint */
  .tail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }
  .tail-tag {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.30em;
    color: rgba(255,255,255,0.40);
    text-transform: uppercase;
    transform: translateY(-2px);
  }

  /* Cascade entry */
  .tail-cell:nth-child(1) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.95s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.15s) both;
  }
  .tail-cell:nth-child(2) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.05s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.10s) both;
  }
  .tail-cell:nth-child(3) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.15s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.05s) both;
  }
  .tail-cell:nth-child(4) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.25s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.00s) both;
  }
  .tail-cell:nth-child(5) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.35s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.05s) both;
  }
  .tail-cell:nth-child(6) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.45s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.10s) both;
  }
  .tail-cell:nth-child(7) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.55s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.15s) both;
  }
  /* Task A 2026-05-19 — translate3d for GPU compositing path. */
  @keyframes tail-in {
    from { opacity: 0; transform: translate3d(60px, 0, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes tail-out {
    from { opacity: 1; transform: translate3d(0, 0, 0); }
    to   { opacity: 0; transform: translate3d(-30px, 0, 0); }
  }

  /* Task E 2026-05-19 — mid-show crossfade.
     When match.ended / standings.changed lands and the iframe receives
     a fresh top-scorers payload, the rank/name/goals text content swaps
     in place. Opacity transition makes the swap fade rather than snap.
     Numbers benefit especially — abrupt count changes read like glitches
     on a live stream.
     `!important` overrides the gate observer's inline
     `transition: opacity 360ms ease-out` so the smoother curve wins. */
  .tail-name,
  .tail-rank,
  .tail-goals,
  .tail-goals-label,
  .lb-name,
  .lb-goals,
  .pod-name,
  .pod-goals {
    transition: opacity 320ms cubic-bezier(0.4, 0, 0.2, 1) !important;
    will-change: opacity;
  }

  /* ── BOTTOM PARTNER STRIP (MARQUEE) ─────────────────────────── */
  .partners {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    display: var(--overlay-partner-strip-show, flex);
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 12;
    animation: header-fade 1.0s ease-out 0.3s both,
               header-out 0.8s ease-in calc(var(--exit-start) + 0.10s) both;
  }
  .partners-label {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
  }
  .marquee {
    position: relative;
    width: 980px;
    max-width: 90%;
    overflow: hidden;
    padding: 8px 0;
    background: rgba(8,8,8,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
            mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
  }
  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 40s linear infinite;
    will-change: transform;
  }
  @keyframes marquee-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-33.3333%); }
  }
  .marquee-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 0 30px;
    flex-shrink: 0;
  }
  
  /* Fallback for dynamically-rebuilt partner imgs (admin save wipes marquee wrapper). */
  [data-element-id="partners-strip"] img.partner { height: 50px; width: auto; object-fit: contain; }
.marquee-group .partner {
    height: 50px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }
  .marquee-group .partner--gameevo  { height: 50px; }
  .marquee-group .partner--pride    { height: 50px; }
  .marquee-group .partner--africa   { height: 50px; }
  .marquee-group .partner--trace    { height: 50px; }
  .marquee-group .partner--oas      { height: 50px; }
  .marquee-group .partner--wagyr    { height: 50px; }

  /* ── CORNER WATERMARK ───────────────────────────────────────── */
  .season-mark {
    position: absolute;
    top: 22px;
    right: 32px;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.40em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    z-index: 12;
  }
  .season-mark::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 9px;
    transform: translateY(-1px);
    box-shadow: 0 0 10px var(--green-glow);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
</style>

  <script>
    /* ── DIGIT-ROLL on goal numbers (podium top 3) ───────────────
       Tween counts 0 → target over 0.9s. Triggered ONCE per
       {type:'show'} message — no auto-cycle, no setInterval. */
    (function () {
      const offsets = { p1: 1550, p2: 1300, p3: 950 };

      function rollOne(el, target, durMs) {
        const t0 = performance.now();
        const ease = (t) => 1 - Math.pow(1 - t, 3);
        function step(now) {
          const t = Math.min(1, (now - t0) / durMs);
          const v = Math.round(target * ease(t));
          el.textContent = v;
          if (t < 1) requestAnimationFrame(step);
          else el.textContent = target;
        }
        requestAnimationFrame(step);
      }

      window.__cadeRunDigitRoll = function runCycle() {
        const p1 = document.querySelector('.pod-card--p1 .pod-goals');
        const p2 = document.querySelector('.pod-card--p2 .pod-goals');
        const p3 = document.querySelector('.pod-card--p3 .pod-goals');
        if (!p1 || !p2 || !p3) return;

        // B6 fix (2026-04-28): drop hardcoded `|| 22 / 19 / 17` fallback
        // demo numbers that persisted in OBS when the live payload was
        // empty. NaN now renders an em-dash so producers get a clear
        // "no data" signal instead of phantom goal counts. Pods that
        // already carry a target attribute roll normally.
        const t1 = parseInt(p1.dataset.target || p1.textContent, 10);
        const t2 = parseInt(p2.dataset.target || p2.textContent, 10);
        const t3 = parseInt(p3.dataset.target || p3.textContent, 10);

        function maybeRoll(el, t, delay) {
          if (Number.isNaN(t)) {
            el.textContent = '—';
            return;
          }
          setTimeout(() => rollOne(el, t, 900), delay);
        }

        // Reset visible counters before tweening only when we have a real
        // target — otherwise leave the em-dash in place.
        if (!Number.isNaN(t1)) p1.textContent = '0';
        if (!Number.isNaN(t2)) p2.textContent = '0';
        if (!Number.isNaN(t3)) p3.textContent = '0';

        maybeRoll(p3, t3, offsets.p3);
        maybeRoll(p2, t2, offsets.p2);
        maybeRoll(p1, t1, offsets.p1);
      };
      // No initial run; no setInterval. Live handler triggers it on show.
    })();
  </script>

  <script>
    /* ------------------------------------------------------------
       LIVE DATA — postMessage handler (data-feed driven)
       Accepts: { type:'update', data: { scorers:[{rank,name,slug,photoUrl,goals},...] } }
       Rerenders top-3 podium values (text only — keeps existing animation)
       AND fully rebuilds the tail-strip (positions 4..10). */
    (function () {
      var stage = document.querySelector('.stage') || document.body;
      var tailStrip = document.querySelector('.tail-strip');

      function rebuildTail(scorers) {
        if (!tailStrip) return;
        var html = '';
        // B6 fix (2026-04-28): always render 7 cells (ranks 4..10) so the
        // user sees the full structure in OBS even when only top-3 (or
        // zero) scorers are live. Slots without a scorer carry em-dash
        // placeholders for both name and goals — matching the empty-state
        // convention used by the podium pods.
        for (var i = 3; i < 10; i++) {
          var s = scorers && scorers[i] ? scorers[i] : null;
          var rankNumber = (s && s.rank) ? s.rank : (i + 1);
          var nameText = s && s.name ? s.name : '(empty)';
          var goalsText = s && typeof s.goals === 'number' ? s.goals : '—';
          var photoHtml = s && s.photoUrl
            ? '<img src="' + s.photoUrl + '" alt="' + (s.name || '') + '" />'
            : '';
          html += '<article class="tail-cell">' +
            '<div class="tail-header">' +
              '<span class="tail-rank">' + rankNumber + '</span>' +
              '<span class="tail-tag">Pos</span>' +
            '</div>' +
            '<div class="tail-photo-wrap">' +
              '<div class="tail-photo">' + photoHtml + '</div>' +
              '<div class="tail-photo-ring" aria-hidden="true"></div>' +
            '</div>' +
            '<div class="tail-name">' + nameText + '</div>' +
            '<div class="tail-goals-row">' +
              '<div class="tail-goals">' + goalsText + '</div>' +
              '<div class="tail-goals-label">G</div>' +
            '</div>' +
          '</article>';
        }
        tailStrip.innerHTML = html;
      }

      /**
       * Pull a scorers row list out of the message payload, regardless
       * of which shape arrived:
       *   - `{scorers: [...]}` (legacy postMessage relay)
       *   - `{rows: [...]}` (Realtime direct shape)
       *   - `{payload: {rows: [...]}}` (initial-fetch from
       *     /api/broadcast/sessions/<id>/top-scorers — server returns
       *     `{payload: TopScorersPayload {rows: [{rank, displayName,
       *     goals, photoUrl?}]}, seasonId, channel}`)
       */
      function readScorers(data) {
        if (!data) return null;
        if (Array.isArray(data.scorers)) return data.scorers;
        if (Array.isArray(data.rows)) return data.rows;
        if (data.payload && typeof data.payload === 'object') {
          if (Array.isArray(data.payload.scorers)) return data.payload.scorers;
          if (Array.isArray(data.payload.rows)) return data.payload.rows;
        }
        return null;
      }

      function update(data) {
        if (!data) return;
        var scorers = readScorers(data);
        if (!scorers) return;
        if (scorers.length === 0) {
          console.info('[overlay/14-top-scorers] empty scorers[]; rendering empty-state placeholders');
        }
        // Normalize server shape (rank/displayName/goals/photoUrl) into the
        // overlay's expected shape (rank/name/slug/goals/photoUrl).
        var normalized = scorers.map(function(r){
          return {
            rank: r.rank,
            name: r.name || r.displayName || r.player_name || '',
            slug: r.slug,
            goals: typeof r.goals === 'number' ? r.goals : 0,
            photoUrl: r.photoUrl
          };
        });
        console.info('[overlay/14-top-scorers] scorers[]', normalized.length);
        // B6 fix (2026-04-28): when a pod slot lacks a scorer, show a
        // `(no scorers)` placeholder + em-dash goals + clear the photo.
        // dataset.target is REMOVED so the digit-roll renders em-dash
        // (Number.isNaN branch) instead of cycling demo defaults.
        var pods = ['p1', 'p2', 'p3'];
        for (var i = 0; i < pods.length; i++) {
          var entry = i < normalized.length ? normalized[i] : null;
          var goalsEl = document.querySelector('.pod-card--' + pods[i] + ' .pod-goals');
          var nameEl = document.querySelector('.pod-card--' + pods[i] + ' .pod-name');
          var img = document.querySelector('.pod-card--' + pods[i] + ' .pod-photo img');
          if (entry) {
            if (goalsEl && typeof entry.goals === 'number') {
              goalsEl.dataset.target = String(entry.goals);
              goalsEl.textContent = String(entry.goals);
            }
            if (nameEl && entry.name) nameEl.textContent = entry.name;
            if (img && entry.photoUrl) img.src = entry.photoUrl;
          } else {
            if (goalsEl) {
              // Drop dataset.target entirely so digit-roll skips this pod.
              if (goalsEl.dataset && 'target' in goalsEl.dataset) {
                delete goalsEl.dataset.target;
              }
              goalsEl.textContent = '—';
            }
            if (nameEl) nameEl.textContent = '(no scorers)';
            if (img) img.removeAttribute('src');
          }
        }
        // Always rebuild tail (renders 7 placeholder slots when no data).
        rebuildTail(normalized);
      }
      function show() {
        document.body.classList.remove('cade-exiting');
        document.body.classList.add('cade-visible');
        if (stage) {
          var animated = stage.querySelectorAll(
            '.top-band, .pod-card, .tail-strip, .tail-cell, .partners, .pod-photo-wrap'
          );
          animated.forEach(function (el) {
            var orig = el.style.animation;
            el.style.animation = 'none';
            void el.offsetHeight;
            el.style.animation = orig || '';
          });
        }
        if (typeof window.__cadeRunDigitRoll === 'function') {
          // delay until card-entry animations land
          setTimeout(window.__cadeRunDigitRoll, 100);
        }
      }
      function hide() {
        document.body.classList.remove('cade-visible');
        document.body.classList.add('cade-exiting');
      }
      window.addEventListener('message', function (ev) {
        var msg = ev && ev.data;
        if (!msg || typeof msg !== 'object') return;
        console.info('[overlay/14-top-scorers] message', msg.type || msg.event || '?');
        // CONTRACT (per CLAUDE.md §14):
        //   show   → render data + add cade-visible
        //   hide   → swap cade-visible → cade-exiting
        //   update → re-render with new data, NO class change (no auto-show)
        if (msg.type === 'show') {
          update(msg.data || msg.payload || {});
          show();
        } else if (msg.type === 'update') {
          update(msg.data || msg.payload || {});
        } else if (msg.type === 'hide') {
          hide();
        }
      }, false);
    })();
  </script>
<script data-tag="cade-bg-persistent-bootstrap-v1">
(function () {
  /* Task B 2026-05-19 — read `--overlay-bg-persistent` token and toggle
     body.cade-bg-persistent class so the bg-layer CSS rules above keep
     the stadium texture visible regardless of trigger state. */
  function readToken() {
    try {
      var v = getComputedStyle(document.documentElement)
        .getPropertyValue('--overlay-bg-persistent').trim();
      v = v.replace(/^['"]|['"]$/g, '');
      return v;
    } catch (e) { return ''; }
  }
  function apply() {
    var v = readToken();
    var on = (v === '' || v === 'true' || v === '1');
    document.body.classList.toggle('cade-bg-persistent', on);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', apply);
  } else {
    apply();
  }
  new MutationObserver(apply).observe(document.head, { childList: true, subtree: true });
})();
</script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  /* Task B 2026-05-19 — .bg-image/.bg-vignette/.bg-grain removed; their
     visibility is driven by body.cade-bg-persistent + CSS rule above. */
  var SEL = '.chevrons,.leaderboard,.partners,.pod-card,.podium,.season-mark,.tail-cell,.tail-strip,.title-strip,.top-band';
  // Inner descendants whose entrance animations may have burnt out before
  // cade-visible arrives — force-set opacity 1 on visible.
  var INNER_SEL = '.pod-rank,.pod-name,.pod-photo,.pod-photo-wrap,.pod-photo-ring,.pod-goals,.pod-goals-row,.pod-goals-label,.pod-crown,.pod-rim,.tail-rank,.tail-tag,.tail-name,.tail-photo,.tail-photo-wrap,.tail-photo-ring,.tail-goals,.tail-goals-row,.tail-goals-label,.tail-header';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    var exit = b.classList.contains('cade-exiting');
    document.querySelectorAll(SEL).forEach(function(el){
      if (!el.dataset.cadeTransition) { el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out'; el.dataset.cadeTransition = '1'; }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.removeProperty('transform');
        el.style.setProperty('visibility', 'visible', 'important');
      } else if (exit) {
        el.style.setProperty('opacity', '0', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
    document.querySelectorAll(INNER_SEL).forEach(function(el){
      if (!el.dataset.cadeTransition) { el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out'; el.dataset.cadeTransition = '1'; }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
      } else if (!exit) {
        el.style.removeProperty('opacity');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
<script data-tag="cade-clear-static-seeds">
/* B6 fix (2026-04-28): when this overlay is loaded by OBS (NOT in demo
   mode), drop the static hardcoded podium goal seeds (22 / 19 / 17) and
   tail-strip seeds so the bug "random goal numbers in OBS" disappears
   even when no postMessage update has fired yet. Demo mode keeps the
   seeds so the local preview cycle still has something to render
   before the demo loop fires its synthetic `show`. */
(function(){
  if (new URLSearchParams(location.search).get('demo') === '1') return;
  function clear(el) {
    if (!el) return;
    if (el.dataset && 'target' in el.dataset) delete el.dataset.target;
    el.textContent = '—';
  }
  function clearName(el, msg) { if (el) el.textContent = msg; }
  // Pods
  clear(document.querySelector('.pod-card--p1 .pod-goals'));
  clear(document.querySelector('.pod-card--p2 .pod-goals'));
  clear(document.querySelector('.pod-card--p3 .pod-goals'));
  clearName(document.querySelector('.pod-card--p1 .pod-name'), '(no scorers)');
  clearName(document.querySelector('.pod-card--p2 .pod-name'), '(no scorers)');
  clearName(document.querySelector('.pod-card--p3 .pod-name'), '(no scorers)');
  // Pod photos — clear src so static demo headshots don't bleed through.
  document.querySelectorAll('.pod-photo img').forEach(function(img){
    img.removeAttribute('src');
  });
  // Tail cells — replace each rendered cell's name + goals with placeholders.
  document.querySelectorAll('.tail-cell').forEach(function(cell){
    var n = cell.querySelector('.tail-name');
    var g = cell.querySelector('.tail-goals');
    var img = cell.querySelector('.tail-photo img');
    if (n) n.textContent = '(empty)';
    if (g) g.textContent = '—';
    if (img) img.removeAttribute('src');
  });
})();
</script>
<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function(){ fire('show'); }, 200);
  // Loop: show 5s, hide 3s, repeat.
  setInterval(function(){ fire('hide'); }, 8000);
  setTimeout(function(){
    setInterval(function(){ fire('show'); }, 8000);
  }, 8000 - 5000); // offset so show fires 5s after each hide
})();
</script>
