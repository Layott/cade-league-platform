<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #14 — TOP SCORERS (GOLDEN PAD)
  Top-10 goal-scorer board. Podium-style: top 3 elevated as cards
  (#1 centered + tallest + subtle gold halo / crown / rim, #2 left,
  #3 right). Positions 4-10 occupy a 7-column tail strip below.
  Pilot design system: halftone-green stadium BG, top CADE+Pro League
  logo pair, side chevrons, bottom marquee partner strip.

  GOLD IS RESTRAINED: appears ONLY on the #1 player (crown halo, rim,
  pink→gold rank tint). Everything else is pilot green/pink.

  DATA WIRES: scorers[] = {rank, name, slug, photoUrl, goals}
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — Top Scorers · Golden Pad</title>

<style>
  /* ── REAL BRAND FONTS ───────────────────────────────────────── */
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BoldCondensed.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BlackCondensed.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }

  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: block;
  }

  /* ── DESIGN TOKENS (locked brand palette) ───────────────────── */
  :root {
    --green:        #6bcd06;
    --green-hi:     #93f01a;
    --green-glow:   rgba(107, 205, 6, 0.55);
    --green-faint:  rgba(107, 205, 6, 0.18);
    --pink:         #fe036d;
    --pink-glow:    rgba(254, 3, 109, 0.55);
    --gold:         #e6c832;
    --gold-hi:      #f8e27a;
    --gold-lo:      #9e8410;
    --gold-glow:    rgba(230, 200, 50, 0.60);
    --black:        #050505;
    --ink:          #ffffff;
    --display:      'Agharti', 'Impact', sans-serif;
    --accent:       'Quedora', 'Inter', sans-serif;

    /* Loop timing: entry 2.4s + hold 10s + exit 1.0s + gap 1.6s = 15s loop */
    --dur-cycle: 15s;
    --exit-start: 12.4s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    color-scheme: dark;
    color: var(--ink);
    font-family: var(--accent);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* === SPLIT GATE (Category B full-canvas):
     Body always opacity 1 — bg-image stays visible.
     Inner content shells hidden until cade-visible. === */
  body { opacity: 1 !important; }
  body:not(.cade-visible):not(.cade-exiting) .bg-image,
  body:not(.cade-visible):not(.cade-exiting) .bg-vignette,
  body:not(.cade-visible):not(.cade-exiting) .bg-grain,
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .chevrons,
  body:not(.cade-visible):not(.cade-exiting) .title-strip,
  body:not(.cade-visible):not(.cade-exiting) .podium,
  body:not(.cade-visible):not(.cade-exiting) .pod-card,
  body:not(.cade-visible):not(.cade-exiting) .leaderboard,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .season-mark {
    opacity: 0 !important;
  }
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .chevrons,
  body:not(.cade-visible):not(.cade-exiting) .title-strip,
  body:not(.cade-visible):not(.cade-exiting) .podium,
  body:not(.cade-visible):not(.cade-exiting) .pod-card,
  body:not(.cade-visible):not(.cade-exiting) .leaderboard,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .season-mark {
    animation-name: none !important;
  }
  body.cade-visible .bg-image,
  body.cade-visible .bg-vignette,
  body.cade-visible .bg-grain {
    opacity: 1;
    transition: opacity 0.4s ease-out;
  }
  body.cade-exiting .bg-image,
  body.cade-exiting .bg-vignette,
  body.cade-exiting .bg-grain {
    opacity: 0 !important;
    transition: opacity 0.5s cubic-bezier(0.7, 0, 0.84, 0);
  }
  body.cade-exiting .top-band,
  body.cade-exiting .chevrons,
  body.cade-exiting .title-strip,
  body.cade-exiting .podium,
  body.cade-exiting .pod-card,
  body.cade-exiting .leaderboard,
  body.cade-exiting .partners,
  body.cade-exiting .season-mark {
    animation: cade-fade-out 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
  }
  @keyframes cade-fade-out {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* ── STAGE (1920×1080 fixed canvas, transparent root) ───────── */
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    isolation: isolate;
  }

  /* ── BG: halftone-green stadium texture ─────────────────────── */
  .bg-image {
    position: absolute;
    inset: -3% -3%;
    background-image: url('../../../designsample/ELITE%20S2%20BG.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform-origin: 50% 50%;
    animation: bg-drift 20s ease-in-out infinite alternate,
               bg-breathe 6s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes bg-drift {
    0%   { transform: scale(1.00) translate(0, 0); }
    100% { transform: scale(1.04) translate(-1.2%, -0.6%); }
  }
  @keyframes bg-breathe {
    0%, 100% { filter: brightness(1.00) saturate(1.00); }
    50%      { filter: brightness(1.02) saturate(1.05); }
  }

  .bg-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(5,5,5,0) 0%, rgba(5,5,5,0.30) 55%, rgba(5,5,5,0.78) 100%),
      linear-gradient(to bottom, rgba(5,5,5,0.10) 0%, rgba(5,5,5,0.10) 50%, rgba(5,5,5,0.55) 75%, rgba(5,5,5,0.85) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .bg-grain {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0 1px,
        transparent 1px 3px
      );
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* ── TOP HEADER BAND (CADE | PRO LEAGUE) ────────────────────── */
  .top-band {
    position: absolute;
    top: 28px;
    left: 0;
    right: 0;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 38px;
    z-index: 10;
    animation: header-fade 1.0s ease-out 0s both,
               header-out 0.8s ease-in var(--exit-start) both;
  }
  .top-band .logo {
    height: 110px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
  }
  .top-band .logo--cade { height: 100px; }
  .top-band .logo--pro  { height: 120px; }

  .top-band .divider {
    width: 2px;
    height: 92px;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 20%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 80%,
      rgba(255,255,255,0) 100%
    );
    border-radius: 1px;
  }

  @keyframes header-fade {
    from { opacity: 0; transform: translateY(-22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes header-out {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-18px); }
  }

  /* ── SIDE CHEVRONS ──────────────────────────────────────────── */
  .chevrons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 38px;
    z-index: 5;
    pointer-events: none;
    animation: chev-fade 1.0s ease-out 0.2s both,
               chev-out 0.8s ease-in var(--exit-start) both;
  }
  .chevrons--left  { left: 50px; }
  .chevrons--right { right: 50px; }

  .chevron {
    width: 72px;
    height: 54px;
    color: var(--green);
    opacity: 0.55;
    animation: chev-pulse 4.2s ease-in-out infinite;
  }
  .chevron svg { width: 100%; height: 100%; display: block; }

  .chevrons--left  .chevron:nth-child(1) { animation-delay: 0s;    }
  .chevrons--left  .chevron:nth-child(2) { animation-delay: 0.4s;  }
  .chevrons--left  .chevron:nth-child(3) { animation-delay: 0.8s;  }
  .chevrons--right .chevron:nth-child(1) { animation-delay: 0.6s;  }
  .chevrons--right .chevron:nth-child(2) { animation-delay: 1.0s;  }
  .chevrons--right .chevron:nth-child(3) { animation-delay: 1.4s;  }

  @keyframes chev-pulse {
    0%, 100% { opacity: 0.30; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(6px); }
  }
  .chevrons--right .chevron { animation-name: chev-pulse-right; }
  @keyframes chev-pulse-right {
    0%, 100% { opacity: 0.30; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(-6px); }
  }
  @keyframes chev-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes chev-out {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  /* ── TITLE STRIP ────────────────────────────────────────────── */
  .title-strip {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 1280px;
    text-align: center;
    z-index: 11;
    animation: header-fade 1.0s ease-out 0.15s both,
               header-out 0.8s ease-in var(--exit-start) both;
  }
  .kicker {
    display: inline-block;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.42em;
    color: var(--ink);
    text-transform: uppercase;
    padding: 7px 22px;
    border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.32);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .kicker .kicker-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 12px;
    transform: translateY(-1px);
    box-shadow: 0 0 10px var(--green-glow);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.55; transform: translateY(-1px) scale(1); }
    50%      { opacity: 1;    transform: translateY(-1px) scale(1.2); }
  }

  .title {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 76px;
    line-height: 0.86;
    letter-spacing: -0.005em;
    color: var(--ink);
    text-transform: uppercase;
    margin: 0;
    text-shadow:
      0 0 1px rgba(255,255,255,0.85),
      0 6px 22px rgba(0,0,0,0.65),
      0 0 38px rgba(107,205,6,0.18);
    animation: title-pulse 3.4s ease-in-out infinite;
  }
  .title .em-pink {
    color: var(--ink);
    background: linear-gradient(180deg, var(--ink) 0%, rgba(255,255,255,0.92) 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @keyframes title-pulse {
    0%, 100% {
      text-shadow:
        0 0 1px rgba(255,255,255,0.85),
        0 6px 22px rgba(0,0,0,0.65),
        0 0 22px rgba(107,205,6,0.10);
    }
    50% {
      text-shadow:
        0 0 1px rgba(255,255,255,1),
        0 6px 22px rgba(0,0,0,0.65),
        0 0 64px rgba(107,205,6,0.34);
    }
  }
  .title-rule {
    width: 220px;
    height: 4px;
    margin: 14px auto 6px;
    background: var(--pink);
    border-radius: 3px;
    box-shadow:
      0 0 14px var(--pink-glow),
      0 0 28px rgba(254,3,109,0.30);
  }
  .subtitle {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.32em;
    color: var(--ink);
    text-transform: uppercase;
    opacity: 0.82;
  }

  /* ── PODIUM ROW (TOP 3) ─────────────────────────────────────── */
  .podium {
    position: absolute;
    top: 296px;
    left: 50%;
    transform: translateX(-50%);
    width: 1340px;
    height: 420px;
    display: grid;
    grid-template-columns: 1fr 1.05fr 1fr;
    column-gap: 32px;
    align-items: end;
    z-index: 14;
  }

  .pod-card {
    position: relative;
    border-radius: 14px;
    background:
      linear-gradient(180deg, rgba(8,12,8,0.78) 0%, rgba(5,8,4,0.92) 100%);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    overflow: visible;
    box-shadow:
      0 8px 28px rgba(0,0,0,0.55),
      0 0 0 1px rgba(107,205,6,0.06) inset;
    opacity: 0;
    transform: translateY(80px);
    will-change: transform, opacity;
  }

  .pod-card .pod-rim {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        rgba(107,205,6,0.50) 0%,
        rgba(107,205,6,0.10) 30%,
        transparent 60%,
        rgba(107,205,6,0.18) 100%);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    padding: 1.5px;
  }

  /* RANK NUMBER BACKDROP (small badge above photo) */
  .pod-rank {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 88px;
    line-height: 0.8;
    color: var(--pink);
    text-shadow:
      0 0 0.5px rgba(255,255,255,0.4),
      0 8px 28px rgba(0,0,0,0.6),
      0 0 26px rgba(254,3,109,0.30);
    z-index: 5;
    letter-spacing: -0.04em;
    -webkit-text-stroke: 1px rgba(255,255,255,0.35);
  }

  .pod-photo-wrap {
    position: relative;
    width: 168px;
    height: 168px;
    margin: 50px auto 0;
    z-index: 2;
  }
  .pod-photo-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 3px solid var(--green);
    box-shadow:
      0 0 24px var(--green-glow),
      inset 0 0 12px rgba(107,205,6,0.18);
  }
  .pod-photo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(107,205,6,0.18) 0%, rgba(0,0,0,0.55) 65%);
  }
  .pod-photo img {
    position: absolute;
    width: 130%;
    height: 130%;
    left: -15%;
    top: -10%;
    object-fit: cover;
    object-position: center 25%;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6));
  }
  .pod-photo--full img {
    width: 175%;
    height: 175%;
    left: -38%;
    top: -8%;
    object-position: center top;
  }

  .pod-name {
    position: relative;
    z-index: 2;
    margin-top: 16px;
    text-align: center;
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 34px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 4px 14px rgba(0,0,0,0.7);
    padding: 0 14px;
    word-break: keep-all;
    white-space: nowrap;
  }

  .pod-goals-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
    padding-bottom: 26px;
    width: 100%;
    text-align: center;
  }
  .pod-goals {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 96px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--green);
    text-shadow:
      0 0 18px var(--green-glow),
      0 4px 14px rgba(0,0,0,0.6);
  }
  .pod-goals-label {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.30em;
    color: rgba(255,255,255,0.78);
    text-transform: uppercase;
    transform: translateY(-12px);
  }

  /* ── PODIUM POSITIONING (#1 center tallest, #2 left, #3 right) */
  .pod-card--p1 {
    grid-column: 2;
    grid-row: 1;
    height: 420px;
    align-self: end;
    z-index: 2;
  }
  .pod-card--p2 {
    grid-column: 1;
    grid-row: 1;
    height: 390px;
    align-self: end;
    margin-bottom: 0;
  }
  .pod-card--p3 {
    grid-column: 3;
    grid-row: 1;
    height: 380px;
    align-self: end;
  }
  /* Tighter spacing on shorter P2 + P3 cards; smaller goals font so block fits */
  .pod-card--p2 .pod-photo-wrap,
  .pod-card--p3 .pod-photo-wrap {
    margin-top: 38px;
    width: 148px;
    height: 148px;
  }
  .pod-card--p2 .pod-name,
  .pod-card--p3 .pod-name {
    font-size: 30px;
    margin-top: 12px;
  }
  .pod-card--p2 .pod-goals-row,
  .pod-card--p3 .pod-goals-row {
    margin-top: 6px;
    padding-bottom: 18px;
  }
  .pod-card--p2 .pod-goals,
  .pod-card--p3 .pod-goals {
    font-size: 72px;
  }
  .pod-card--p2 .pod-goals-label,
  .pod-card--p3 .pod-goals-label {
    font-size: 16px;
  }

  /* #1 — slight gold rim halo + crown accent + gold rank number */
  .pod-card--p1 {
    background:
      linear-gradient(180deg, rgba(20,16,4,0.82) 0%, rgba(8,6,2,0.95) 100%);
    border: 1px solid rgba(230,200,50,0.32);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.65),
      0 0 32px rgba(230,200,50,0.18),
      0 0 0 1px rgba(230,200,50,0.10) inset;
  }
  .pod-card--p1 .pod-rim {
    background:
      linear-gradient(180deg,
        rgba(248,226,122,0.65) 0%,
        rgba(230,200,50,0.22) 30%,
        transparent 60%,
        rgba(230,200,50,0.30) 100%);
    animation: gold-rim-shimmer 3.6s ease-in-out infinite;
  }
  @keyframes gold-rim-shimmer {
    0%, 100% {
      filter: brightness(1) saturate(1);
      opacity: 0.9;
    }
    50% {
      filter: brightness(1.35) saturate(1.2);
      opacity: 1;
    }
  }
  .pod-card--p1 .pod-photo-ring {
    border-color: var(--gold);
    box-shadow:
      0 0 28px var(--gold-glow),
      0 0 48px rgba(230,200,50,0.35),
      inset 0 0 14px rgba(230,200,50,0.20);
    animation: ring-shimmer 3.6s ease-in-out infinite;
  }
  @keyframes ring-shimmer {
    0%, 100% {
      box-shadow:
        0 0 22px var(--gold-glow),
        0 0 44px rgba(230,200,50,0.30),
        inset 0 0 14px rgba(230,200,50,0.18);
    }
    50% {
      box-shadow:
        0 0 36px rgba(248,226,122,0.85),
        0 0 70px rgba(230,200,50,0.55),
        inset 0 0 18px rgba(230,200,50,0.32);
    }
  }
  .pod-card--p1 .pod-rank {
    color: var(--gold);
    -webkit-text-stroke: 1px rgba(248,226,122,0.55);
    text-shadow:
      0 0 0.5px rgba(255,255,255,0.4),
      0 8px 28px rgba(0,0,0,0.6),
      0 0 36px rgba(230,200,50,0.55);
  }
  .pod-card--p1 .pod-goals {
    color: var(--gold-hi);
    text-shadow:
      0 0 22px var(--gold-glow),
      0 4px 14px rgba(0,0,0,0.6);
  }

  /* CROWN — small gold accent above #1 photo */
  .pod-crown {
    position: absolute;
    top: -54px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 46px;
    z-index: 6;
    color: var(--gold);
    filter: drop-shadow(0 0 8px var(--gold-glow))
            drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    animation: crown-bob 3.2s ease-in-out infinite;
  }
  .pod-crown svg { width: 100%; height: 100%; display: block; }
  @keyframes crown-bob {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, -4px); }
  }

  /* HALO behind #1 photo — soft gold glow disc */
  .pod-halo {
    position: absolute;
    width: 280px;
    height: 280px;
    left: 50%;
    top: 32px;
    transform: translateX(-50%);
    border-radius: 50%;
    background:
      radial-gradient(circle,
        rgba(248,226,122,0.32) 0%,
        rgba(230,200,50,0.16) 30%,
        rgba(230,200,50,0.05) 55%,
        transparent 75%);
    z-index: 1;
    pointer-events: none;
    filter: blur(4px);
    animation: halo-breathe 3.6s ease-in-out infinite;
  }
  @keyframes halo-breathe {
    0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.06); }
  }

  /* #2 + #3 keep green rim, pink rank — pure pilot palette */

  /* ── PODIUM ENTRY ANIMATIONS (sequenced #3 → #2 → #1) ──────── */
  /* #3 first */
  .pod-card--p3 {
    animation: pod-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both,
               pod-out 0.55s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.10s) both;
  }
  /* #2 next */
  .pod-card--p2 {
    animation: pod-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both,
               pod-out 0.55s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.05s) both;
  }
  /* #1 last with gold flash burst */
  .pod-card--p1 {
    animation: pod-rise-king 0.85s cubic-bezier(0.16, 1, 0.3, 1) 1.18s both,
               pod-out 0.55s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0s) both;
  }
  @keyframes pod-rise {
    from { opacity: 0; transform: translateY(80px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pod-rise-king {
    0%   { opacity: 0; transform: translateY(80px) scale(0.94); filter: brightness(1); }
    60%  { opacity: 1; transform: translateY(-8px) scale(1.02); filter: brightness(1.6); }
    78%  {                                                       filter: brightness(2.4); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
  }
  @keyframes pod-out {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(40px); }
  }

  /* Crown only appears AFTER #1 lands */
  .pod-crown {
    opacity: 0;
    animation: crown-in 0.5s ease-out 1.85s both,
               crown-bob 3.2s ease-in-out 2.35s infinite,
               crown-out 0.4s ease-in calc(var(--exit-start) + 0s) both;
  }
  @keyframes crown-in {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.5); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  @keyframes crown-out {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
  .pod-halo {
    opacity: 0;
    animation: halo-in 0.7s ease-out 1.7s both,
               halo-breathe 3.6s ease-in-out 2.4s infinite,
               halo-out 0.5s ease-in calc(var(--exit-start) + 0s) both;
  }
  @keyframes halo-in {
    from { opacity: 0; transform: translateX(-50%) scale(0.4); }
    to   { opacity: 0.85; transform: translateX(-50%) scale(1); }
  }
  @keyframes halo-out {
    from { opacity: 0.85; }
    to   { opacity: 0; }
  }

  /* Goals digit-roll — uses CSS counter trick via animated text */
  .pod-goals[data-target] {
    --goals-target: 0;
  }
  /* digit-roll handled by a JS-free pure-CSS technique: we simply
     animate counter via a CSS @property (when supported) or a
     transform-based slot reel. Here we use a simple opacity-burst
     'pop' on the number and let it land at the target — keeps this
     OBS-friendly without JS. */
  .pod-goals {
    animation: goals-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.55s both;
  }
  .pod-card--p2 .pod-goals { animation-delay: 1.30s; }
  .pod-card--p3 .pod-goals { animation-delay: 0.95s; }
  @keyframes goals-pop {
    0%   { opacity: 0; transform: scale(0.4); filter: blur(8px); }
    60%  { opacity: 1; transform: scale(1.12); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── TAIL ROW (positions 4-10) — 7-column compact strip ─────── */
  .tail-strip {
    position: absolute;
    top: 738px;
    left: 50%;
    transform: translateX(-50%);
    width: 1620px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    column-gap: 12px;
    z-index: 13;
  }

  .tail-cell {
    position: relative;
    background:
      linear-gradient(180deg, rgba(8,12,8,0.72) 0%, rgba(5,8,4,0.92) 100%);
    border: 1px solid rgba(107,205,6,0.18);
    border-radius: 10px;
    padding: 12px 12px 14px;
    overflow: hidden;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    box-shadow:
      0 6px 18px rgba(0,0,0,0.55),
      0 0 0 1px rgba(107,205,6,0.04) inset;
    opacity: 0;
    transform: translateX(40px);
    will-change: transform, opacity;
  }

  .tail-cell::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }

  .tail-rank {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--pink);
    text-shadow: 0 0 12px rgba(254,3,109,0.42);
    -webkit-text-stroke: 0.5px rgba(255,255,255,0.30);
  }

  .tail-photo-wrap {
    position: relative;
    width: 70px;
    height: 70px;
    margin: 4px auto 6px;
  }
  .tail-photo-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid var(--green);
    box-shadow:
      0 0 12px rgba(107,205,6,0.45),
      inset 0 0 6px rgba(107,205,6,0.18);
  }
  .tail-photo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(107,205,6,0.16) 0%, rgba(0,0,0,0.55) 65%);
  }
  .tail-photo img {
    position: absolute;
    width: 130%;
    height: 130%;
    left: -15%;
    top: -10%;
    object-fit: cover;
    object-position: center 25%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .tail-name {
    margin-top: 2px;
    text-align: center;
    font-family: var(--display);
    font-weight: 700;
    font-stretch: 75%;
    font-size: 17px;
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
  }

  .tail-goals-row {
    margin-top: 6px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .tail-goals {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--green-hi);
    text-shadow: 0 0 14px var(--green-glow);
  }
  .tail-goals-label {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
    transform: translateY(-4px);
  }

  /* Header strip inside tail cell with rank + tiny "GOALS" hint */
  .tail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }
  .tail-tag {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.30em;
    color: rgba(255,255,255,0.40);
    text-transform: uppercase;
    transform: translateY(-2px);
  }

  /* Cascade entry */
  .tail-cell:nth-child(1) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.95s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.15s) both;
  }
  .tail-cell:nth-child(2) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.05s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.10s) both;
  }
  .tail-cell:nth-child(3) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.15s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.05s) both;
  }
  .tail-cell:nth-child(4) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.25s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) - 0.00s) both;
  }
  .tail-cell:nth-child(5) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.35s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.05s) both;
  }
  .tail-cell:nth-child(6) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.45s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.10s) both;
  }
  .tail-cell:nth-child(7) {
    animation: tail-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) 2.55s both,
               tail-out 0.45s cubic-bezier(0.6, 0, 0.84, 0) calc(var(--exit-start) + 0.15s) both;
  }
  @keyframes tail-in {
    from { opacity: 0; transform: translateX(60px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes tail-out {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-30px); }
  }

  /* ── BOTTOM PARTNER STRIP (MARQUEE) ─────────────────────────── */
  .partners {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 12;
    animation: header-fade 1.0s ease-out 0.3s both,
               header-out 0.8s ease-in calc(var(--exit-start) + 0.10s) both;
  }
  .partners-label {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
  }
  .marquee {
    position: relative;
    width: 980px;
    max-width: 90%;
    overflow: hidden;
    padding: 8px 0;
    background: rgba(8,8,8,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
            mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
  }
  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 40s linear infinite;
    will-change: transform;
  }
  @keyframes marquee-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-33.3333%); }
  }
  .marquee-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 0 30px;
    flex-shrink: 0;
  }
  .marquee-group .partner {
    height: 42px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }
  .marquee-group .partner--gameevo  { height: 38px; }
  .marquee-group .partner--pride    { height: 34px; }
  .marquee-group .partner--africa   { height: 38px; }
  .marquee-group .partner--trace    { height: 44px; }

  /* ── CORNER WATERMARK ───────────────────────────────────────── */
  .season-mark {
    position: absolute;
    top: 22px;
    right: 32px;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.40em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    z-index: 12;
  }
  .season-mark::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 9px;
    transform: translateY(-1px);
    box-shadow: 0 0 10px var(--green-glow);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
</style>
</head>

      <div class="chevron"><svg viewBox="0 0 88 64" fill="none"><path d="M14 6 L42 32 L14 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 6 L76 32 L48 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    </section>

    <!-- ============================================================
         TAIL ROW — positions 4-10 in 7-column compact strip
         scorers[3..9] = {rank, name, slug, photoUrl, goals}
         ============================================================ -->
    <section class="tail-strip" aria-label="Goal scorers 4 through 10">

      <article class="tail-cell">
        <div class="tail-header">
          <span class="tail-rank">4</span>

  <script>
    /* ── DIGIT-ROLL on goal numbers (podium top 3) ───────────────
       Tween counts 0 → target over 0.9s. Triggered ONCE per
       {type:'show'} message — no auto-cycle, no setInterval. */
    (function () {
      const offsets = { p1: 1550, p2: 1300, p3: 950 };

      function rollOne(el, target, durMs) {
        const t0 = performance.now();
        const ease = (t) => 1 - Math.pow(1 - t, 3);
        function step(now) {
          const t = Math.min(1, (now - t0) / durMs);
          const v = Math.round(target * ease(t));
          el.textContent = v;
          if (t < 1) requestAnimationFrame(step);
          else el.textContent = target;
        }
        requestAnimationFrame(step);
      }

      window.__cadeRunDigitRoll = function runCycle() {
        const p1 = document.querySelector('.pod-card--p1 .pod-goals');
        const p2 = document.querySelector('.pod-card--p2 .pod-goals');
        const p3 = document.querySelector('.pod-card--p3 .pod-goals');
        if (!p1 || !p2 || !p3) return;

        [p1, p2, p3].forEach(el => { el.textContent = '0'; });

        const t1 = parseInt(p1.dataset.target || p1.textContent, 10) || 22;
        const t2 = parseInt(p2.dataset.target || p2.textContent, 10) || 19;
        const t3 = parseInt(p3.dataset.target || p3.textContent, 10) || 17;

        setTimeout(() => rollOne(p3, t3, 900), offsets.p3);
        setTimeout(() => rollOne(p2, t2, 900), offsets.p2);
        setTimeout(() => rollOne(p1, t1, 900), offsets.p1);
      };
      // No initial run; no setInterval. Live handler triggers it on show.
    })();
  </script>

  <script>
    /* ------------------------------------------------------------
       LIVE DATA — postMessage handler (data-feed driven)
       Accepts: { type:'update', data: { scorers:[{rank,name,slug,photoUrl,goals},...] } }
       Rerenders top-3 podium values (text only — keeps existing animation)
       AND fully rebuilds the tail-strip (positions 4..10). */
    (function () {
      var stage = document.querySelector('.stage') || document.body;
      var tailStrip = document.querySelector('.tail-strip');

      function rebuildTail(scorers) {
        if (!tailStrip) return;
        var html = '';
        // Render up to 7 cells for ranks 4..10 from index 3..9.
        for (var i = 3; i < Math.min(10, scorers.length); i++) {
          var s = scorers[i] || {};
          var photo = s.photoUrl
            ? '<img src="' + s.photoUrl + '" alt="' + (s.name || '') + '" />'
            : '';
          html += '<article class="tail-cell">' +
            '<div class="tail-header">' +
              '<span class="tail-rank">' + (s.rank || (i + 1)) + '</span>' +
              '<span class="tail-tag">Pos</span>' +
            '</div>' +
            '<div class="tail-photo-wrap">' +
              '<div class="tail-photo">' + photo + '</div>' +
              '<div class="tail-photo-ring" aria-hidden="true"></div>' +
            '</div>' +
            '<div class="tail-name">' + (s.name || '—') + '</div>' +
            '<div class="tail-goals-row">' +
              '<div class="tail-goals">' + (typeof s.goals === 'number' ? s.goals : '0') + '</div>' +
              '<div class="tail-goals-label">G</div>' +
            '</div>' +
          '</article>';
        }
        tailStrip.innerHTML = html;
      }

      function update(data) {
        if (!data) return;
        if (Array.isArray(data.scorers)) {
          console.info('[overlay/14-top-scorers] scorers[]', data.scorers.length);
          var pods = ['p1', 'p2', 'p3'];
          for (var i = 0; i < Math.min(3, data.scorers.length); i++) {
            var entry = data.scorers[i];
            if (!entry) continue;
            var goalsEl = document.querySelector('.pod-card--' + pods[i] + ' .pod-goals');
            if (goalsEl && typeof entry.goals === 'number') {
              goalsEl.dataset.target = String(entry.goals);
              goalsEl.textContent = String(entry.goals);
            }
            var nameEl = document.querySelector('.pod-card--' + pods[i] + ' .pod-name');
            if (nameEl && entry.name) nameEl.textContent = entry.name;
            if (entry.photoUrl) {
              var img = document.querySelector('.pod-card--' + pods[i] + ' .pod-photo img');
              if (img) img.src = entry.photoUrl;
            }
          }
          if (data.scorers.length > 3) rebuildTail(data.scorers);
        }
      }
      function show() {
        document.body.classList.remove('cade-exiting');
        document.body.classList.add('cade-visible');
        if (stage) {
          var animated = stage.querySelectorAll(
            '.top-band, .pod-card, .tail-strip, .tail-cell, .partners, .pod-photo-wrap'
          );
          animated.forEach(function (el) {
            var orig = el.style.animation;
            el.style.animation = 'none';
            void el.offsetHeight;
            el.style.animation = orig || '';
          });
        }
        if (typeof window.__cadeRunDigitRoll === 'function') {
          // delay until card-entry animations land
          setTimeout(window.__cadeRunDigitRoll, 100);
        }
      }
      function hide() {
        document.body.classList.remove('cade-visible');
        document.body.classList.add('cade-exiting');
      }
      window.addEventListener('message', function (ev) {
        var msg = ev && ev.data;
        if (!msg || typeof msg !== 'object') return;
        console.info('[overlay/14-top-scorers] message', msg.type || msg.event || '?');
        if (msg.type === 'update' || msg.type === 'show') {
          update(msg.data || msg.payload || {});
          show();
        } else if (msg.type === 'hide') {
          hide();
        }
      }, false);
    })();
  </script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  var SEL = '.bg-image,.bg-vignette,.bg-grain,.chevrons,.leaderboard,.partners,.pod-card,.podium,.season-mark,.title-strip,.top-band';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    var exit = b.classList.contains('cade-exiting');
    document.querySelectorAll(SEL).forEach(function(el){
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.removeProperty('transform');
        el.style.setProperty('visibility', 'visible', 'important');
      } else if (exit) {
        el.style.setProperty('opacity', '0', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
