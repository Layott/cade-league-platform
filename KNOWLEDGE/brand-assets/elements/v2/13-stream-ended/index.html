<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #13 — "STREAM ENDED"
  Full-screen, opaque, 1920×1080, silent.
  End-of-broadcast brand-presence card. Same design family as the
  pilot at ../01-brb/index.html: halftone ELITE S2 BG, CADE+Pro
  League logo pair top-centered, side chevron motifs, marquee
  partner strip at the bottom. Center stack reads "THANKS FOR
  WATCHING" with a small Quedora subtitle "see you next time".
  No social handle, no app CTA, no follow prompt — pure sign-off.

  Motion family is intentionally distinct from the Starting Soon
  variant: bg uses a slow zoom-out + brightness breathe (rather
  than a pan-drift), title letters cycle a per-letter staggered
  glow breath, and the chevrons drift inward in opposing phases
  to feel like the canvas is gently exhaling.
-->
<!-- DATA WIRES: none (end screen) -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — Stream Ended</title>

<style>
  /* ── REAL BRAND FONTS ───────────────────────────────────────── */
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BoldCondensed.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BlackCondensed.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;

  }

  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Bold.woff2') format('woff2');

  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: block;
  }

  /* ── DESIGN TOKENS (locked brand palette) ───────────────────── */
  :root {
    --green:        #6bcd06;
    --green-glow:   rgba(107, 205, 6, 0.55);
    --green-faint:  rgba(107, 205, 6, 0.18);
    --pink:         #fe036d;
    --pink-glow:    rgba(254, 3, 109, 0.55);
    --black:        #050505;
    --ink:          #ffffff;
    --display:      'Agharti', 'Impact', sans-serif;
    --accent:       'Quedora', 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    color-scheme: dark;
    color: var(--ink);
    font-family: var(--accent);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* === STRICT GATE (Category B full-canvas, default-OFF):
     bg layers + inner shells ALL hidden until cade-visible. === */
  body { opacity: 1 !important; }
  body:not(.cade-visible):not(.cade-exiting) .bg-image,
  body:not(.cade-visible):not(.cade-exiting) .bg-vignette,
  body:not(.cade-visible):not(.cade-exiting) .bg-grain,
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .chevrons,
  body:not(.cade-visible):not(.cade-exiting) .body,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .season-mark {
    opacity: 0 !important;
  }
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .chevrons,
  body:not(.cade-visible):not(.cade-exiting) .body,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .season-mark {
    animation-name: none !important;
  }
  body.cade-visible .bg-image,
  body.cade-visible .bg-vignette,
  body.cade-visible .bg-grain {
    opacity: 1;
    transition: opacity 0.4s ease-out;
  }
  body.cade-exiting .bg-image,
  body.cade-exiting .bg-vignette,
  body.cade-exiting .bg-grain {
    opacity: 0 !important;
    transition: opacity 0.5s cubic-bezier(0.7, 0, 0.84, 0);
  }
  body.cade-exiting .top-band,
  body.cade-exiting .chevrons,
  body.cade-exiting .body,
  body.cade-exiting .partners,
  body.cade-exiting .season-mark {
    animation: cade-fade-out 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
  }
  @keyframes cade-fade-out {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* ── STAGE (1920×1080 fixed canvas, transparent for default-OFF) ─────── */
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    isolation: isolate;
  }

  /* ── BG: halftone-green stadium texture ─────────────────────── */
  /*  Distinct family from the Starting Soon variant: this one
      slowly zooms OUT (1.06 → 1.00) then back in over 22s, with
      a synced brightness breathe — gives an "exhale" feel that
      reads as a sign-off rather than a build-up.                */
  .bg-image {
    position: absolute;
    inset: -3% -3%;
    background-image: url('../../../designsample/ELITE%20S2%20BG.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform-origin: 50% 50%;
    animation: bg-exhale 22s ease-in-out infinite,
               bg-breathe 7s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes bg-exhale {
    0%   { transform: scale(1.06) translate(0.4%, 0.2%); }
    50%  { transform: scale(1.00) translate(0, 0); }
    100% { transform: scale(1.06) translate(-0.4%, -0.2%); }
  }
  @keyframes bg-breathe {
    0%, 100% { filter: brightness(0.96) saturate(0.98); }
    50%      { filter: brightness(1.04) saturate(1.06); }
  }

  /* dark gradient overlay so text reads cleanly (heavier at bottom 30%) */
  .bg-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(5,5,5,0) 0%, rgba(5,5,5,0.30) 55%, rgba(5,5,5,0.78) 100%),
      linear-gradient(to bottom, rgba(5,5,5,0.10) 0%, rgba(5,5,5,0.10) 50%, rgba(5,5,5,0.55) 75%, rgba(5,5,5,0.85) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* subtle scanline grain to match samples' "screen" feel */
  .bg-grain {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0 1px,
        transparent 1px 3px
      );
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* ── TOP HEADER BAND (CADE | PRO LEAGUE) — enlarged 40% ─────── */
  .top-band {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    z-index: 10;
  }

  .top-band .logo {
    height: 134px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
  }

  .top-band .logo--cade { height: 124px; }
  .top-band .logo--pro  { height: 146px; }

  .top-band .divider {
    width: 2px;
    height: 110px;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 20%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 80%,
      rgba(255,255,255,0) 100%
    );
    border-radius: 1px;
  }

  /* ── SIDE CHEVRONS (decorative motif from samples) ──────────── */
  /*  Distinct from the Starting Soon variant: chevrons here
      drift INWARD (left side moves right, right side moves left)
      in a slow opposing breath — feels like the frame is
      gently closing on the sign-off message.                    */
  .chevrons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 38px;
    z-index: 5;
    pointer-events: none;
  }
  .chevrons--left  { left: 70px; }
  .chevrons--right { right: 70px; }

  .chevron {
    width: 88px;
    height: 64px;
    color: var(--green);
    opacity: 0.55;
    animation: chev-pulse-left 5s ease-in-out infinite;
  }
  .chevron svg { width: 100%; height: 100%; display: block; }

  .chevrons--left  .chevron:nth-child(1) { animation-delay: 0s;    }
  .chevrons--left  .chevron:nth-child(2) { animation-delay: 0.5s;  }
  .chevrons--left  .chevron:nth-child(3) { animation-delay: 1.0s;  }
  .chevrons--left  .chevron:nth-child(4) { animation-delay: 1.5s;  }
  .chevrons--right .chevron:nth-child(1) { animation-delay: 0.25s; }
  .chevrons--right .chevron:nth-child(2) { animation-delay: 0.75s; }
  .chevrons--right .chevron:nth-child(3) { animation-delay: 1.25s; }
  .chevrons--right .chevron:nth-child(4) { animation-delay: 1.75s; }

  @keyframes chev-pulse-left {
    0%, 100% { opacity: 0.25; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(10px); }
  }
  .chevrons--right .chevron {
    animation-name: chev-pulse-right;
  }
  @keyframes chev-pulse-right {
    0%, 100% { opacity: 0.25; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(-10px); }
  }

  /* ── BODY: kicker + giant title + subtitle ──────────────────── */
  .body {
    position: absolute;
    top: 54%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1700px;
    text-align: center;
    z-index: 20;
  }

  .kicker {
    display: inline-block;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.32em;
    color: var(--ink);
    text-transform: uppercase;
    padding: 10px 26px 10px 28px;
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    margin-bottom: 30px;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  /* The title is laid out as individual <span> letters so we can
     stagger a per-letter glow breath. Each letter shares the same
     `letter-glow` keyframes but gets a delay calculated from its
     index so the cycle reads as a wave moving across the line. */
  .title {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 180px;
    line-height: 0.86;
    letter-spacing: -0.012em;
    color: var(--ink);
    text-transform: uppercase;
    margin: 0;
    /* Layered base glow so the per-letter breath has something
       to push against — keeps the headline feeling solid even
       at the dim part of each letter's cycle. */
    text-shadow:
      0 0 1px rgba(255,255,255,0.85),
      0 6px 22px rgba(0,0,0,0.65),
      0 0 38px rgba(107,205,6,0.16);
  }

  .title .word {
    display: inline-block;
    white-space: nowrap;
  }
  .title .word + .word { margin-left: 0.32em; }

  .title .ltr {
    display: inline-block;
    animation: letter-glow 3.6s ease-in-out infinite;
    will-change: text-shadow, transform;
  }

  @keyframes letter-glow {
    0%, 100% {
      text-shadow:
        0 0 1px rgba(255,255,255,0.85),
        0 6px 22px rgba(0,0,0,0.65),
        0 0 18px rgba(107,205,6,0.10);
      transform: translateY(0);
    }
    50% {
      text-shadow:
        0 0 1px rgba(255,255,255,1),
        0 6px 22px rgba(0,0,0,0.65),
        0 0 56px rgba(107,205,6,0.36),
        0 0 96px rgba(107,205,6,0.18);
      transform: translateY(-2px);
    }
  }

  /* a thin pink underline accent — micro brand cue */
  .title-rule {
    width: 280px;
    height: 5px;
    margin: 36px auto 26px;
    background: var(--pink);
    border-radius: 3px;
    box-shadow:
      0 0 14px var(--pink-glow),
      0 0 28px rgba(254,3,109,0.30);
    animation: rule-breathe 4.4s ease-in-out infinite;
  }
  @keyframes rule-breathe {
    0%, 100% { transform: scaleX(0.92); opacity: 0.85; }
    50%      { transform: scaleX(1.00); opacity: 1.00; }
  }

  .subtitle {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 36px;
    letter-spacing: 0.36em;
    color: var(--ink);
    text-transform: uppercase;
    opacity: 0.92;
    animation: subtitle-breathe 4.4s ease-in-out infinite;
  }

  @keyframes subtitle-breathe {
    0%, 100% { opacity: 0.70; letter-spacing: 0.32em; }
    50%      { opacity: 1.00; letter-spacing: 0.40em; }
  }

  /* ── BOTTOM PARTNER STRIP (MARQUEE — 4 partners scrolling) ──── */
  /*  Logos scroll continuously right→left in a steady news-ticker.
      Track of the partner row duplicated 3× translates 0 → -33.33%
      over 40s linear, looping seamlessly because the duplicates
      are exact copies of the source row.                            */
  .partners {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 12;
  }

  .partners-label {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.70);
    text-transform: uppercase;
  }

  .marquee {
    position: relative;
    width: 1080px;
    max-width: 90%;
    overflow: hidden;
    padding: 18px 0;
    background: rgba(8,8,8,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
            mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 60px,
      #000 calc(100% - 60px),
      transparent 100%
    );
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 40s linear infinite;
    will-change: transform;
  }

  @keyframes marquee-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-33.3333%); }
  }

  .marquee-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 76px;
    padding: 0 38px;
    flex-shrink: 0;
  }

  .marquee-group .partner {
    height: 80px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }

  .marquee-group .partner--gameevo  { height: 80px; }
  .marquee-group .partner--pride    { height: 80px; }
  .marquee-group .partner--africa   { height: 80px; }
  .marquee-group .partner--trace    { height: 80px; }

  /* ── CORNER WATERMARK (season ID, very subtle) ──────────────── */
  .season-mark {
    position: absolute;
    top: 30px;
    right: 38px;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.40em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    z-index: 12;
  }
  .season-mark::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 10px;
    transform: translateY(-1px);
    box-shadow: 0 0 10px var(--green-glow);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.55; transform: translateY(-1px) scale(1); }
    50%      { opacity: 1;    transform: translateY(-1px) scale(1.2); }
  }
</style>
</head>
<body>

          <path d="M40 6 L12 32 L40 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

      </div>
      <div class="chevron">

          <path d="M74 6 L46 32 L74 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 6 L12 32 L40 58" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

  <script>
    /* === SPLIT GATE: master visibility ===
       Body always opacity 1 — bg shows continuously.
       Body class cade-visible/cade-exiting drives inner-content opacity. */
    (function cadeGate() {
      'use strict';
      function show() {
        document.body.classList.remove('cade-exiting');
        document.body.classList.add('cade-visible');
      }
      function hide() {
        document.body.classList.remove('cade-visible');
        document.body.classList.add('cade-exiting');
      }
      window.addEventListener('message', function (ev) {
        var msg = ev && ev.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'show' || msg.type === 'update') show();
        else if (msg.type === 'hide') hide();
      }, false);
    })();
  </script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  var SEL = '.bg-image,.bg-vignette,.bg-grain,.body,.chevrons,.partners,.season-mark,.top-band';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    var exit = b.classList.contains('cade-exiting');
    document.querySelectorAll(SEL).forEach(function(el){
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.removeProperty('transform');
        el.style.setProperty('visibility', 'visible', 'important');
      } else if (exit) {
        el.style.setProperty('opacity', '0', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function(){ fire('show'); }, 200);
  // Loop: show 5s, hide 3s, repeat.
  setInterval(function(){ fire('hide'); }, 8000);
  setTimeout(function(){
    setInterval(function(){ fire('show'); }, 8000);
  }, 8000 - 5000); // offset so show fires 5s after each hide
})();
</script>
