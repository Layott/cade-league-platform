<script id="cade-token-bootstrap">
(function() {
  // Wave 2 Stage 3 — cross-document design + text + partner propagation.
  //
  // Read base64-encoded JSON token maps from the iframe URL query
  // string and emit <style> blocks that win the CSS source-order
  // cascade (appended LATER in <head> than the author defaults).
  //
  // Token shapes:
  //   tokens / previewTokens     — { 'bg-color': '#000', ... }
  //   textTokens / previewTextTokens — { '<elementId>': { visible?,
  //     content?, styles?: { color, fontFamily, fontSize, ... } } }
  //   partnerTokens / previewPartnerTokens — {
  //     layout?: { anchor, positionXPx, positionYPx, scalePct,
  //                itemSpacingPx, orientation, justification,
  //                zIndex, visible },
  //     logos?: [ { partnerKey, label, alt, fileUrl, visible?, sort? } ]
  //   }
  //
  // Spec: docs/superpowers/specs/2026-04-29-overlay-design-page-v2.md §6.2
  function decodeTokens(param) {
    if (!param) return null;
    try {
      var json = decodeURIComponent(escape(atob(param)));
      var obj = JSON.parse(json);
      if (typeof obj !== 'object' || !obj) return null;
      return obj;
    } catch (e) { return null; }
  }
  function buildCssVars(tokens) {
    if (!tokens) return '';
    var parts = [];
    var imageKeys = { 'bg-image': 1 };
    for (var k in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, k)) continue;
      var v = tokens[k];
      if (typeof v !== 'string') continue;
      var safe = v.replace(/[;{}<>"']/g, '');
      if (imageKeys[k]) {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': url("' + safe + '")');
      } else {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': ' + safe);
      }
    }
    return parts.length ? ':root{' + parts.join(';') + ';}' : '';
  }
  function sanitizeCss(v) {
    return String(v == null ? '' : v).replace(/[;{}<>"\\`]/g, '');
  }
  function buildTextRules(tokens) {
    if (!tokens || typeof tokens !== 'object') return '';
    var rules = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      var s = t.styles || {};
      var declarations = [];
      if (s.color)         declarations.push('color:' + sanitizeCss(s.color));
      if (s.fontFamily)    declarations.push("font-family:'" + sanitizeCss(s.fontFamily) + "'");
      if (s.fontWeight)    declarations.push('font-weight:' + (+s.fontWeight || 400));
      if (s.fontSize)      declarations.push('font-size:' + sanitizeCss(s.fontSize));
      if (s.letterSpacing) declarations.push('letter-spacing:' + sanitizeCss(s.letterSpacing));
      if (s.lineHeight != null) declarations.push('line-height:' + (+s.lineHeight || 1));
      if (s.textAlign)     declarations.push('text-align:' + sanitizeCss(s.textAlign));
      if (s.opacity != null) declarations.push('opacity:' + (+s.opacity || 0));
      // Y-position bug fix (2026-04-28): switch from `left/top + position:absolute`
      // to the CSS individual `translate:` property. `absolute` resolved against
      // the nearest positioned ancestor (often a transformed centering wrapper),
      // so `top:Npx` did not move the element on the 1920x1080 canvas. `translate`
      // is a pure visual displacement and composes with existing `transform: ...`
      // animation keyframes via the Transforms 2 spec.
      if (s.left || s.top) {
        var tx = s.left ? sanitizeCss(s.left) : '0px';
        var ty = s.top ? sanitizeCss(s.top) : '0px';
        declarations.push('translate:' + tx + ' ' + ty + ' !important');
      }
      if (s.zIndex != null) declarations.push('z-index:' + (+s.zIndex || 0));
      if (t.visible === false) declarations.push('display:none');
      if (declarations.length) {
        rules.push('[data-element-id="' + elId + '"]{' + declarations.join(';') + ';}');
      }
    }
    return rules.join('\n');
  }
  function applyTextContent(tokens) {
    if (!tokens || typeof tokens !== 'object') return;
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      if (typeof t.content !== 'string') continue;
      if (t.content === '' || t.content == null) continue;
      var node = document.querySelector('[data-element-id="' + elId + '"]');
      if (!node) continue;
      try { node.textContent = t.content; } catch (e) { /* read-only */ }
    }
  }
  function buildPartnerLayoutRule(layout) {
    if (!layout || typeof layout !== 'object') return '';
    if (layout.visible === false) {
      return '[data-element-id="partners-strip"]{display:none !important;}';
    }
    var declarations = [];
    declarations.push('display:flex !important');
    declarations.push('flex-direction:' + (layout.orientation === 'vertical' ? 'column' : 'row') + ' !important');
    declarations.push('justify-content:' + sanitizeCss(layout.justification || 'center') + ' !important');
    declarations.push('align-items:center !important');
    declarations.push('gap:' + ((+layout.itemSpacingPx) || 0) + 'px !important');
    declarations.push('z-index:' + ((+layout.zIndex) || 12) + ' !important');
    declarations.push('position:absolute !important');
    var anchor = layout.anchor || 'bottom-center';
    var px = (+layout.positionXPx) || 0;
    var py = (+layout.positionYPx) || 0;
    var sx = ((+layout.scalePct) || 100) / 100;
    var transformOps = [];
    if (anchor.indexOf('top') === 0) {
      declarations.push('top:' + py + 'px !important');
      declarations.push('bottom:auto !important');
    } else if (anchor.indexOf('bottom') === 0) {
      declarations.push('bottom:' + py + 'px !important');
      declarations.push('top:auto !important');
    } else {
      declarations.push('top:' + py + 'px !important');
      declarations.push('bottom:auto !important');
      transformOps.push('translateY(-50%)');
    }
    if (anchor.indexOf('left') !== -1) {
      declarations.push('left:' + px + 'px !important');
      declarations.push('right:auto !important');
    } else if (anchor.indexOf('right') !== -1) {
      declarations.push('right:' + px + 'px !important');
      declarations.push('left:auto');
    } else {
      declarations.push('left:50% !important');
      declarations.push('right:auto !important');
      transformOps.push('translateX(-50%)');
    }
    if (sx !== 1) declarations.push('scale:' + sx + ' !important');
    if (transformOps.length) {
      declarations.push('transform:' + transformOps.join(' ') + ' !important');
      declarations.push('transform-origin:center center');
    }
    return '[data-element-id="partners-strip"]{' + declarations.join(';') + ';}';
  }
  function applyPartnerLogos(logos, layout) {
    if (!Array.isArray(logos)) return false;
    var strip = document.querySelector('[data-element-id="partners-strip"]');
    if (!strip) return false;
    // Filter visible + sort.
    var sorted = logos
      .filter(function(l) { return l && l.visible !== false && typeof l.fileUrl === 'string'; })
      .slice()
      .sort(function(a, b) {
        var sa = typeof a.sort === 'number' ? a.sort : 999;
        var sb = typeof b.sort === 'number' ? b.sort : 999;
        return sa - sb;
      });
    if (sorted.length === 0 && (!layout || layout.visible !== false)) {
      // No logos but layout present — leave existing children alone.
      return false;
    }
    // Wipe existing children.
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    // Mark as flex container so the layout CSS takes effect even without
    // browser quirks.
    sorted.forEach(function(l) {
      var img = document.createElement('img');
      var safeKey = sanitizeCss(l.partnerKey || 'x');
      img.className = 'partner partner--' + safeKey;
      img.src = sanitizeCss(l.fileUrl);
      img.alt = sanitizeCss(l.alt || l.label || '');
      img.setAttribute('data-partner-key', safeKey);
      strip.appendChild(img);
    });
    return true;
  }
  // ────────── Stage 4 — element animations ──────────
  //
  // Build @keyframes BODY for a given preset anim type. Mirrors
  // server/overlays/animations/elements.ts::buildKeyframesBody — same
  // values across server-side resolver + client-side bootstrap so
  // SSR-emitted styles + URL-borne overrides yield identical motion.
  function buildPresetKeyframes(animType, name, customBody) {
    switch (animType) {
      case 'slide-left':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-right':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-up':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}';
      case 'slide-down':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(-32px)}to{opacity:1;transform:translateY(0)}}';
      case 'fade':
        return '@keyframes ' + name + '{from{opacity:0}to{opacity:1}}';
      case 'scale':
        return '@keyframes ' + name + '{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}';
      case 'rotate':
        return '@keyframes ' + name + '{from{opacity:0;transform:rotate(-12deg)}to{opacity:1;transform:rotate(0)}}';
      case 'bounce':
        return '@keyframes ' + name + '{0%{opacity:0;transform:translateY(20px)}60%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}';
      case 'pulse':
        return '@keyframes ' + name + '{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}';
      case 'glow':
        return '@keyframes ' + name + '{0%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}50%{filter:drop-shadow(0 0 24px rgba(107,205,6,0.55))}100%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}}';
      case 'shake':
        return '@keyframes ' + name + '{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
      case 'flip':
        return '@keyframes ' + name + '{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:perspective(800px) rotateY(0)}}';
      case 'custom-css':
        // Defence-in-depth: strip url(), at-rules, and angle/backtick
        // characters even if server sanitizer was bypassed (URL-borne).
        if (typeof customBody !== 'string') return '';
        if (/\burl\s*\(/i.test(customBody)) return '';
        if (/@(import|font-face|charset|media|supports|keyframes)\b/i.test(customBody)) return '';
        if (/[<>\`]/.test(customBody)) return '';
        return '@keyframes ' + name + '{' + customBody + '}';
      case 'none':
      default:
        return '';
    }
  }
  function buildAnimRulesAndKeyframes(tokens) {
    if (!tokens || typeof tokens !== 'object') return { keyframes: '', rules: '' };
    var keyframesParts = [];
    var rulesParts = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var phases = tokens[elId];
      if (!phases || typeof phases !== 'object') continue;
      for (var phase in phases) {
        if (!Object.prototype.hasOwnProperty.call(phases, phase)) continue;
        if (phase !== 'entry' && phase !== 'exit' && phase !== 'continuous') continue;
        var p = phases[phase];
        if (!p || typeof p !== 'object') continue;
        if (p.enabled === false) continue;
        if (!p.animType || p.animType === 'none') continue;
        var animName = 'cade-' + elId + '-' + phase;
        var kf = buildPresetKeyframes(
          p.animType,
          animName,
          p.customCssKeyframes || ''
        );
        if (!kf) continue;
        keyframesParts.push(kf);
        var duration = (+p.durationMs) || 360;
        var delay = (+p.delayMs) || 0;
        var easing = sanitizeCss(p.easing || 'ease-out');
        var iterations = sanitizeCss(p.iterationCount || '1');
        // Phase-gated selector. Continuous animations only run while
        // the overlay is visible (cade-visible class on body).
        var sel =
          phase === 'exit'
            ? 'body.cade-exiting [data-element-id="' + elId + '"]'
            : 'body.cade-visible [data-element-id="' + elId + '"]';
        var rule =
          'animation:' + animName +
          ' ' + duration + 'ms' +
          ' ' + easing +
          ' ' + delay + 'ms' +
          ' ' + iterations +
          ' both;';
        rulesParts.push(sel + '{' + rule + '}');
      }
    }
    return {
      keyframes: keyframesParts.join('\n'),
      rules: rulesParts.join('\n'),
    };
  }
  try {
    var qs = new URLSearchParams(location.search);
    var design = decodeTokens(qs.get('tokens'));
    var preview = decodeTokens(qs.get('previewTokens'));
    var textTokens = decodeTokens(qs.get('textTokens'));
    var previewTextTokens = decodeTokens(qs.get('previewTextTokens'));
    var partnerTokens = decodeTokens(qs.get('partnerTokens'));
    var previewPartnerTokens = decodeTokens(qs.get('previewPartnerTokens'));
    var animTokens = decodeTokens(qs.get('animTokens'));
    var previewAnimTokens = decodeTokens(qs.get('previewAnimTokens'));
    // Source order: design first, preview second so preview wins.
    var cssVarRule = buildCssVars(design) + buildCssVars(preview);
    var textRule = buildTextRules(textTokens) + (buildTextRules(textTokens).length && buildTextRules(previewTextTokens).length ? '\n' : '') + buildTextRules(previewTextTokens);
    // Partner layout: preview wins by being applied second (later
    // <style> block wins on identical selector via source-order).
    var partnerRules = [];
    if (partnerTokens && partnerTokens.layout) {
      var r1 = buildPartnerLayoutRule(partnerTokens.layout);
      if (r1) partnerRules.push(r1);
    }
    if (previewPartnerTokens && previewPartnerTokens.layout) {
      var r2 = buildPartnerLayoutRule(previewPartnerTokens.layout);
      if (r2) partnerRules.push(r2);
    }
    // Stage 4 — element animations. Build keyframes + rules from both
    // design + preview maps. Source-order wins on identical names: the
    // preview block emits second, so its keyframes & rules overwrite
    // design's via CSS cascade (same selector + same animation-name).
    var animDesign = buildAnimRulesAndKeyframes(animTokens);
    var animPreview = buildAnimRulesAndKeyframes(previewAnimTokens);
    var animKeyframesCss = animDesign.keyframes +
      (animDesign.keyframes && animPreview.keyframes ? '\n' : '') +
      animPreview.keyframes;
    var animRulesCss = animDesign.rules +
      (animDesign.rules && animPreview.rules ? '\n' : '') +
      animPreview.rules;
    var emit = function() {
      if (!document.head) return;
      if (cssVarRule) {
        var s1 = document.createElement('style');
        s1.id = 'cade-injected-tokens';
        s1.textContent = cssVarRule;
        document.head.appendChild(s1);
      }
      if (textRule) {
        var s2 = document.createElement('style');
        s2.id = 'cade-injected-text';
        s2.textContent = textRule;
        document.head.appendChild(s2);
      }
      if (partnerRules.length) {
        var s3 = document.createElement('style');
        s3.id = 'cade-injected-partners-layout';
        s3.textContent = partnerRules.join('\n');
        document.head.appendChild(s3);
      }
      // Stage 4 — animation keyframes block FIRST (must precede rules
      // so the named animations resolve).
      if (animKeyframesCss) {
        var s4 = document.createElement('style');
        s4.id = 'cade-injected-anim-keyframes';
        s4.textContent = animKeyframesCss;
        document.head.appendChild(s4);
      }
      if (animRulesCss) {
        var s5 = document.createElement('style');
        s5.id = 'cade-injected-anim-rules';
        s5.textContent = animRulesCss;
        document.head.appendChild(s5);
      }
      // Apply textContent edits AFTER DOM is parsed.
      applyTextContent(textTokens);
      applyTextContent(previewTextTokens);
      // Rebuild partner strip children — preview wins by being applied
      // second (overwrites design's children).
      if (partnerTokens && Array.isArray(partnerTokens.logos)) {
        applyPartnerLogos(partnerTokens.logos, partnerTokens.layout);
      }
      if (previewPartnerTokens && Array.isArray(previewPartnerTokens.logos)) {
        applyPartnerLogos(previewPartnerTokens.logos, previewPartnerTokens.layout);
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', emit);
    } else {
      emit();
    }
  } catch (e) {
    // Bootstrap MUST never throw — fall back to HTML defaults.
  }
})();
</script>

  /* ── Phase 2 design tokens (admin-tunable via CSS variables) ── */
  :root {
    --overlay-bg-color: #050505;
    --overlay-accent-color: #6bcd06;
    --overlay-text-color: #ffffff;
    --overlay-font-display: "Agharti", "Oswald", "Bebas Neue", "Impact", sans-serif;
    --overlay-font-body: "Quedora", "Rajdhani", "Saira Condensed", sans-serif;
    --overlay-scale: 1;
    --overlay-pos-x: 0px;
    --overlay-pos-y: 60px;
    --overlay-pattern: none;
    --overlay-partner-strip-show: flex;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    color-scheme: dark;
    font-family: var(--overlay-font-display);
    color: var(--overlay-text-color);
  }
  /* === SPLIT GATE (Category A small anchored bug):
     Body always opacity 1 (transparent canvas, only .bug visible).
     The .bug itself starts opacity 0 and only shows on .visible class. === */
  body { opacity: 1 !important; background: transparent !important; }
  .stage { background: transparent !important; }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: transparent;
  }

  /* ------------------------------------------------------------
     Root bug container (bottom-center anchor) — auto-fit width
     ------------------------------------------------------------ */
  .bug {
    position: absolute;
    left: calc(50% + var(--overlay-pos-x, 0px));
    bottom: var(--overlay-pos-y, 60px);
    /* width is set inline by JS to fit names; default starting state */
    width: auto;
    height: 180px;
    transform: translateX(-50%) scale(var(--overlay-scale, 1));
    transform-origin: 50% 100%;
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }
  .bug.visible {
    visibility: visible;
  }
  .bug.entering {
    animation: bugEnter 1.1s cubic-bezier(.77,.0,.18,1) forwards;
  }
  .bug.exiting {
    animation: bugExit 0.5s cubic-bezier(.77,.0,.18,1) forwards;
  }
  @keyframes bugEnter {
    0%   { transform: translateX(-50%) translateY(260px) scale(var(--overlay-scale, 1)); opacity: 0; }
    50%  { transform: translateX(-50%) translateY(260px) scale(var(--overlay-scale, 1)); opacity: 0; }
    85%  { transform: translateX(-50%) translateY(-14px) scale(var(--overlay-scale, 1)); opacity: 1; }  /* overshoot */
    100% { transform: translateX(-50%) translateY(0)     scale(var(--overlay-scale, 1)); opacity: 1; }  /* land */
  }
  @keyframes bugExit {
    0%   { transform: translateX(-50%) translateY(0) scale(var(--overlay-scale, 1)) scaleX(1);    opacity: 1; }
    100% { transform: translateX(-50%) translateY(0) scale(var(--overlay-scale, 1)) scaleX(0.05); opacity: 0; }
  }

  /* ------------------------------------------------------------
     Label strip ("UP NEXT") — flashes in first
     ------------------------------------------------------------ */
  .label-strip {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%) scaleX(0.1);
    width: 280px;
    height: 38px;
    background: #fe036d;
    border: 2px solid #fe036d;
    border-bottom: none;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 0 30px rgba(254, 3, 109, 0.55);
    z-index: 6;
    opacity: 0;
  }
  .bug.entering .label-strip { animation: labelFlash 1.1s cubic-bezier(.77,.0,.18,1) forwards; animation-delay: 0.05s; }
  @keyframes labelFlash {
    0%   { opacity: 0; transform: translateX(-50%) scaleX(0.1); }
    20%  { opacity: 1; transform: translateX(-50%) scaleX(1.08); }  /* flash appear */
    35%  { opacity: 0.2; transform: translateX(-50%) scaleX(1); }
    50%  { opacity: 1; transform: translateX(-50%) scaleX(1); }
    65%  { opacity: 0.4; transform: translateX(-50%) scaleX(1); }
    100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
  }

  .label-strip .dot {
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px #fff;
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%,100% { opacity: 0.3; transform: scale(0.85); }
    50%     { opacity: 1;   transform: scale(1.15); }
  }
  .label-strip .label-text {
    font-family: "Quedora", "Rajdhani", "Saira Condensed", "Oswald", sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #fff;
    text-transform: uppercase;
  }

  /* ------------------------------------------------------------
     Main bar — black body with green accent frame
     ------------------------------------------------------------ */
  .bar {
    position: absolute;
    top: 30px;
    left: 0;
    width: 100%;
    height: 150px;
    background: linear-gradient(180deg, #0d0d0d 0%, #000 100%);
    border: 2px solid var(--overlay-accent-color, #6bcd06);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.8) inset,
      0 0 24px rgba(107, 205, 6, 0.35),
      0 10px 28px rgba(0,0,0,0.6);
    clip-path: polygon(
      24px 0, calc(100% - 24px) 0,
      100% 24px, 100% calc(100% - 24px),
      calc(100% - 24px) 100%, 24px 100%,
      0 calc(100% - 24px), 0 24px
    );
    overflow: hidden;
  }

  /* inner green hairline */
  .bar::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(107, 205, 6, 0.35);
    clip-path: polygon(
      20px 0, calc(100% - 20px) 0,
      100% 20px, 100% calc(100% - 20px),
      calc(100% - 20px) 100%, 20px 100%,
      0 calc(100% - 20px), 0 20px
    );
    pointer-events: none;
  }

  /* subtle diagonal sheen */
  .bar::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(107, 205, 6, 0.08) 45%,
      rgba(255, 255, 255, 0.12) 50%,
      rgba(107, 205, 6, 0.08) 55%,
      transparent 100%
    );
    transform: skewX(-18deg);
    pointer-events: none;
    opacity: 0;
  }
  .bug.entering .bar::after { animation: barSheen 1.4s ease-in-out forwards; animation-delay: 0.45s; }
  @keyframes barSheen {
    0%   { left: -40%; opacity: 0; }
    50%  { left: 140%; opacity: 0.9; }
    100% { left: 140%; opacity: 0; }
  }

  /* ------------------------------------------------------------
     Player panels (left & right) — flexible widths
     ------------------------------------------------------------ */
  .player {
    position: absolute;
    top: 30px;
    height: 150px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 28px;
    z-index: 3;
    opacity: 0;
  }

  .player-left {
    left: 0;
    justify-content: flex-start;
  }
  .player-right {
    right: 0;
    justify-content: flex-end;
    flex-direction: row-reverse;
  }
  .bug.entering .player-left  { animation: panelInLeft  0.7s cubic-bezier(.77,.0,.18,1) forwards; animation-delay: 0.35s; }
  .bug.entering .player-right { animation: panelInRight 0.7s cubic-bezier(.77,.0,.18,1) forwards; animation-delay: 0.35s; }

  @keyframes panelInLeft {
    0%   { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes panelInRight {
    0%   { opacity: 0; transform: translateX(60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* circular avatar with real photo + accent ring */
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
    border: 3px solid #000;
    box-shadow:
      0 0 0 4px #6bcd06,
      0 0 0 5px #000,
      0 0 22px rgba(107, 205, 6, 0.55),
      0 6px 14px rgba(0,0,0,0.55);
  }
  .player-right .avatar {
    box-shadow:
      0 0 0 4px #fe036d,
      0 0 0 5px #000,
      0 0 22px rgba(254, 3, 109, 0.55),
      0 6px 14px rgba(0,0,0,0.55);
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 18%;
    display: block;
  }
  /* subtle inner gloss */
  .avatar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.18) 0%, transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35) 0%, transparent 55%);
    pointer-events: none;
  }

  .name-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
  }
  .player-right .name-block {
    align-items: flex-end;
  }
  .name-block .tag {
    font-family: "Quedora", "Rajdhani", "Saira Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #6bcd06;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .player-right .name-block .tag {
    color: #fe036d;
  }
  .name-block .name {
    font-family: "Agharti", "Oswald", "Bebas Neue", "Impact", sans-serif;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ------------------------------------------------------------
     VS divider — pops with scale + rotation
     ------------------------------------------------------------ */
  .vs {
    position: absolute;
    top: 30px;
    left: 50%;
    width: 110px;
    height: 150px;
    transform: translateX(-50%) scale(0) rotate(-180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
  }
  .bug.entering .vs { animation: vsPop 0.85s cubic-bezier(.55,1.6,.5,1) forwards; animation-delay: 0.55s; }

  .vs .vs-core {
    position: relative;
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    border: 2px solid #fe036d;
    transform: rotate(45deg);
    box-shadow:
      0 0 0 3px #000,
      0 0 24px rgba(254, 3, 109, 0.55),
      inset 0 0 12px rgba(254, 3, 109, 0.25);
  }
  .vs .vs-core::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(107, 205, 6, 0.55);
  }
  .vs .vs-text {
    font-family: "Agharti", "Oswald", "Bebas Neue", sans-serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    transform: rotate(-45deg);
    text-shadow:
      0 0 10px rgba(254, 3, 109, 0.9),
      0 2px 2px rgba(0,0,0,0.6);
  }

  @keyframes vsPop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0) rotate(-180deg); }
    35%  { opacity: 1; transform: translateX(-50%) scale(1.25) rotate(10deg); }
    55%  { opacity: 1; transform: translateX(-50%) scale(0.92) rotate(-6deg); }
    75%  { opacity: 1; transform: translateX(-50%) scale(1.05) rotate(2deg); }
    100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
  }

  /* ------------------------------------------------------------
     Corner accents on the main bar
     ------------------------------------------------------------ */
  .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    z-index: 2;
  }
  .corner.tl { top: 8px;  left: 8px;  border-top: 2px solid #6bcd06; border-left: 2px solid #6bcd06; }
  .corner.tr { top: 8px;  right: 8px; border-top: 2px solid #6bcd06; border-right: 2px solid #6bcd06; }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid #6bcd06; border-left: 2px solid #6bcd06; }
  .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid #6bcd06; border-right: 2px solid #6bcd06; }

  /* helper for off-screen name measurement */
  .measure {
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    pointer-events: none;
    left: -9999px;
    top: -9999px;
    font-family: "Agharti", "Oswald", "Bebas Neue", "Impact", sans-serif;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Universal partner-img sizing — applies regardless of nested marquee wrapper. */
  [data-element-id="partners-strip"] img.partner { height: 50px !important; width: auto !important; object-fit: contain !important; }
</style>
</head>
<body>

<div class="stage">

  <div data-element-id="up-next-card" class="bug" id="bug">

    <!-- ============== UP NEXT label strip ============== -->
    <div class="label-strip">
      <span class="dot"></span>
      <span class="label-text">UP NEXT</span>
      <span class="dot"></span>
    </div>

    <!-- ============== Main bar ============== -->
    <div class="bar">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <!-- ============== Player LEFT ============== -->
    <div class="player player-left">
      <div class="avatar">
        <img id="photo1" alt="" />
      </div>
      <div class="name-block">
        <div class="tag">Player 1</div>
        <div class="name" id="name1">FARUK</div>
      </div>
    </div>

    <!-- ============== VS divider ============== -->
    <div class="vs">
      <div class="vs-core">
        <div class="vs-text">VS</div>
      </div>
    </div>

    <!-- ============== Player RIGHT ============== -->
    <div class="player player-right">
      <div class="avatar">
        <img id="photo2" alt="" />
      </div>
      <div class="name-block">
        <div class="tag">Player 2</div>
        <div class="name" id="name2">KAYKAY</div>
      </div>
    </div>

  </div>

  <span class="measure" id="measure"></span>

</div>

<script>
  (function () {
    var bug = document.getElementById('bug');
    var name1El = document.getElementById('name1');
    var name2El = document.getElementById('name2');
    var photo1El = document.getElementById('photo1');
    var photo2El = document.getElementById('photo2');
    var measureEl = document.getElementById('measure');

    var state = {
      player1: { name: 'FARUK',  slug: 'faruk',  photoUrl: null },
      player2: { name: 'KAYKAY', slug: 'kaykay', photoUrl: null }
    };

    // Canonical roster — derive slug from displayName when payload omits slug/gamerTag.
    // Mirrors the NAME_TO_SLUG map in 05-h2h-3 / 06-h2h-5 so all overlays resolve photos
    // identically when broadcast control sends only displayName (e.g. upNextBugSchema).
    var NAME_TO_SLUG = {
      'ADEFOLA': 'adefola', 'ANIFE': 'anife', 'BAJI JNR': 'baji_jnr',
      'DADABOI': 'dadaboi', 'FARUK': 'faruk', 'GURU': 'guru',
      'KAYKAY': 'kaykay', 'KILLER FREAK': 'killer_freak',
      'KING NONEX': 'kingnonex', 'KINGNONEX': 'kingnonex',
      'MITCH': 'mitch', 'MR OGA': 'mr_oga', 'MR. OGA': 'mr_oga',
      'TACTICAL': 'tactical', 'WOLEVATION': 'wolevation'
    };
    // 2026-04-26 — V2_PLAYER_SLUGS in TS uses `king_nonex` (underscore)
    // but the asset folder is `kingnonex`. Map known aberrant variants.
    var SLUG_ALIAS = {
      'kingnonex': 'kingnonex',
      'king_nonex': 'kingnonex'
    };
    // Pose override per slug (default = '01'). kingnonex pose 01 has
    // face_detected:false in the manifest — pin to pose 03 (face).
    var POSE_FOR_SLUG = { 'kingnonex': '03' };
    function canonSlug(s) {
      if (!s) return '';
      var lower = String(s).toLowerCase();
      if (SLUG_ALIAS[lower]) return SLUG_ALIAS[lower];
      return lower.replace(/[^a-z0-9]+/g, '_');
    }
    function photoUrl(slug) {
      var c = canonSlug(slug);
      if (!c) return '';
      var pose = POSE_FOR_SLUG[c] || '01';
      return '../../../players/processed/' + c + '/headshot_' + pose + '_nobg.png';
    }

    /**
     * Auto-fit bar width to player names.
     * Avatar(120) + gap(20) + name + padding(28*2) per side = ~196 + name width.
     * Plus 110 VS column. Capped at 900px, floor at 620px.
     */
    function computeWidth() {
      measureEl.textContent = state.player1.name;
      var w1 = measureEl.getBoundingClientRect().width;
      measureEl.textContent = state.player2.name;
      var w2 = measureEl.getBoundingClientRect().width;
      var widest = Math.max(w1, w2);
      // each side panel: avatar 120 + gap 20 + name + padding 28*2 = 196 + name
      var sidePanel = 196 + widest;
      // total = 2 sides + VS 110
      var total = (sidePanel * 2) + 110;
      // clamp
      if (total < 620) total = 620;
      if (total > 900) total = 900;
      return Math.round(total);
    }

    function applyWidth() {
      bug.style.width = computeWidth() + 'px';
    }

    function applyContent() {
      name1El.textContent = state.player1.name;
      name2El.textContent = state.player2.name;
      // photoUrl from payload wins; otherwise resolve via slug.
      // If slug is empty (unknown roster name), hide the photo cleanly.
      var u1 = state.player1.photoUrl || (state.player1.slug ? photoUrl(state.player1.slug) : '');
      var u2 = state.player2.photoUrl || (state.player2.slug ? photoUrl(state.player2.slug) : '');
      if (u1) {
        photo1El.style.display = '';
        if (photo1El.src !== u1) photo1El.src = u1;
      } else {
        photo1El.style.display = 'none';
      }
      if (u2) {
        photo2El.style.display = '';
        if (photo2El.src !== u2) photo2El.src = u2;
      } else {
        photo2El.style.display = 'none';
      }
      photo1El.alt = state.player1.name;
      photo2El.alt = state.player2.name;
      applyWidth();
    }

    function playEntry() {
      bug.classList.add('visible');
      bug.classList.remove('exiting');
      // restart entry animation
      bug.classList.remove('entering');
      // force reflow
      void bug.offsetWidth;
      bug.classList.add('entering');
    }

    function show() {
      playEntry();
    }

    function hide() {
      bug.classList.remove('entering');
      bug.classList.add('exiting');
      // hide visibility after exit animation
      setTimeout(function () {
        if (bug.classList.contains('exiting')) {
          bug.classList.remove('visible');
        }
      }, 520);
    }

    function normalizePlayer(p) {
      if (!p) return null;
      // Plan 51 schema sends gamerTag (canonical slug), legacy sends slug.
      var rawSlug = p.slug || p.gamerTag || '';
      var slug = canonSlug(rawSlug);
      var rawName = p.displayName || p.name || '';
      // upNextBugSchema only carries displayName — fall back to NAME_TO_SLUG so the
      // headshot resolves correctly without a slug field on the payload.
      if (!slug && rawName) {
        var canon = NAME_TO_SLUG[rawName.toString().trim().toUpperCase()];
        if (canon) slug = canon;
      }
      var name = rawName || (slug ? slug.replace(/_/g, ' ').toUpperCase() : '');
      var photoUrl = p.photoUrl || null;
      return { slug: slug, name: name, photoUrl: photoUrl };
    }

    function update(data) {
      if (!data) return;
      // Accept three payload shapes:
      //   { player1, player2 }                    (legacy + control panel)
      //   { homePlayer, awayPlayer, kickoffAt? }  (broadcast trigger)
      //   { players: [{slug,name}, ...] }         (generic h2h shape)
      // Plan 51 upNextBugSchema sends {home:{displayName},away:{displayName}}.
      var p1 = data.player1 || data.homePlayer || data.home ||
               (Array.isArray(data.players) ? data.players[0] : null);
      var p2 = data.player2 || data.awayPlayer || data.away ||
               (Array.isArray(data.players) ? data.players[1] : null);
      var n1 = normalizePlayer(p1);
      var n2 = normalizePlayer(p2);
      if (n1) {
        if (n1.name) state.player1.name = n1.name;
        // Always overwrite slug when the incoming payload identifies a player.
        // If slug is empty (unknown name), keep state.player1.slug so we don't
        // 404 the headshot — but this should never happen for canonical roster.
        if (n1.slug) state.player1.slug = n1.slug;
        else if (n1.name) state.player1.slug = ''; // signal: no headshot, use alt fallback
        state.player1.photoUrl = n1.photoUrl;
      }
      if (n2) {
        if (n2.name) state.player2.name = n2.name;
        if (n2.slug) state.player2.slug = n2.slug;
        else if (n2.name) state.player2.slug = '';
        state.player2.photoUrl = n2.photoUrl;
      }
      applyContent();
      playEntry();
    }

    window.addEventListener('message', function (ev) {
      var msg = ev && ev.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'update' || msg.type === 'show') {
        update(msg.data || {});
        if (msg.type === 'show') show();
      } else if (msg.type === 'hide') {
        hide();
      }
    }, false);

    // Initial render: render data into DOM but do NOT show.
    // Visibility is gated by postMessage {type:'show'} from operator.
    applyContent();
    // wait for fonts so width measurement uses real glyphs (no auto-show)
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { applyWidth(); });
    }
  })();
</script>

<script>
/* === STRICT GATE: master visibility, controlled ONLY by parent postMessage. === */
(function cadeGate() {
  'use strict';
  function show() {
    document.body.classList.remove('cade-exiting');
    document.body.classList.add('cade-visible');
  }
  function hide() {
    document.body.classList.remove('cade-visible');
    document.body.classList.add('cade-exiting');
  }
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'show' || msg.type === 'update') show();
    else if (msg.type === 'hide') hide();
  }, false);
})();
</script>

<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function(){ fire('show'); }, 200);
  // Loop: show 5s, hide 3s, repeat.
  setInterval(function(){ fire('hide'); }, 8000);
  setTimeout(function(){
    setInterval(function(){ fire('show'); }, 8000);
  }, 8000 - 5000); // offset so show fires 5s after each hide
})();
</script>
</body>
