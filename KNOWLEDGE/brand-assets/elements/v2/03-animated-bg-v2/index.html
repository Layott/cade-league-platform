<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #03 ANIMATED BACKGROUND — VARIANT 2/3
  Concept: Halftone stadium BG (static, no Ken-Burns) + drifting particle field
  + slow vertical CRT scanline crawl + edge chevron motifs + corner watermarks
  + soft vignette. Pure decoration: no header band, no partner strip, no copy.
  Distinct from v1 (hex-lattice + streaks) and v3 (forthcoming).

  DATA WIRES: none (decorative bg)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — Animated Background v2</title>

<style>
  /* ── REAL BRAND FONTS (only used for tiny corner watermarks) ─ */
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-BoldCondensed.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }

  /* ── DESIGN TOKENS (locked brand palette) ───────────────────── */
  :root {
    --green:        #6bcd06;
    --green-glow:   rgba(107, 205, 6, 0.55);
    --green-faint:  rgba(107, 205, 6, 0.18);
    --pink:         #fe036d;
    --pink-glow:    rgba(254, 3, 109, 0.55);
    --black:        #050505;
    --ink:          #ffffff;
    --display:      'Agharti', 'Impact', sans-serif;
    --accent:       'Quedora', 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--black);
    color: var(--ink);
    font-family: var(--accent);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* === SPLIT GATE (Category B full-canvas, pure bg) === */
  body { opacity: 1 !important; }
  .stage { opacity: 0; transition: opacity 0.6s ease-out; }
  body.cade-visible .stage { opacity: 1; }
  body.cade-exiting .stage { opacity: 0; transition: opacity 0.5s cubic-bezier(0.7, 0, 0.84, 0); }

  /* ── STAGE (1920×1080 fixed, OPAQUE) ────────────────────────── */
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0a0e07;
    isolation: isolate;
  }

  /* ── LAYER 0: STATIC HALFTONE STADIUM BG ─────────────────────
     No drift, no Ken-Burns — that's v1's job. Pure static cover.
  */
  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('../../../designsample/ELITE%20S2%20BG.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  /* Soft vignette for cinematic edge falloff */
  .bg-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%,
        rgba(5,5,5,0) 0%,
        rgba(5,5,5,0.18) 45%,
        rgba(5,5,5,0.55) 80%,
        rgba(5,5,5,0.85) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Subtle CRT-style horizontal scanline grain (constant, ambient) */
  .bg-grain {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0 1px,
        transparent 1px 3px
      );
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* ── LAYER 1: DRIFTING PARTICLE FIELD ───────────────────────
     ~36 dots spread across the canvas, each rising slowly with
     subtle horizontal sway. Sizes 2-5px, opacity 0.20-0.60,
     mix of green + pink. Each particle uses its own animation
     `delay` so the field looks continuous (no synchronized "wave").
     Vertical travel goes from y=110% to y=-10% — at the end of
     the cycle the dot resets below the canvas → seamless loop.
  */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    bottom: -10%;
    border-radius: 50%;
    will-change: transform, opacity;
    animation-name: particle-rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  /* dot variants — green vs pink, with shared glow blur */
  .particle.is-green {
    background: var(--green);
    box-shadow:
      0 0 6px rgba(107,205,6,0.55),
      0 0 14px rgba(107,205,6,0.25);
  }
  .particle.is-pink {
    background: var(--pink);
    box-shadow:
      0 0 6px rgba(254,3,109,0.55),
      0 0 14px rgba(254,3,109,0.25);
  }

  /* Rise + sway. Travel ~120vh upward; sway via translateX easing
     baked into a single keyframe set so the loop is seamless when
     translateY returns to start (delta wraps to bottom: -10% → -10%). */
  @keyframes particle-rise {
    0% {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 0;
    }
    8% {
      opacity: var(--p-opacity, 0.45);
    }
    25% {
      transform: translate3d(14px, -300px, 0) scale(1);
    }
    50% {
      transform: translate3d(-12px, -600px, 0) scale(1);
    }
    75% {
      transform: translate3d(10px, -900px, 0) scale(1);
    }
    92% {
      opacity: var(--p-opacity, 0.45);
    }
    100% {
      transform: translate3d(0, -1200px, 0) scale(1);
      opacity: 0;
    }
  }

  /* ── LAYER 2: SLOW VERTICAL SCANLINE CRAWL ───────────────────
     A 4px-tall semi-transparent green band sliding top→bottom
     every 14s. At the end of cycle it re-enters from the top.
     Uses `mix-blend-mode: screen` so it brightens the BG without
     hard-blocking it.
  */
  .scanline-crawl {
    position: absolute;
    left: 0;
    right: 0;
    top: -4px;
    height: 4px;
    background: linear-gradient(
      to bottom,
      rgba(107,205,6,0) 0%,
      rgba(107,205,6,0.45) 50%,
      rgba(107,205,6,0) 100%
    );
    box-shadow:
      0 0 18px rgba(107,205,6,0.40),
      0 0 36px rgba(107,205,6,0.20);
    mix-blend-mode: screen;
    z-index: 4;
    pointer-events: none;
    animation: scanline-slide 14s linear infinite;
    will-change: transform;
  }

  @keyframes scanline-slide {
    0%   { transform: translateY(0); }
    100% { transform: translateY(1090px); } /* canvas + gutter, exits cleanly */
  }

  /* ── LAYER 3: EDGE CHEVRON MOTIFS (>>) ───────────────────────
     5 stacked left + 5 stacked right, slow staggered opacity pulse.
     Right side mirrors direction (<<). Decorative only.
  */
  .chevrons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 42px;
    z-index: 5;
    pointer-events: none;
  }
  .chevrons--left  { left: 60px;  }
  .chevrons--right { right: 60px; }

  .chevron {
    width: 88px;
    height: 64px;
    color: var(--green);
    opacity: 0.40;
    animation-name: chev-pulse-left;
    animation-duration: 5.4s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  .chevron svg { width: 100%; height: 100%; display: block; }

  .chevrons--left  .chevron:nth-child(1) { animation-delay: 0s;    }
  .chevrons--left  .chevron:nth-child(2) { animation-delay: 0.5s;  }
  .chevrons--left  .chevron:nth-child(3) { animation-delay: 1.0s;  }
  .chevrons--left  .chevron:nth-child(4) { animation-delay: 1.5s;  }
  .chevrons--left  .chevron:nth-child(5) { animation-delay: 2.0s;  }
  .chevrons--right .chevron {
    animation-name: chev-pulse-right;
  }
  .chevrons--right .chevron:nth-child(1) { animation-delay: 0.7s;  }
  .chevrons--right .chevron:nth-child(2) { animation-delay: 1.2s;  }
  .chevrons--right .chevron:nth-child(3) { animation-delay: 1.7s;  }
  .chevrons--right .chevron:nth-child(4) { animation-delay: 2.2s;  }
  .chevrons--right .chevron:nth-child(5) { animation-delay: 2.7s;  }

  @keyframes chev-pulse-left {
    0%, 100% { opacity: 0.20; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(8px); }
  }
  @keyframes chev-pulse-right {
    0%, 100% { opacity: 0.20; transform: translateX(0); }
    50%      { opacity: 0.85; transform: translateX(-8px); }
  }

  /* ── LAYER 4: TOP HEADER BAND (CADE | PRO LEAGUE) ───────────── */
  .top-band {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    z-index: 10;
  }
  .top-band .logo {
    height: 140px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
  }
  .top-band .logo--cade { height: 128px; }
  .top-band .logo--pro  { height: 152px; }
  .top-band .divider {
    width: 2px;
    height: 110px;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 20%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 80%,
      rgba(255,255,255,0) 100%
    );
    border-radius: 1px;
  }

  /* ── BOTTOM PARTNER STRIP (static) ────────────────────────────── */
  .partners {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 12;
  }
  .partners-label {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.70);
    text-transform: uppercase;
  }
  .partners-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 76px;
    padding: 14px 38px;
    background: rgba(8,8,8,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .partners-row .partner {
    height: 70px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }
  .partners-row .partner--gameevo { height: 64px; }
  .partners-row .partner--pride   { height: 58px; }
  .partners-row .partner--africa  { height: 64px; }
  .partners-row .partner--trace   { height: 72px; }
</style>

<script>
/* === SPLIT GATE: master visibility === */
(function cadeGate() {
  'use strict';
  function show() {
    document.body.classList.remove('cade-exiting');
    document.body.classList.add('cade-visible');
  }
  function hide() {
    document.body.classList.remove('cade-visible');
    document.body.classList.add('cade-exiting');
  }
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'show' || msg.type === 'update') show();
    else if (msg.type === 'hide') hide();
  }, false);
})();
</script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  var SEL = '.stage';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    var exit = b.classList.contains('cade-exiting');
    document.querySelectorAll(SEL).forEach(function(el){
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.removeProperty('transform');
        el.style.setProperty('visibility', 'visible', 'important');
      } else if (exit) {
        el.style.setProperty('opacity', '0', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
