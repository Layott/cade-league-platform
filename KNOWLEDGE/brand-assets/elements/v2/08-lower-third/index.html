<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
<title>CADE Lower Third — Name Intro</title>

<script id="cade-token-bootstrap">
(function() {
  // Wave 2 Stage 3 — cross-document design + text + partner propagation.
  //
  // Read base64-encoded JSON token maps from the iframe URL query
  // string and emit <style> blocks that win the CSS source-order
  // cascade (appended LATER in <head> than the author defaults).
  //
  // Token shapes:
  //   tokens / previewTokens     — { 'bg-color': '#000', ... }
  //   textTokens / previewTextTokens — { '<elementId>': { visible?,
  //     content?, styles?: { color, fontFamily, fontSize, ... } } }
  //   partnerTokens / previewPartnerTokens — {
  //     layout?: { anchor, positionXPx, positionYPx, scalePct,
  //                itemSpacingPx, orientation, justification,
  //                zIndex, visible },
  //     logos?: [ { partnerKey, label, alt, fileUrl, visible?, sort? } ]
  //   }
  //
  // Spec: docs/superpowers/specs/2026-04-29-overlay-design-page-v2.md §6.2
  function decodeTokens(param) {
    if (!param) return null;
    try {
      var json = decodeURIComponent(escape(atob(param)));
      var obj = JSON.parse(json);
      if (typeof obj !== 'object' || !obj) return null;
      return obj;
    } catch (e) { return null; }
  }
  function buildCssVars(tokens) {
    if (!tokens) return '';
    var parts = [];
    var imageKeys = { 'bg-image': 1 };
    for (var k in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, k)) continue;
      var v = tokens[k];
      if (typeof v !== 'string') continue;
      var safe = v.replace(/[;{}<>"']/g, '');
      if (imageKeys[k]) {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': url("' + safe + '")');
      } else {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': ' + safe);
      }
    }
    return parts.length ? ':root{' + parts.join(';') + ';}' : '';
  }
  function sanitizeCss(v) {
    return String(v == null ? '' : v).replace(/[;{}<>"\\`]/g, '');
  }
  function buildTextRules(tokens) {
    if (!tokens || typeof tokens !== 'object') return '';
    var rules = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      var s = t.styles || {};
      var declarations = [];
      if (s.color)         declarations.push('color:' + sanitizeCss(s.color));
      if (s.fontFamily)    declarations.push("font-family:'" + sanitizeCss(s.fontFamily) + "'");
      if (s.fontWeight)    declarations.push('font-weight:' + (+s.fontWeight || 400));
      if (s.fontSize)      declarations.push('font-size:' + sanitizeCss(s.fontSize));
      if (s.letterSpacing) declarations.push('letter-spacing:' + sanitizeCss(s.letterSpacing));
      if (s.lineHeight != null) declarations.push('line-height:' + (+s.lineHeight || 1));
      if (s.textAlign)     declarations.push('text-align:' + sanitizeCss(s.textAlign));
      if (s.opacity != null) declarations.push('opacity:' + (+s.opacity || 0));
      // Y-position bug fix (2026-04-28): switch from `left/top + position:absolute`
      // to the CSS individual `translate:` property. `absolute` resolved against
      // the nearest positioned ancestor (often a transformed centering wrapper),
      // so `top:Npx` did not move the element on the 1920x1080 canvas. `translate`
      // is a pure visual displacement and composes with existing `transform: ...`
      // animation keyframes via the Transforms 2 spec.
      if (s.left || s.top) {
        var tx = s.left ? sanitizeCss(s.left) : '0px';
        var ty = s.top ? sanitizeCss(s.top) : '0px';
        declarations.push('translate:' + tx + ' ' + ty + ' !important');
      }
      if (s.zIndex != null) declarations.push('z-index:' + (+s.zIndex || 0));
      if (t.visible === false) declarations.push('display:none');
      if (declarations.length) {
        rules.push('[data-element-id="' + elId + '"]{' + declarations.join(';') + ';}');
      }
    }
    return rules.join('\n');
  }
  function applyTextContent(tokens) {
    if (!tokens || typeof tokens !== 'object') return;
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      if (typeof t.content !== 'string') continue;
      if (t.content === '' || t.content == null) continue;
      var node = document.querySelector('[data-element-id="' + elId + '"]');
      if (!node) continue;
      try { node.textContent = t.content; } catch (e) { /* read-only */ }
    }
  }
  function buildPartnerLayoutRule(layout) {
    if (!layout || typeof layout !== 'object') return '';
    if (layout.visible === false) {
      return '[data-element-id="partners-strip"]{display:none !important;}';
    }
    var declarations = [];
    declarations.push('display:flex !important');
    declarations.push('flex-direction:' + (layout.orientation === 'vertical' ? 'column' : 'row') + ' !important');
    declarations.push('justify-content:' + sanitizeCss(layout.justification || 'center') + ' !important');
    declarations.push('align-items:center !important');
    declarations.push('gap:' + ((+layout.itemSpacingPx) || 0) + 'px !important');
    declarations.push('z-index:' + ((+layout.zIndex) || 12) + ' !important');
    declarations.push('position:absolute !important');
    var anchor = layout.anchor || 'bottom-center';
    var px = (+layout.positionXPx) || 0;
    var py = (+layout.positionYPx) || 0;
    var sx = ((+layout.scalePct) || 100) / 100;
    var transformOps = [];
    if (anchor.indexOf('top') === 0) {
      declarations.push('top:' + py + 'px !important');
      declarations.push('bottom:auto !important');
    } else if (anchor.indexOf('bottom') === 0) {
      declarations.push('bottom:' + py + 'px !important');
      declarations.push('top:auto !important');
    } else {
      declarations.push('top:' + py + 'px !important');
      declarations.push('bottom:auto !important');
      transformOps.push('translateY(-50%)');
    }
    if (anchor.indexOf('left') !== -1) {
      declarations.push('left:' + px + 'px !important');
      declarations.push('right:auto !important');
    } else if (anchor.indexOf('right') !== -1) {
      declarations.push('right:' + px + 'px !important');
      declarations.push('left:auto');
    } else {
      declarations.push('left:50% !important');
      declarations.push('right:auto !important');
      transformOps.push('translateX(-50%)');
    }
    if (sx !== 1) declarations.push('scale:' + sx + ' !important');
    if (transformOps.length) {
      declarations.push('transform:' + transformOps.join(' ') + ' !important');
      declarations.push('transform-origin:center center');
    }
    return '[data-element-id="partners-strip"]{' + declarations.join(';') + ';}';
  }
  function applyPartnerLogos(logos, layout) {
    if (!Array.isArray(logos)) return false;
    var strip = document.querySelector('[data-element-id="partners-strip"]');
    if (!strip) return false;
    // Filter visible + sort.
    var sorted = logos
      .filter(function(l) { return l && l.visible !== false && typeof l.fileUrl === 'string'; })
      .slice()
      .sort(function(a, b) {
        var sa = typeof a.sort === 'number' ? a.sort : 999;
        var sb = typeof b.sort === 'number' ? b.sort : 999;
        return sa - sb;
      });
    if (sorted.length === 0 && (!layout || layout.visible !== false)) {
      // No logos but layout present — leave existing children alone.
      return false;
    }
    // Wipe existing children.
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    // Mark as flex container so the layout CSS takes effect even without
    // browser quirks.
    sorted.forEach(function(l) {
      var img = document.createElement('img');
      var safeKey = sanitizeCss(l.partnerKey || 'x');
      img.className = 'partner partner--' + safeKey;
      img.src = sanitizeCss(l.fileUrl);
      img.alt = sanitizeCss(l.alt || l.label || '');
      img.setAttribute('data-partner-key', safeKey);
      strip.appendChild(img);
    });
    return true;
  }
  // ────────── Stage 4 — element animations ──────────
  //
  // Build @keyframes BODY for a given preset anim type. Mirrors
  // server/overlays/animations/elements.ts::buildKeyframesBody — same
  // values across server-side resolver + client-side bootstrap so
  // SSR-emitted styles + URL-borne overrides yield identical motion.
  function buildPresetKeyframes(animType, name, customBody) {
    switch (animType) {
      case 'slide-left':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-right':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-up':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}';
      case 'slide-down':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(-32px)}to{opacity:1;transform:translateY(0)}}';
      case 'fade':
        return '@keyframes ' + name + '{from{opacity:0}to{opacity:1}}';
      case 'scale':
        return '@keyframes ' + name + '{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}';
      case 'rotate':
        return '@keyframes ' + name + '{from{opacity:0;transform:rotate(-12deg)}to{opacity:1;transform:rotate(0)}}';
      case 'bounce':
        return '@keyframes ' + name + '{0%{opacity:0;transform:translateY(20px)}60%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}';
      case 'pulse':
        return '@keyframes ' + name + '{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}';
      case 'glow':
        return '@keyframes ' + name + '{0%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}50%{filter:drop-shadow(0 0 24px rgba(107,205,6,0.55))}100%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}}';
      case 'shake':
        return '@keyframes ' + name + '{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
      case 'flip':
        return '@keyframes ' + name + '{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:perspective(800px) rotateY(0)}}';
      case 'custom-css':
        // Defence-in-depth: strip url(), at-rules, and angle/backtick
        // characters even if server sanitizer was bypassed (URL-borne).
        if (typeof customBody !== 'string') return '';
        if (/\burl\s*\(/i.test(customBody)) return '';
        if (/@(import|font-face|charset|media|supports|keyframes)\b/i.test(customBody)) return '';
        if (/[<>\`]/.test(customBody)) return '';
        return '@keyframes ' + name + '{' + customBody + '}';
      case 'none':
      default:
        return '';
    }
  }
  function buildAnimRulesAndKeyframes(tokens) {
    if (!tokens || typeof tokens !== 'object') return { keyframes: '', rules: '' };
    var keyframesParts = [];
    var rulesParts = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var phases = tokens[elId];
      if (!phases || typeof phases !== 'object') continue;
      for (var phase in phases) {
        if (!Object.prototype.hasOwnProperty.call(phases, phase)) continue;
        if (phase !== 'entry' && phase !== 'exit' && phase !== 'continuous') continue;
        var p = phases[phase];
        if (!p || typeof p !== 'object') continue;
        if (p.enabled === false) continue;
        if (!p.animType || p.animType === 'none') continue;
        var animName = 'cade-' + elId + '-' + phase;
        var kf = buildPresetKeyframes(
          p.animType,
          animName,
          p.customCssKeyframes || ''
        );
        if (!kf) continue;
        keyframesParts.push(kf);
        var duration = (+p.durationMs) || 360;
        var delay = (+p.delayMs) || 0;
        var easing = sanitizeCss(p.easing || 'ease-out');
        var iterations = sanitizeCss(p.iterationCount || '1');
        // Phase-gated selector. Continuous animations only run while
        // the overlay is visible (cade-visible class on body).
        var sel =
          phase === 'exit'
            ? 'body.cade-exiting [data-element-id="' + elId + '"]'
            : 'body.cade-visible [data-element-id="' + elId + '"]';
        var rule =
          'animation:' + animName +
          ' ' + duration + 'ms' +
          ' ' + easing +
          ' ' + delay + 'ms' +
          ' ' + iterations +
          ' both;';
        rulesParts.push(sel + '{' + rule + '}');
      }
    }
    return {
      keyframes: keyframesParts.join('\n'),
      rules: rulesParts.join('\n'),
    };
  }
  try {
    var qs = new URLSearchParams(location.search);
    var design = decodeTokens(qs.get('tokens'));
    var preview = decodeTokens(qs.get('previewTokens'));
    var textTokens = decodeTokens(qs.get('textTokens'));
    var previewTextTokens = decodeTokens(qs.get('previewTextTokens'));
    var partnerTokens = decodeTokens(qs.get('partnerTokens'));
    var previewPartnerTokens = decodeTokens(qs.get('previewPartnerTokens'));
    var animTokens = decodeTokens(qs.get('animTokens'));
    var previewAnimTokens = decodeTokens(qs.get('previewAnimTokens'));
    // Source order: design first, preview second so preview wins.
    var cssVarRule = buildCssVars(design) + buildCssVars(preview);
    var textRule = buildTextRules(textTokens) + (buildTextRules(textTokens).length && buildTextRules(previewTextTokens).length ? '\n' : '') + buildTextRules(previewTextTokens);
    // Partner layout: preview wins by being applied second (later
    // <style> block wins on identical selector via source-order).
    var partnerRules = [];
    if (partnerTokens && partnerTokens.layout) {
      var r1 = buildPartnerLayoutRule(partnerTokens.layout);
      if (r1) partnerRules.push(r1);
    }
    if (previewPartnerTokens && previewPartnerTokens.layout) {
      var r2 = buildPartnerLayoutRule(previewPartnerTokens.layout);
      if (r2) partnerRules.push(r2);
    }
    // Stage 4 — element animations. Build keyframes + rules from both
    // design + preview maps. Source-order wins on identical names: the
    // preview block emits second, so its keyframes & rules overwrite
    // design's via CSS cascade (same selector + same animation-name).
    var animDesign = buildAnimRulesAndKeyframes(animTokens);
    var animPreview = buildAnimRulesAndKeyframes(previewAnimTokens);
    var animKeyframesCss = animDesign.keyframes +
      (animDesign.keyframes && animPreview.keyframes ? '\n' : '') +
      animPreview.keyframes;
    var animRulesCss = animDesign.rules +
      (animDesign.rules && animPreview.rules ? '\n' : '') +
      animPreview.rules;
    var emit = function() {
      if (!document.head) return;
      if (cssVarRule) {
        var s1 = document.createElement('style');
        s1.id = 'cade-injected-tokens';
        s1.textContent = cssVarRule;
        document.head.appendChild(s1);
      }
      if (textRule) {
        var s2 = document.createElement('style');
        s2.id = 'cade-injected-text';
        s2.textContent = textRule;
        document.head.appendChild(s2);
      }
      if (partnerRules.length) {
        var s3 = document.createElement('style');
        s3.id = 'cade-injected-partners-layout';
        s3.textContent = partnerRules.join('\n');
        document.head.appendChild(s3);
      }
      // Stage 4 — animation keyframes block FIRST (must precede rules
      // so the named animations resolve).
      if (animKeyframesCss) {
        var s4 = document.createElement('style');
        s4.id = 'cade-injected-anim-keyframes';
        s4.textContent = animKeyframesCss;
        document.head.appendChild(s4);
      }
      if (animRulesCss) {
        var s5 = document.createElement('style');
        s5.id = 'cade-injected-anim-rules';
        s5.textContent = animRulesCss;
        document.head.appendChild(s5);
      }
      // Apply textContent edits AFTER DOM is parsed.
      applyTextContent(textTokens);
      applyTextContent(previewTextTokens);
      // Rebuild partner strip children — preview wins by being applied
      // second (overwrites design's children).
      if (partnerTokens && Array.isArray(partnerTokens.logos)) {
        applyPartnerLogos(partnerTokens.logos, partnerTokens.layout);
      }
      if (previewPartnerTokens && Array.isArray(previewPartnerTokens.logos)) {
        applyPartnerLogos(previewPartnerTokens.logos, previewPartnerTokens.layout);
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', emit);
    } else {
      emit();
    }
  } catch (e) {
    // Bootstrap MUST never throw — fall back to HTML defaults.
  }
})();
</script>

<!-- DATA WIRES: name (string), role (string), slot (1|2|3) -->
<style>
  /* ============================================================
     CADE Esports League — Overlay #08 : Lower Third (Name Intro)
     Canvas : 1920x1080, transparent
     Slots  : 3 simultaneous instances at distinct anchors
              slot 1 -> bottom-left  (left: 80px, bottom: 80px)
              slot 2 -> bottom-center (centered horizontally, bottom: 80px)
              slot 3 -> bottom-right (right: 80px, bottom: 80px)
     Size   : auto-fit content width, ~150px tall
     Entry  : pre-tip accent stroke -> bar slide from left
              -> name letters scale-in -> role slide up   (~0.9s)
     Exit   : name + role fade (0.25s) -> bar slide out left
     Control: postMessage driven (no auto-loop), routed by slot
              window.postMessage({ type:'update', slot:1, data:{ displayName, gamerTag } }, '*')
              window.postMessage({ type:'show',   slot:1 }, '*')
              window.postMessage({ type:'hide',   slot:1 }, '*')
              (slot omitted -> defaults to slot 1 for legacy callers)
     ============================================================ */

  /* ============================================================
     DESIGN TOKENS (consumed via CSS variables) — Phase 2 of overlay
     design system. SSR may inject `:root { --overlay-* }` overrides
     above this declaration; fallbacks here keep first-deploy a no-op.
     See docs/superpowers/specs/2026-04-29-overlay-design-system.md §3.2.
  ============================================================ */
  :root {
    --overlay-bg-color: #050505;
    --overlay-accent-color: #6bcd06;
    --overlay-secondary-color: #fe036d;
    --overlay-text-color: #ffffff;
    --overlay-font-display: 'Agharti';
    --overlay-font-body: 'Quedora';
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    color-scheme: dark;
    font-family: var(--overlay-font-body, 'Quedora'), "Inter", sans-serif;
  }
  /* === SPLIT GATE (Category A small anchored bar):
     Body always opacity 1 (transparent canvas, only .lt visible).
     Each .lt is opacity 0 by default, shown via .entering on its own slot. === */
  body { opacity: 1 !important; background: transparent !important; }
  .stage { background: transparent !important; }

  /* ---- REAL BRAND FONTS (woff2 from PILOT BRB paths) ---- */
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';

    font-weight: 700;
    font-style: normal;
    font-stretch: 75%;
    font-display: block;
  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Black.woff2') format('woff2');
    font-weight: 900;

  }
  @font-face {

    font-weight: 900;

  }
  @font-face {
    font-family: 'Agharti';
    src: url('../../../fonts/agharti-family-2026-03-23-03-20-06-utc%20MAINPRIMARY%20FONT/Family%20Deliverables/Agharti-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-stretch: 100%;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Quedora';
    src: url('../../../fonts/quedora-boxy-modern-minimalist-futuristic-font-2026-03-23-03-41-30-utc%20SECONDARY%20FONT/Quedora%20Main%20Files/woff%202/Quedora-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: block;
  }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }

  /* ===== Lower third anchored group =====
     Auto-fits content width (no fixed 860px). */
  .lt {
    position: absolute;
    bottom: 80px;
    width: fit-content;
    min-height: 130px;
    display: inline-block;
    /* Initial state: hidden until first show/update message */
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
    /* Smooth fade between entering / exiting / cleared baseline so
       removing the .exiting class after the bar animation completes
       does not cause a 1-frame jump-cut. */
    transition: opacity 280ms ease-out;
  }

  /* Slot positioning */
  .lt[data-slot="1"] { left: 80px; }
  .lt[data-slot="2"] { left: 50%; transform: translateX(-50%); }
  .lt[data-slot="3"] { right: 80px; }

  /* When entering: visible + animations play forward */
  .lt.entering { opacity: 1; }

  /* When exiting: animations play in reverse */
  .lt.exiting  { opacity: 1; }

  /* === Per-slot iframe filter (mini-preview isolation) ===
     When the control room mounts a mini-preview iframe per slot it
     appends `?slot=N` to the URL so each card only renders ITS slot.
     A small init script below adds `body.cade-only-slot-N` based on
     this query string; the rules below hide the other 2 slots so
     events fired on other slots cannot leak into this card's preview.
     The OBS / live overlay never sets this class (no slot query) so
     all 3 slots remain free to render simultaneously on stream. */
  body.cade-only-slot-1 .lt[data-slot="2"],
  body.cade-only-slot-1 .lt[data-slot="3"],
  body.cade-only-slot-2 .lt[data-slot="1"],
  body.cade-only-slot-2 .lt[data-slot="3"],
  body.cade-only-slot-3 .lt[data-slot="1"],
  body.cade-only-slot-3 .lt[data-slot="2"] {
    display: none !important;
  }

  /* ===== Pre-tip accent (thin green stroke ahead of bar) ===== */
  .pretip {
    position: absolute;
    left: -14px;
    top: 14px;
    bottom: 14px;
    width: 6px;
    background: var(--overlay-accent-color, #6bcd06);
    box-shadow:
      0 0 16px rgba(107, 205, 6, 0.65),
      0 0 32px rgba(107, 205, 6, 0.35);
    transform-origin: top center;
    transform: scaleY(0);
    border-radius: 1px;
    opacity: 0;
  }

  .pretip::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 50%;
    height: 2px;
    width: 0;
    background: linear-gradient(90deg, var(--overlay-accent-color, #6bcd06) 0%, rgba(107, 205, 6, 0) 100%);
    transform: translateY(-50%);
    opacity: 0;
  }

  .lt.entering .pretip {
    animation: pretipDraw 0.6s ease-out both;
  }
  .lt.entering .pretip::after {
    animation: pretipTrail 0.7s ease-out both;
  }
  .lt.exiting .pretip { opacity: 0; transition: opacity 0.25s ease-out; }
  .lt.exiting .pretip::after { opacity: 0; width: 0; transition: opacity 0.25s ease-out, width 0.25s ease-out; }

  @keyframes pretipDraw {
    0%   { transform: scaleY(0); opacity: 0; }
    20%  { opacity: 1; }
    40%  { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  @keyframes pretipTrail {
    0%   { width: 0; opacity: 0; }
    20%  { opacity: 1; }
    100% { width: 140px; opacity: 1; }
  }

  /* ===== The main bar (black w/ subtle gradient) ===== */
  .bar {
    position: relative;
    display: inline-block;
    background:
      linear-gradient(135deg,
        rgba(15, 15, 15, 0.96) 0%,
        rgba(0, 0, 0, 0.96) 55%,
        rgba(10, 10, 10, 0.98) 100%);
    border-left: 8px solid var(--overlay-accent-color, #6bcd06);
    border-radius: 4px 10px 10px 4px;
    box-shadow:
      0 14px 40px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset,
      0 0 28px rgba(107, 205, 6, 0.12);
    transform: translateX(calc(-100% - 120px));
    overflow: hidden;
    will-change: transform;
  }

  .lt.entering .bar {
    animation: barSlideIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 0.18s;
  }
  .lt.exiting .bar {
    /* `both` so the 0% keyframe (translateX(0)) holds during the 0.25s
       delay — without this, the bar JUMPS off-canvas at .exiting add,
       JUMPS BACK to translateX(0) when the delay ends, then animates
       smoothly out. With `both`, bar holds visible for 0.25s then
       slides smoothly off in one continuous motion. */
    animation: barSlideOut 0.7s cubic-bezier(0.7, 0, 0.84, 0) both;
    animation-delay: 0.25s;
  }

  /* Pink edge accent + thin sweep shine */
  .bar::before {
    content: "";
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg,
      rgba(254, 3, 109, 0) 0%,
      var(--overlay-secondary-color, #fe036d) 25%,
      var(--overlay-secondary-color, #fe036d) 75%,
      rgba(254, 3, 109, 0) 100%);
    opacity: 0.85;
  }

  .bar::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -40%;
    width: 40%;
    background: linear-gradient(110deg,
      transparent 0%,
      rgba(255, 255, 255, 0.06) 45%,
      rgba(107, 205, 6, 0.18) 50%,
      rgba(255, 255, 255, 0.06) 55%,
      transparent 100%);
    transform: skewX(-18deg);
    opacity: 0;
  }

  .lt.entering .bar::after {
    animation: barShine 1.1s ease-in-out both;
    animation-delay: 0.5s;
  }

  @keyframes barSlideIn {
    0%   { transform: translateX(calc(-100% - 120px)); }
    100% { transform: translateX(0); }
  }

  @keyframes barSlideOut {
    0%   { transform: translateX(0); }
    100% { transform: translateX(calc(-100% - 120px)); }
  }

  @keyframes barShine {
    0%   { left: -40%; opacity: 0; }
    20%  { opacity: 1; }
    100% { left: 110%; opacity: 0; }
  }

  /* ===== Content container (inside the bar) =====
     Auto-fits content width via inline-flex; left padding accounts
     for the optional Pro League logo block when present. */
  .content {
    position: relative;
    padding: 18px 28px 18px 22px;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    min-height: 130px;
  }

  /* ===== Pro League logo slot (left side, before green accent) ===== */
  .logo-slot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    opacity: 0;
    transform: translateX(-8px) scale(0.85);
  }

  .lt.entering .logo-slot {
    animation: logoIn 0.5s cubic-bezier(0.18, 1.25, 0.4, 1) both;
    animation-delay: 0.35s;
  }
  .lt.exiting .logo-slot {
    animation: logoOut 0.25s ease-out both;
  }

  .logo-slot img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(107, 205, 6, 0.35));
  }

  /* Fallback chevron (shown when image fails or is missing) */
  .logo-slot .chevron {
    display: none;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 10px 0 10px 14px;
    border-color: transparent transparent transparent var(--overlay-accent-color, #6bcd06);
    filter: drop-shadow(0 0 8px rgba(107, 205, 6, 0.6));
  }
  .logo-slot.fallback img { display: none; }
  .logo-slot.fallback .chevron { display: block; }

  @keyframes logoIn {
    0%   { opacity: 0; transform: translateX(-8px) scale(0.85); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes logoOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== Text block (name + role stacked) ===== */
  .text-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }

  /* ===== NAME : Agharti, per-letter scale-in ===== */
  .name {
    font-family: var(--overlay-font-display, 'Agharti'), "Oswald", "Impact", sans-serif;
    font-size: 68px;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: var(--overlay-text-color, #ffffff);
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    gap: 2px;
    text-shadow:
      0 2px 10px rgba(107, 205, 6, 0.25),
      0 0 1px rgba(255, 255, 255, 0.8);
  }

  .name .letter {
    display: inline-block;
    opacity: 0;
    transform: scale(0.4) translateY(8px);
    will-change: transform, opacity;
  }
  /* preserve word breaks (real spaces collapse in flex; use width) */
  .name .letter.space { width: 0.4em; }

  .lt.entering .name .letter {
    animation: letterIn 0.5s cubic-bezier(0.18, 1.25, 0.4, 1) both;
  }
  .lt.exiting .name .letter {
    animation: letterOut 0.25s ease-out both;
  }

  @keyframes letterIn {
    0%   { opacity: 0; transform: scale(0.4) translateY(8px); }
    60%  { opacity: 1; transform: scale(1.08) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes letterOut {
    0%   { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(1) translateY(-4px); }
  }

  /* ===== ROLE : Quedora, slide up after name lands ===== */
  .role-wrap {
    overflow: hidden;
    height: 36px;
  }

  .role {
    font-family: var(--overlay-font-body, 'Quedora'), "Inter", sans-serif;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #e8e8e8;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    transform: translateY(100%);
    opacity: 0;
    will-change: transform, opacity;
  }

  .role::before {
    content: "";
    display: inline-block;
    width: 24px;
    height: 2px;
    background: var(--overlay-secondary-color, #fe036d);
    box-shadow: 0 0 10px rgba(254, 3, 109, 0.8);
    transform: translateY(-2px);
  }

  .lt.entering .role {
    animation: roleSlideIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: 0.55s;
  }
  .lt.exiting .role {
    animation: roleSlideOut 0.25s ease-out both;
  }

  @keyframes roleSlideIn {
    0%   { transform: translateY(100%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes roleSlideOut {
    0%   { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }

  /* small floating tag block anchored top-right of bar */
  .pip {
    position: absolute;
    top: 12px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--overlay-font-body, 'Quedora'), "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    opacity: 0;
  }
  .pip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--overlay-accent-color, #6bcd06);
    box-shadow: 0 0 10px rgba(107, 205, 6, 0.9);
    animation: pipPulse 1.4s ease-in-out infinite;
  }
  .lt.entering .pip {
    animation: pipIn 0.5s ease-out both;
    animation-delay: 0.7s;
  }
  .lt.exiting .pip {
    animation: pipOut 0.25s ease-out both;
  }
  @keyframes pipIn  { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes pipOut { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pipPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.4; }
  }

  /* Universal partner-img sizing — applies regardless of nested marquee wrapper. */
  [data-element-id="partners-strip"] img.partner { height: 50px !important; width: auto !important; object-fit: contain !important; }
</style>
</head>
<body>
  <div class="stage">

    <!-- ============ SLOT 1 (bottom-left) ============ -->
    <div class="lt" data-overlay="08-lower-third" data-slot="1">
      <span class="pretip" aria-hidden="true"></span>
      <div class="bar">
        <div class="content">
          <div class="logo-slot">
            <img class="logo-img" src="../../../logos/pro%20league%20.png" alt="Pro League" />
            <span class="chevron" aria-hidden="true"></span>
          </div>
          <div class="text-block">
            <div class="name" data-wire="name">
              <span class="letter">J</span><span class="letter">O</span><span class="letter">S</span><span class="letter">H</span>
            </div>
            <div class="role-wrap">
              <div class="role" data-wire="role">HEAD CASTER</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ SLOT 2 (bottom-center) ============ -->
    <div class="lt" data-overlay="08-lower-third" data-slot="2">
      <span class="pretip" aria-hidden="true"></span>
      <div class="bar">
        <div class="content">
          <div class="logo-slot">
            <img class="logo-img" src="../../../logos/pro%20league%20.png" alt="Pro League" />
            <span class="chevron" aria-hidden="true"></span>
          </div>
          <div class="text-block">
            <div class="name" data-wire="name">
              <span class="letter">J</span><span class="letter">O</span><span class="letter">S</span><span class="letter">H</span>
            </div>
            <div class="role-wrap">
              <div class="role" data-wire="role">HEAD CASTER</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ SLOT 3 (bottom-right) ============ -->
    <div class="lt" data-overlay="08-lower-third" data-slot="3">
      <span class="pretip" aria-hidden="true"></span>
      <div class="bar">
        <div class="content">
          <div class="logo-slot">
            <img class="logo-img" src="../../../logos/pro%20league%20.png" alt="Pro League" />
            <span class="chevron" aria-hidden="true"></span>
          </div>
          <div class="text-block">
            <div class="name" data-wire="name">
              <span class="letter">J</span><span class="letter">O</span><span class="letter">S</span><span class="letter">H</span>
            </div>
            <div class="role-wrap">
              <div class="role" data-wire="role">HEAD CASTER</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

<script>
(function () {
  'use strict';

  /* === SLOT-FILTER MODE (mini-preview isolation) ===
     If the URL has `?slot=N` (1..3) the control-room is mounting this
     iframe scoped to a single slot card. We:
       a) tag <body> with `cade-only-slot-N` so CSS hides the other 2 .lt
          elements (see CSS rule above);
       b) ignore postMessages whose `slot` field is set AND does not match
          our scope (slot routing leaks via shared realtime channel —
          without this filter, slot 1 trigger would render in slot-2 +
          slot-3 mini-previews too).
     OBS / live overlay never gets `?slot=` so all 3 slots stay live. */
  var SCOPE_SLOT = (function () {
    try {
      var n = Number(new URLSearchParams(location.search).get('slot'));
      return (n === 1 || n === 2 || n === 3) ? n : 0;
    } catch (e) { return 0; }
  })();
  if (SCOPE_SLOT) {
    document.body.classList.add('cade-only-slot-' + SCOPE_SLOT);
  }

  // ====== Per-slot state (1, 2, 3) ======
  var slots = {};
  var SLOT_IDS = [1, 2, 3];
  var EXIT_MS = 1100; // longest combined exit duration

  // ====== Initialize each slot ======
  SLOT_IDS.forEach(function (id) {
    var lt = document.querySelector('.lt[data-slot="' + id + '"]');
    if (!lt) return;
    var nameEl = lt.querySelector('.name');
    var roleEl = lt.querySelector('.role');
    var logoSlot = lt.querySelector('.logo-slot');
    var logoImg = lt.querySelector('.logo-img');

    var state = {
      lt: lt,
      nameEl: nameEl,
      roleEl: roleEl,
      logoSlot: logoSlot,
      logoImg: logoImg,
      current: {
        name: (nameEl && nameEl.textContent.trim()) || 'JOSH',
        role: (roleEl && roleEl.textContent.trim()) || 'HEAD CASTER'
      }
    };
    slots[id] = state;

    // Logo: graceful fallback to chevron on 404 (per slot)
    if (logoImg) {
      logoImg.addEventListener('error', function () {
        logoSlot.classList.add('fallback');
      });
      if (logoImg.complete && logoImg.naturalWidth === 0) {
        logoSlot.classList.add('fallback');
      }
    }

    // Pre-render letters from default copy so first 'show' has something to animate
    splitIntoLetters(nameEl, state.current.name);
    if (roleEl) roleEl.textContent = state.current.role.toUpperCase();
    // (no class on .lt -> opacity:0 baseline, off-canvas visually)
  });

  // ====== Helper: split a string into per-letter spans with staggered delays ======
  function splitIntoLetters(target, text) {
    if (!target) return;
    target.innerHTML = '';
    var clean = String(text == null ? '' : text).toUpperCase();
    var letters = Array.from(clean);
    var visibleIdx = 0;
    for (var i = 0; i < letters.length; i++) {
      var ch  = letters[i];
      var span = document.createElement('span');
      span.className = 'letter';
      if (ch === ' ') {
        span.classList.add('space');
        span.innerHTML = '&nbsp;';
      } else {
        span.textContent = ch;
      }
      // stagger 60ms per visible letter (matches original feel)
      span.style.animationDelay = (visibleIdx * 60) + 'ms';
      visibleIdx++;
      target.appendChild(span);
    }
  }

  // ====== Render data into a slot's DOM (no animation triggering) ======
  // Accepts {name, role} (legacy) OR {displayName, gamerTag, jerseyNumber, playerId}
  function renderInto(state, data) {
    if (!state || !data) return;
    var nm = (typeof data.name === 'string' && data.name) ||
             (typeof data.displayName === 'string' && data.displayName) || '';
    var rl = (typeof data.role === 'string' && data.role) ||
             (typeof data.gamerTag === 'string' && data.gamerTag) || '';
    if (nm) {
      state.current.name = nm;
      splitIntoLetters(state.nameEl, state.current.name);
    }
    if (rl) {
      state.current.role = rl;
      if (state.roleEl) state.roleEl.textContent = String(state.current.role).toUpperCase();
    }
  }

  // ====== Force reflow so animation restarts cleanly ======
  function reflow(el) {
    // eslint-disable-next-line no-unused-expressions
    el.offsetWidth;
  }

  // ====== Animation control (scoped to a slot's .lt element) ======
  function playEntry(state) {
    if (!state) return;
    var lt = state.lt;
    lt.classList.remove('exiting');
    lt.classList.remove('entering');
    reflow(lt);
    lt.classList.add('entering');
  }

  function playExit(state) {
    if (!state) return;
    var lt = state.lt;
    lt.classList.remove('entering');
    lt.classList.remove('exiting');
    reflow(lt);
    lt.classList.add('exiting');
    setTimeout(function () {
      // Only clear if still exiting (no new show during the exit window)
      if (lt.classList.contains('exiting')) {
        lt.classList.remove('exiting');
        // back to baseline opacity:0
      }
    }, EXIT_MS);
  }

  // ====== Resolve a slot from incoming message (default = 1) ======
  function resolveSlot(msg) {
    var raw = msg && msg.slot;
    var n = Number(raw);
    if (n === 1 || n === 2 || n === 3) return n;
    return 1;
  }

  // ====== postMessage listener ======
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type !== 'show' && msg.type !== 'update' && msg.type !== 'hide') return;

    var slotId = resolveSlot(msg);
    // SLOT-FILTER: when scoped to one slot via `?slot=N`, drop messages
    // for other slots so card 1's mini-preview ignores slot 2 + 3 events.
    // No slot in payload defaults to 1 (legacy) — accepted by all scopes.
    if (SCOPE_SLOT && msg.slot != null && Number(msg.slot) !== SCOPE_SLOT) return;
    var state = slots[slotId];
    if (!state) return;

    switch (msg.type) {
      case 'update':
        renderInto(state, msg.data || {});
        playEntry(state);
        break;
      case 'show':
        if (msg.data) renderInto(state, msg.data);
        playEntry(state);
        break;
      case 'hide':
        playExit(state);
        break;
    }
  });

  // Expose a debug hook (handy when opened directly in a browser)
  window.__lowerThird = {
    update: function (data, slot) {
      var s = slots[resolveSlot({ slot: slot })];
      if (!s) return;
      renderInto(s, data || {});
      playEntry(s);
    },
    show: function (slot) {
      var s = slots[resolveSlot({ slot: slot })];
      if (s) playEntry(s);
    },
    hide: function (slot) {
      var s = slots[resolveSlot({ slot: slot })];
      if (s) playExit(s);
    },
    state: function (slot) {
      var s = slots[resolveSlot({ slot: slot })];
      return s ? Object.assign({}, s.current) : null;
    }
  };
})();
</script>

<script>
/* === STRICT GATE: master visibility, controlled ONLY by parent postMessage. ===
   Operator drives via Update & Show / Hide. No auto-demo, no fallback timers.
   Per-slot opacity is handled by the slot-routed handler above; this gate just
   tracks aggregate slot visibility on the body so the canvas reflects whether
   ANY slot is showing. Critical for slot isolation: hiding slot 1 must NOT
   pull slots 2+3 off-canvas, and vice-versa. */
(function cadeGate() {
  'use strict';
  var SLOT_IDS = [1, 2, 3];
  var slotVisible = { 1: false, 2: false, 3: false };
  // Match the per-iframe scope from the main script — when `?slot=N` is
  // present, ignore postMessages targeting other slots so the gate state
  // only reflects this slot's visibility.
  var SCOPE_SLOT = (function () {
    try {
      var n = Number(new URLSearchParams(location.search).get('slot'));
      return (n === 1 || n === 2 || n === 3) ? n : 0;
    } catch (e) { return 0; }
  })();
  function resolveSlot(msg) {
    var n = Number(msg && msg.slot);
    if (n === 1 || n === 2 || n === 3) return n;
    return 1;
  }
  function syncBody() {
    var any = slotVisible[1] || slotVisible[2] || slotVisible[3];
    if (any) {
      document.body.classList.remove('cade-exiting');
      document.body.classList.add('cade-visible');
    } else {
      document.body.classList.remove('cade-visible');
      document.body.classList.add('cade-exiting');
    }
  }
  window.addEventListener('message', function (ev) {
    var msg = ev && ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type !== 'show' && msg.type !== 'update' && msg.type !== 'hide') return;
    if (SCOPE_SLOT && msg.slot != null && Number(msg.slot) !== SCOPE_SLOT) return;
    var slotId = resolveSlot(msg);
    if (msg.type === 'show' || msg.type === 'update') {
      slotVisible[slotId] = true;
    } else {
      slotVisible[slotId] = false;
    }
    syncBody();
  }, false);
})();
</script>
<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function(){ fire('show'); }, 200);
  // Loop: show 5s, hide 3s, repeat.
  setInterval(function(){ fire('hide'); }, 8000);
  setTimeout(function(){
    setInterval(function(){ fire('show'); }, 8000);
  }, 8000 - 5000); // offset so show fires 5s after each hide
})();
</script>
