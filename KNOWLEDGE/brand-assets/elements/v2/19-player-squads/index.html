<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #19-PLAYER-SQUADS — "DRAFT / TEAM SHEET"
  Full-screen 1920×1080 transparent FUT-style draft view for one player.
  Top-left: draft owner name + "DRAFT" big condensed Agharti title with
  optional headshot. Below: CHEMISTRY 30/33 + FORMATION 4-3-3(2) labels.
  Center pitch: 11 starting cards arranged in 4-3-3 formation with green
  pitch outline. Right column: 7 sub cards in a SUBS panel. Top-right:
  CADE Esports + Pro League logos.

  Aesthetics: ELITE S2 GREEN BG (same source as 07-leaderboard), locked
  brand palette #6bcd06 / #fe036d / #050505 / #ffffff, Agharti display +
  Quedora secondary.

  DATA WIRES:
    draftOwner   = { displayName, headshotUrl }
    formation    = '4-3-3(2)'
    chemistry    = '30/33'
    starting[11] = { slot_index, name, rating, position, item_type, nationality_flag }
    subs[N]      = { slot_index, name, rating, position, item_type, nationality_flag }
                   N is variable (0..12). Players spend the leftover 10M-coin budget
                   on as many subs as fit. Schema CHECK on slot_index 0..22 caps subs
                   at 12. CSS grid is `repeat(3, 1fr)` so 1..12 subs flow naturally.

  Slot mapping (4-3-3):
    0  -> GK
    1  -> LB     2  -> CB-L    3  -> CB-R    4  -> RB
    5  -> CM-L   6  -> CM-C    7  -> CM-R
    8  -> LW     9  -> ST     10  -> RW
    11..22 -> SUBS (variable count)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — DRAFT / TEAM SHEET</title>

<script id="cade-token-bootstrap">
(function() {
  // Wave 2 Stage 3 — cross-document design + text + partner propagation.
  //
  // Read base64-encoded JSON token maps from the iframe URL query
  // string and emit <style> blocks that win the CSS source-order
  // cascade (appended LATER in <head> than the author defaults).
  //
  // Token shapes:
  //   tokens / previewTokens     — { 'bg-color': '#000', ... }
  //   textTokens / previewTextTokens — { '<elementId>': { visible?,
  //     content?, styles?: { color, fontFamily, fontSize, ... } } }
  //   partnerTokens / previewPartnerTokens — {
  //     layout?: { anchor, positionXPx, positionYPx, scalePct,
  //                itemSpacingPx, orientation, justification,
  //                zIndex, visible },
  //     logos?: [ { partnerKey, label, alt, fileUrl, visible?, sort? } ]
  //   }
  //
  // Spec: docs/superpowers/specs/2026-04-29-overlay-design-page-v2.md §6.2
  function decodeTokens(param) {
    if (!param) return null;
    try {
      var json = decodeURIComponent(escape(atob(param)));
      var obj = JSON.parse(json);
      if (typeof obj !== 'object' || !obj) return null;
      return obj;
    } catch (e) { return null; }

    if (!tokens) return '';

    var imageKeys = { 'bg-image': 1 };
    for (var k in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, k)) continue;
      var v = tokens[k];
      if (typeof v !== 'string') continue;
      var safe = v.replace(/[;{}<>"']/g, '');

        if (!safe) continue;

        // so var(--overlay-bg-image, url(default)) resolves to none and
        // does NOT fall through to the HTML hard-coded default).
        if (safe === 'none') {
          parts.push('--overlay-' + k + ': none');
        } else {
          parts.push('--overlay-' + k + ': url("' + safe + '")');
        }

        parts.push('--overlay-' + k + ': ' + safe);

  function sanitizeCss(v) {
    return String(v == null ? '' : v).replace(/[;{}<>"\\`]/g, '');
  }
  function buildTextRules(tokens) {
    if (!tokens || typeof tokens !== 'object') return '';
    var rules = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      var s = t.styles || {};
      var declarations = [];
      if (s.color)         declarations.push('color:' + sanitizeCss(s.color));
      if (s.fontFamily)    declarations.push("font-family:'" + sanitizeCss(s.fontFamily) + "'");
      if (s.fontWeight)    declarations.push('font-weight:' + (+s.fontWeight || 400));
      if (s.fontSize)      declarations.push('font-size:' + sanitizeCss(s.fontSize));
      if (s.letterSpacing) declarations.push('letter-spacing:' + sanitizeCss(s.letterSpacing));
      if (s.lineHeight != null) declarations.push('line-height:' + (+s.lineHeight || 1));
      if (s.textAlign)     declarations.push('text-align:' + sanitizeCss(s.textAlign));
      if (s.opacity != null) declarations.push('opacity:' + (+s.opacity || 0));
      if (s.left)          declarations.push('left:' + sanitizeCss(s.left));
      if (s.top)           declarations.push('top:' + sanitizeCss(s.top));
      if (s.zIndex != null) declarations.push('z-index:' + (+s.zIndex || 0));
      if (s.left || s.top) declarations.push('position:absolute');

  function applyTextContent(tokens) {
    if (!tokens || typeof tokens !== 'object') return;
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      if (typeof t.content !== 'string') continue;
      if (t.content === '' || t.content == null) continue;
      var node = document.querySelector('[data-element-id="' + elId + '"]');

      try { node.textContent = t.content; } catch (e) { /* read-only */ }

  function buildPartnerLayoutRule(layout) {
    if (!layout || typeof layout !== 'object') return '';
    if (layout.visible === false) {
      return '[data-element-id="partners-strip"]{display:none !important;}';
    }
    var declarations = [];
    declarations.push('display:flex');
    declarations.push('flex-direction:' + (layout.orientation === 'vertical' ? 'column' : 'row'));
    declarations.push('justify-content:' + sanitizeCss(layout.justification || 'center'));
    declarations.push('align-items:center');
    declarations.push('gap:' + ((+layout.itemSpacingPx) || 0) + 'px');
    declarations.push('z-index:' + ((+layout.zIndex) || 12));
    declarations.push('position:absolute');
    var anchor = layout.anchor || 'bottom-center';
    var px = (+layout.positionXPx) || 0;
    var py = (+layout.positionYPx) || 0;
    var sx = ((+layout.scalePct) || 100) / 100;
    var transformOps = [];
    var paddingTop = 0, paddingRight = 0, paddingBottom = 0, paddingLeft = 0;
    // Bug 12 (2026-05-01) - *-center anchor X/Y honour positionXPx /
    // positionYPx as a NUDGE from canvas center.
    //
    // CRITICAL - earlier impl baked the nudge into a static
    // transform: translateX(-50%) declaration. That broke for
    // overlays whose author CSS already runs an entry animation on
    // the same element (e.g. .partners has animation: top-fade ... on
    // h2h-2 / 11-match-scores-day, animating translateY). When a
    // CSS animation is running on transform, the keyframe transform
    // value supersedes any static transform: declaration on the same
    // element - so our translateX(-50%) got swallowed and the strip
    // rendered with left:50% + animation transform:translateY(0),
    // making its left edge sit at canvas centre and the content
    // auto-extend right (visually drifting to the right half of the
    // canvas). This was the root cause of the user "stays at the
    // bottom right rather than bottom middle" report.
    //
    // Fix: when X is centered, span full canvas width (left:0;
    // right:0; width:auto) and rely on display:flex +
    // justify-content:center (already in this emit) to center the
    // content. positionXPx then shifts the centered content via
    // padding (positionXPx > 0 -> padding-left = 2*positionXPx so
    // flex-center moves the content right by positionXPx; symmetric
    // for negative values). Same approach for Y center -> full
    // canvas-tall + align-items:center + padding-top adjustment.
    //
    // For *-left and *-right anchors, the existing direct-offset
    // logic still works untouched (no transform involved on those
    // axes - left:Npx / right:Npx are absolute and don't conflict
    // with the running translateY animation).
    if (anchor.indexOf('top') === 0) {
      declarations.push('top:' + py + 'px');
      declarations.push('bottom:auto');
    } else if (anchor.indexOf('bottom') === 0) {
      declarations.push('bottom:' + (1080 - py) + 'px');
      declarations.push('top:auto');
    } else {
      // middle-* — span full canvas height + align center + Y nudge.
      declarations.push('top:0');
      declarations.push('bottom:0');
      declarations.push('height:auto');
      if (py > 0) paddingTop = 2 * py;
      else if (py < 0) paddingBottom = 2 * -py;
    }
    if (anchor.indexOf('left') !== -1) {
      declarations.push('left:' + px + 'px');
      declarations.push('right:auto');
    } else if (anchor.indexOf('right') !== -1) {
      declarations.push('right:' + (1920 - px) + 'px');
      declarations.push('left:auto');
    } else {
      // *-center — span full canvas width + center via flex + X nudge.
      declarations.push('left:0');
      declarations.push('right:0');
      declarations.push('width:auto');
      if (px > 0) paddingLeft = 2 * px;
      else if (px < 0) paddingRight = 2 * -px;
    }
    if (paddingTop || paddingRight || paddingBottom || paddingLeft) {
      declarations.push(
        'padding:' + paddingTop + 'px ' + paddingRight + 'px ' + paddingBottom + 'px ' + paddingLeft + 'px',
      );
    }
    if (sx !== 1) transformOps.push('scale(' + sx + ')');
    if (transformOps.length) {
      declarations.push('transform:' + transformOps.join(' '));
      declarations.push('transform-origin:center center');
    }
    return '[data-element-id="partners-strip"]{' + declarations.join(';') + ';}';
  }
  function applyPartnerLogos(logos, layout) {
    if (!Array.isArray(logos)) return false;
    var strip = document.querySelector('[data-element-id="partners-strip"]');
    if (!strip) return false;
    // Filter visible + sort.
    var sorted = logos
      .filter(function(l) { return l && l.visible !== false && typeof l.fileUrl === 'string'; })
      .slice()
      .sort(function(a, b) {
        var sa = typeof a.sort === 'number' ? a.sort : 999;
        var sb = typeof b.sort === 'number' ? b.sort : 999;
        return sa - sb;
      });
    if (sorted.length === 0 && (!layout || layout.visible !== false)) {
      // No logos but layout present — leave existing children alone.
      return false;
    }
    // Wipe existing children.
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    // Mark as flex container so the layout CSS takes effect even without
    // browser quirks.
    sorted.forEach(function(l) {
      var img = document.createElement('img');
      var safeKey = sanitizeCss(l.partnerKey || 'x');
      img.className = 'partner partner--' + safeKey;
      img.src = sanitizeCss(l.fileUrl);
      img.alt = sanitizeCss(l.alt || l.label || '');
      img.setAttribute('data-partner-key', safeKey);
      strip.appendChild(img);
    });
    return true;
  }
  // ────────── Stage 4 — element animations ──────────
  //
  // Build @keyframes BODY for a given preset anim type. Mirrors
  // server/overlays/animations/elements.ts::buildKeyframesBody — same
  // values across server-side resolver + client-side bootstrap so
  // SSR-emitted styles + URL-borne overrides yield identical motion.
  function buildPresetKeyframes(animType, name, customBody) {
    switch (animType) {
      case 'slide-left':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-right':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-up':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}';
      case 'slide-down':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(-32px)}to{opacity:1;transform:translateY(0)}}';
      case 'fade':
        return '@keyframes ' + name + '{from{opacity:0}to{opacity:1}}';
      case 'scale':
        return '@keyframes ' + name + '{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}';
      case 'rotate':
        return '@keyframes ' + name + '{from{opacity:0;transform:rotate(-12deg)}to{opacity:1;transform:rotate(0)}}';
      case 'bounce':
        return '@keyframes ' + name + '{0%{opacity:0;transform:translateY(20px)}60%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}';
      case 'pulse':
        return '@keyframes ' + name + '{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}';
      case 'glow':
        return '@keyframes ' + name + '{0%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}50%{filter:drop-shadow(0 0 24px rgba(107,205,6,0.55))}100%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}}';
      case 'shake':
        return '@keyframes ' + name + '{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
      case 'flip':
        return '@keyframes ' + name + '{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:perspective(800px) rotateY(0)}}';
      case 'custom-css':
        // Defence-in-depth: strip url(), at-rules, and angle/backtick
        // characters even if server sanitizer was bypassed (URL-borne).
        if (typeof customBody !== 'string') return '';
        if (/\burl\s*\(/i.test(customBody)) return '';
        if (/@(import|font-face|charset|media|supports|keyframes)\b/i.test(customBody)) return '';
        if (/[<>\`]/.test(customBody)) return '';
        return '@keyframes ' + name + '{' + customBody + '}';
      case 'none':
      default:
        return '';
    }
  }
  function buildAnimRulesAndKeyframes(tokens) {
    if (!tokens || typeof tokens !== 'object') return { keyframes: '', rules: '' };
    var keyframesParts = [];
    var rulesParts = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var phases = tokens[elId];
      if (!phases || typeof phases !== 'object') continue;
      for (var phase in phases) {
        if (!Object.prototype.hasOwnProperty.call(phases, phase)) continue;
        if (phase !== 'entry' && phase !== 'exit' && phase !== 'continuous') continue;
        var p = phases[phase];
        if (!p || typeof p !== 'object') continue;
        if (p.enabled === false) continue;
        if (!p.animType || p.animType === 'none') continue;
        var animName = 'cade-' + elId + '-' + phase;
        var kf = buildPresetKeyframes(
          p.animType,
          animName,
          p.customCssKeyframes || ''
        );
        if (!kf) continue;
        keyframesParts.push(kf);
        var duration = (+p.durationMs) || 360;
        var delay = (+p.delayMs) || 0;
        var easing = sanitizeCss(p.easing || 'ease-out');
        var iterations = sanitizeCss(p.iterationCount || '1');
        // Phase-gated selector. Continuous animations only run while
        // the overlay is visible (cade-visible class on body).
        var sel =
          phase === 'exit'
            ? 'body.cade-exiting [data-element-id="' + elId + '"]'
            : 'body.cade-visible [data-element-id="' + elId + '"]';
        var rule =
          'animation:' + animName +
          ' ' + duration + 'ms' +
          ' ' + easing +
          ' ' + delay + 'ms' +
          ' ' + iterations +
          ' both;';
        rulesParts.push(sel + '{' + rule + '}');
      }
    }
    return {
      keyframes: keyframesParts.join('\n'),
      rules: rulesParts.join('\n'),
    };
  }
  try {
    var qs = new URLSearchParams(location.search);
    var design = decodeTokens(qs.get('tokens'));
    var preview = decodeTokens(qs.get('previewTokens'));
    var textTokens = decodeTokens(qs.get('textTokens'));
    var previewTextTokens = decodeTokens(qs.get('previewTextTokens'));
    var partnerTokens = decodeTokens(qs.get('partnerTokens'));
    var previewPartnerTokens = decodeTokens(qs.get('previewPartnerTokens'));
    var animTokens = decodeTokens(qs.get('animTokens'));
    var previewAnimTokens = decodeTokens(qs.get('previewAnimTokens'));
    // Source order: design first, preview second so preview wins.
    var cssVarRule = buildCssVars(design) + buildCssVars(preview);
    var textRule = buildTextRules(textTokens) + (buildTextRules(textTokens).length && buildTextRules(previewTextTokens).length ? '\n' : '') + buildTextRules(previewTextTokens);
    // Partner layout: preview wins by being applied second (later
    // <style> block wins on identical selector via source-order).
    var partnerRules = [];
    if (partnerTokens && partnerTokens.layout) {
      var r1 = buildPartnerLayoutRule(partnerTokens.layout);
      if (r1) partnerRules.push(r1);
    }
    if (previewPartnerTokens && previewPartnerTokens.layout) {
      var r2 = buildPartnerLayoutRule(previewPartnerTokens.layout);
      if (r2) partnerRules.push(r2);
    }
    // Stage 4 — element animations. Build keyframes + rules from both
    // design + preview maps. Source-order wins on identical names: the
    // preview block emits second, so its keyframes & rules overwrite
    // design's via CSS cascade (same selector + same animation-name).

    var animPreview = buildAnimRulesAndKeyframes(previewAnimTokens);
    var animKeyframesCss = animDesign.keyframes +
      (animDesign.keyframes && animPreview.keyframes ? '\n' : '') +
      animPreview.keyframes;
    var animRulesCss = animDesign.rules +
      (animDesign.rules && animPreview.rules ? '\n' : '') +
      animPreview.rules;
    var emit = function() {
      if (!document.head) return;
      if (cssVarRule) {
        var s1 = document.createElement('style');
        s1.id = 'cade-injected-tokens';
        s1.textContent = cssVarRule;
        document.head.appendChild(s1);
      }
      if (textRule) {
        var s2 = document.createElement('style');
        s2.id = 'cade-injected-text';
        s2.textContent = textRule;
        document.head.appendChild(s2);
      }
      if (partnerRules.length) {
        var s3 = document.createElement('style');
        s3.id = 'cade-injected-partners-layout';
        s3.textContent = partnerRules.join('\n');
        document.head.appendChild(s3);
      }
      // Stage 4 — animation keyframes block FIRST (must precede rules
      // so the named animations resolve).
      if (animKeyframesCss) {
        var s4 = document.createElement('style');
        s4.id = 'cade-injected-anim-keyframes';
        s4.textContent = animKeyframesCss;
        document.head.appendChild(s4);
      }
      if (animRulesCss) {
        var s5 = document.createElement('style');
        s5.id = 'cade-injected-anim-rules';
        s5.textContent = animRulesCss;
        document.head.appendChild(s5);
      }
      // Task B 2026-05-19 — bg-persistent CSS rule.
      // Injected once per overlay; appends to <head> AFTER author CSS
      // so the !important rule wins source-order vs the legacy
      // body:not(.cade-visible):not(.cade-exiting) .bg-X gate. Per-
      // overlay author CSS still adds .bg-X to their gate selector
      // lists, but this rule overrides them when the body has
      // cade-bg-persistent (set by applyBgPersistent below).
      if (!document.getElementById('cade-injected-bg-persistent')) {
        var s7 = document.createElement('style');
        s7.id = 'cade-injected-bg-persistent';
        s7.textContent =
          'body.cade-bg-persistent .bg-image,' +
          'body.cade-bg-persistent .bg-fill,' +
          'body.cade-bg-persistent .bg-vignette,' +
          'body.cade-bg-persistent .bg-grain ' +
          '{ opacity: 1 !important; }';
        document.head.appendChild(s7);
      }
      // Apply textContent edits AFTER DOM is parsed.
      applyTextContent(textTokens);
      applyTextContent(previewTextTokens);
      // Rebuild partner strip children — preview wins by being applied
      // second (overwrites design's children).
      if (partnerTokens && Array.isArray(partnerTokens.logos)) {
        applyPartnerLogos(partnerTokens.logos, partnerTokens.layout);
      }
      if (previewPartnerTokens && Array.isArray(previewPartnerTokens.logos)) {
        applyPartnerLogos(previewPartnerTokens.logos, previewPartnerTokens.layout);
      }
      // Phase D — partner-strip scroll. Token `partner-strip-scroll`
      // controls whether logos scroll continuously sideways. When "true",
      // wrap the strip's children in an INNER flex track + clone them
      // once for a seamless 50% translateX loop.
      //
      // Bug 13 (2026-05-01) — earlier impl wrapped children in
      // .cade-partner-track but kept the OUTER strip's layout CSS as
      // plain flex with justify-content:center, causing the
      // width:max-content track to overflow past the anchor reference
      // (anchor became visually meaningless on h2h-2, match-scores-day,
      // etc). Fix: when scroll is on, the strip becomes a fixed-width
      // OVERFLOW window anchored exactly where the design tokens placed
      // it, and the inner track is the moving element. The track's

      if (preview && preview['partner-strip-scroll'] === 'true') scrollOn = true;
      if (preview && preview['partner-strip-scroll'] === 'false') scrollOn = false;
      if (scrollOn) {
        var stripScroll = document.querySelector('[data-element-id="partners-strip"]');
        if (stripScroll && !stripScroll.querySelector('.cade-partner-track')) {
          var kids = Array.from(stripScroll.children);
          if (kids.length > 0) {
            var track = document.createElement('div');
            track.className = 'cade-partner-track';
            kids.forEach(function(c) { track.appendChild(c); });
            kids.forEach(function(c) { track.appendChild(c.cloneNode(true)); });
            stripScroll.appendChild(track);
            var s6 = document.createElement('style');
            s6.id = 'cade-injected-partner-scroll';
            // Bug 12 (2026-05-01) — when scroll is ON, the strip must
            // span the full canvas width so the marquee runway has a
            // bounded horizontal window. Earlier impl kept the design-
            // token anchor + transform on the strip (e.g. translateX
            // (-50%) on bottom-center), but with width:auto the strip
            // sized to the track's max-content and visually drifted
            // (right-bunched) because translateX shifted a content-
            // sized box off-axis. Fix: when scroll is on, force the
            // strip to left:0; right:0; width:auto so it spans the
            // canvas; reset the X-axis transform piece so any
            // translateX(-50%) anchor offset stops shifting the
            // window. The vertical anchor (top/bottom positioning
            // from layout tokens) is preserved by emitting these
            // overrides as side-effects on the strip's existing
            // transform — we replace the whole transform with the
            // vertical-only piece (translateY for middle-* anchor) +
            // any scale.
            //
            // Authoritative override for HORIZONTAL placement when
            // scroll is on:
            //  - left:0; right:0 -> strip spans canvas
            //  - transform:none -> drop translateX(-50%) which would
            //    shift the now full-width strip off-canvas to the left
            //    (vertical positioning is handled by top/bottom px in
            //    the design-tokens block which still applies)
            //  - overflow:hidden clips the track
            //  - justify-content:flex-start so the track aligns flush
            //    to the strip's left edge (the marquee animation
            //    handles the rest)
            //  - flex-wrap:nowrap so children stay single-row
            //
            // The track itself:
            //  - width:max-content so it holds all kids + clones
            //  - gap inherited so brand spacing stays consistent

  /* card body — portrait area gradient placeholder */
  .card-body {
    flex: 1;
    margin: 4px 2px 4px;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(0,0,0,0.10) 65%, rgba(0,0,0,0.30) 100%);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .card-body::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 30%;
    width: 32px;
    height: 32px;
    background: rgba(0,0,0,0.18);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .card-body::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 56%;
    height: 50%;
    background: rgba(0,0,0,0.18);
    border-top-left-radius: 50% 22px;
    border-top-right-radius: 50% 22px;
    transform: translateX(-50%);
  }
  /* FUTBIN card image — replaces the gradient placeholder when the
     server-feed endpoint enriches the squad item with a fc26_players
     match (post-2026-04-30 enrichment, ~100% hit rate against current
     submissions). The img is absolutely-positioned so it overlays the
     entire card frame, hiding the head/foot rating + position chrome
     while the FUTBIN PNG carries its own design. */
  .pitch-card.has-img,
  .sub-card.has-img {
    background: transparent !important;
    border-color: transparent !important;
    overflow: visible;
  }
  .pitch-card.has-img .card-head,
  .pitch-card.has-img .card-foot,
  .sub-card.has-img .card-head,
  .sub-card.has-img .card-foot {
    display: none;
  }
  .card-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center top;
    image-rendering: -webkit-optimize-contrast;
    /* Slight glow to match the green-line pitch aesthetic on the dark BG */
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.55));
  }

  /* ==================================================================
     `.has-fut-card` — composite FUT card. FUTBIN's `card_bg_url` is the
     GENERIC variant ART TEMPLATE (frame design, NO face/rating/stats).
     We layer:
       1. .fut-frame      — variant template stretched to fill card.
       2. .fut-face       — player face PNG positioned in face slot.
       3. .fut-overlay    — CSS text: rating / position / name / 6 stats.
     All 3 sourced from the /api/img/upscale proxy (Lanczos3 4× source).
     Overlay text scales via % of card width so font sizes stay tuned
     at any card size.
     ================================================================== */
  .pitch-card.has-fut-card,
  .sub-card.has-fut-card {
    background: transparent !important;
    border: none !important;
    overflow: visible;
    aspect-ratio: 64 / 89;
    box-shadow: none !important;
    padding: 0 !important;
    container-type: inline-size;
  }
  .pitch-card.has-fut-card .card-head,
  .pitch-card.has-fut-card .card-foot,
  .pitch-card.has-fut-card .card-body,
  .sub-card.has-fut-card .card-head,
  .sub-card.has-fut-card .card-foot,
  .sub-card.has-fut-card .card-body {
    display: none;
  }
  .fut-frame {
    position: absolute;
    inset: 0;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: auto;
    pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.55));
    z-index: 0;
  }
  .fut-face {
    position: absolute;
    /* Face slot — sized so the visible PLAYER FACE inside the PNG
       (FUTBIN's `card_image_url` has the actual face occupying only
       the upper ~55% of its 64×89 frame, with empty/transparent space
       below) reads clearly. Use `cover` with `object-position: center
       top` to crop the bottom whitespace; the resulting visible face
       fills ~55% of card width × ~50% of card height — close to the
       user's reference image proportions. */
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 78cqi;
    height: 52%;
    object-fit: cover;
    object-position: center top;
    image-rendering: auto;
    pointer-events: none;
    z-index: 1;
  }
  .fut-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    /* Always white text — strong drop-shadow keeps legibility on every
       variant frame (gold/silver/bronze/icon/hero/special). User
       feedback 2026-04-30: dark text on bronze/silver was unreadable. */
    color: #ffffff;
    text-shadow:
      0 1px 2px rgba(0,0,0,0.85),
      0 0 4px rgba(0,0,0,0.55);
    font-family: 'Agharti', 'Inter', sans-serif;
    line-height: 1;
  }
  /* Rating + position stack — top-left corner of the card. cqi for font
     size keeps text proportional to card width; % for top/left so the
     anchor is relative to card HEIGHT (not width). */
  .fut-rating {
    position: absolute;
    top: 3%;
    left: 7%;
    font-weight: 800;
    font-size: 30cqi;
    letter-spacing: 0.01em;
    text-shadow:
      0 2px 4px rgba(0,0,0,0.95),
      0 0 8px rgba(0,0,0,0.7);
    z-index: 3;
  }
  .fut-pos {
    position: absolute;
    top: 25%;
    left: 9%;
    font-family: 'Quedora', 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13cqi;
    letter-spacing: 0.04em;
    z-index: 3;
  }
  /* Name across the card BELOW the face slot */
  .fut-name {
    position: absolute;
    top: 56%;
    left: 6%;
    right: 6%;
    text-align: center;
    font-weight: 700;
    font-size: 10.5cqi;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-bottom: 2%;
    border-bottom: 1px solid rgba(255,255,255,0.45);
    opacity: 0.97;
    z-index: 3;
  }
  /* 6 main stats — 2-col × 3-row grid in bottom of card.
     Anchored to a fixed bottom position so all three rows stay INSIDE
     the card frame, never bleeding past the bottom edge into the
     partner-strip area. Tight font + tight gap → 3 rows fit in ~30% of
     card height. */
  .fut-stats {
    position: absolute;
    top: 70%;
    bottom: 5%;
    left: 9%;
    right: 9%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    align-content: space-between;
    gap: 0 8%;
    font-family: 'Quedora', 'Inter', sans-serif;
    font-size: 10cqi;
    line-height: 1;
    z-index: 3;
  }
  .fut-stats > div {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.35em;
    white-space: nowrap;
  }
  .fut-stats b {
    font-weight: 800;
    min-width: 2.2em;
    text-align: right;
  }
  .fut-stats span {
    font-weight: 600;
    font-size: 0.72em;
    opacity: 0.82;
    letter-spacing: 0.05em;
  }

  /* card foot (name + flag) */
  .card-foot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding-top: 2px;
    border-top: 1px solid rgba(0,0,0,0.18);
  }
  .card-name {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: inherit;
    line-height: 1;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-transform: uppercase;
    text-align: center;
  }
  .sub-card .card-name { font-size: 10px; }
  .card-flag {
    font-size: 18px;
    line-height: 1;
  }
  .sub-card .card-flag { font-size: 14px; }

  /* slot label under each card (e.g. "GK ++") — HIDDEN 2026-05-03.
     The card itself carries an internal pos chip (`.card-pos`) so an
     external label below the card duplicates the position name AND
     adds ~20px of vertical bleed that makes adjacent rows visually
     overlap when CAM stacks under ST in 4-2-3-1 / 4-4-1-1 / 4-1-2-1-2.
     Keeping the styles for forward-compat; only hiding via display. */
  .slot-label {
    display: none;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.10em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    line-height: 1;
  }
  .slot-label .chem {
    color: var(--green);
    margin-left: 2px;
  }

  /* ── SUBS PANEL (right) ─────────────────────── */
  .subs-panel {
    position: absolute;
    top: 240px;
    left: 1320px;
    width: 540px;
    height: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 9;
    animation: subs-fade 0.9s 0.55s ease both;
  }
  .subs-label {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 80px;
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow:
      0 0 1px rgba(255,255,255,0.85),
      0 4px 14px rgba(0,0,0,0.65),
      0 0 24px rgba(107,205,6,0.18);
    margin-bottom: 2px;
  }
  .subs-grid {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    gap: 18px 16px;
    width: max-content;
    justify-content: center;
    justify-items: center;
  }
  @keyframes subs-fade {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── BOTTOM PARTNER STRIP ─────────────────── */
  .partners {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    display: var(--overlay-partner-strip-show, flex);
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 12;
    animation: partners-fade 1.1s 0.7s ease both;
  }
  .partners-label {
    font-family: var(--accent);
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.70);
    text-transform: uppercase;
  }
  [data-element-id="partners-strip"] img.partner {
    height: 50px; width: auto; object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }
  .partners-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 64px;
    padding: 8px 32px;
    background: rgba(8,8,8,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    backdrop-filter: blur(4px);
  }
  @keyframes partners-fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── SEASON WATERMARK (bottom-left corner, subtle) ────── */
  .season-mark {
    position: absolute;
    bottom: 110px;
    left: 80px;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.40em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    z-index: 12;
  }
  .season-mark::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 9px;
    transform: translateY(-1px);
    box-shadow: 0 0 10px var(--green-glow);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.55; transform: translateY(-1px) scale(1); }
    50%      { opacity: 1;    transform: translateY(-1px) scale(1.2); }
  }
</style>
</head>
<body>
  <main class="stage">

    <!-- BG -->
    <div class="bg-image" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="bg-grain" aria-hidden="true"></div>

    <!-- TOP-LEFT: title + draft-owner photo -->
    <section class="title-block">
      <div class="title-text">
        <h1 class="title-line line-1" data-element-id="draft-owner-name">MR OGA</h1>
        <h1 class="title-line line-2" data-element-id="draft-label">DRAFT</h1>
      </div>
      <img class="draft-photo"
           data-element-id="draft-owner-photo"
           src="/overlays/v2/_assets/players/processed/mr_oga/headshot_01_nobg.png"
           alt="Draft owner" />
    </section>

    <!-- STATS (Chemistry / Formation) -->
    <section class="stat-block">
      <div class="stat-row chemistry">
        <span class="stat-label" data-element-id="chemistry-label">CHEMISTRY</span>
        <span class="stat-value" data-element-id="chemistry-value">30/33</span>
      </div>
      <div class="stat-row formation">
        <span class="stat-label" data-element-id="formation-label">FORMATION</span>
        <span class="stat-value" data-element-id="formation-value">4-3-3(2)</span>
      </div>
    </section>

    <!-- TOP-RIGHT: CADE + PRO LEAGUE -->
    <header class="header-row" data-element-id="header-row">
      <img class="logo logo--cade"
           src="/overlays/v2/_assets/logos/processed/1cade%20esport_strip.png"
           alt="CADE Esports" />
      <span class="divider" aria-hidden="true"></span>
      <img class="logo logo--pro"
           src="/overlays/v2/_assets/logos/processed/pro%20league%20_strip.png"
           alt="National E-Soccer Pro League" />
    </header>

    <!-- PITCH — server-resolved formation. Slots are CREATED DYNAMICALLY
         by renderPitch() at absolute (top%, left%) coordinates derived
         from the player's submitted formation. The picker's
         getFormationSlots() catalog is the single source of truth so
         the overlay always mirrors what the player saw on /player/squad. -->
    <section class="pitch-wrap" data-element-id="pitch-wrap">
      <div class="pitch-bg" aria-hidden="true"></div>
      <div class="pitch" data-element-id="pitch"></div>
    </section>

    <!-- SUBS PANEL (right) -->
    <aside class="subs-panel" data-element-id="subs-panel">
      <h2 class="subs-label" data-element-id="subs-label">SUBS</h2>
      <div class="subs-grid" data-element-id="subs-grid">
        <!-- Sub cards rendered by JS -->
      </div>
    </aside>

    <!-- SEASON WATERMARK -->
    <div class="season-mark">ELITE LEAGUE · SEASON 2</div>

    <!-- Bottom partner strip -->
    <footer data-element-id="partners-strip" class="partners">
      <span class="partners-label">Official Partners</span>
      <div class="partners-row">
        <img class="partner partner--gameevo" src="/overlays/v2/_assets/logos/processed/GameEvo%20Esports%20White_strip.png" alt="GameEvo Esports" />
        <img class="partner partner--pride"   src="/overlays/v2/_assets/logos/processed/Gamepride%20Green-01_strip.png" alt="Gamepride" />
        <img class="partner partner--africa"  src="/overlays/v2/_assets/logos/processed/ESPORTS%20AFRICA%20NEWS%20WHITE_strip.png" alt="Esports Africa News" />
        <img class="partner partner--trace"   src="/overlays/v2/_assets/logos/processed/TRACE_2010_logo.svg_strip.png" alt="Trace" />
        <img class="partner partner--oas"     src="/overlays/v2/_assets/logos/processed/OAS%20esport_strip.png" alt="OAS esport" />
        <img class="partner partner--wagyr"   src="/overlays/v2/_assets/logos/processed/WAGYR_strip.png" alt="WAGYR" />
      </div>
    </footer>

  </main>

  <script>
    /* LIVE DATA — postMessage listener (data-feed driven).
       Accepts:
         { type:'show'|'hide', data?: {...} }
         { type:'update', data: { draftOwner:{displayName, headshotUrl},
                                  formation: '4-3-3(2)',
                                  chemistry: '30/33' | 30,
                                  starting: [{slot_index, name, rating, position, item_type, nationality_flag}],
                                  subs:     [{slot_index, name, rating, position, item_type, nationality_flag}] } }
       Also accepts the server-shaped payload: { payload: { ... } }. */
    (function () {
      // Default 4-3-3 slot map — used as a SAFE FALLBACK when the
      // payload arrives without server-resolved `pitchSlots[]` (e.g. the
      // demo loop, legacy postMessage payloads from the broadcast control
      // panel that pre-date the May-2026 layout fix). Coordinates here
      // mirror PitchLayout.tsx::FORMATIONS["433"] verbatim — picker +
      // overlay must agree.
      var DEFAULT_PITCH_SLOTS_433 = [
        { slotIndex: 0,  label: 'GK', top: 92, left: 50 },
        { slotIndex: 1,  label: 'LB', top: 72, left: 12 },
        { slotIndex: 2,  label: 'CB', top: 74, left: 34 },
        { slotIndex: 3,  label: 'CB', top: 74, left: 66 },
        { slotIndex: 4,  label: 'RB', top: 72, left: 88 },
        { slotIndex: 5,  label: 'CM', top: 48, left: 22 },
        { slotIndex: 6,  label: 'CM', top: 52, left: 50 },
        { slotIndex: 7,  label: 'CM', top: 48, left: 78 },
        { slotIndex: 8,  label: 'LW', top: 20, left: 16 },
        { slotIndex: 9,  label: 'ST', top: 14, left: 50 },
        { slotIndex: 10, label: 'RW', top: 20, left: 84 }
      ];
      // Lookup helper: returns 'GK' for slot 0, 'CM' for slot 6, etc.
      function defaultLabelForSlot(idx) {
        var s = DEFAULT_PITCH_SLOTS_433[idx];
        return s ? s.label : '';
      }
      // Currently-rendered pitch slot map (latest update() wins). Used
      // by renderPitch when starting items arrive without a fresh
      // pitchSlots[] (e.g. mid-stream `update` postMessage that only
      // refreshed score/chemistry).
      var currentPitchSlots = DEFAULT_PITCH_SLOTS_433;

      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function tintClass(itemType) {
        var t = (itemType || '').toLowerCase();
        if (t === 'gold')    return 't-gold';
        if (t === 'silver')  return 't-silver';
        if (t === 'bronze')  return 't-bronze';
        if (t === 'hero')    return 't-hero';
        if (t === 'icon')    return 't-icon';
        if (t === 'special') return 't-special';
        if (t === 'tots')    return 't-tots';
        if (t === 'toty')    return 't-toty';
        if (t === 'rttf')    return 't-rttf';
        return 't-other';
      }
      // Normalize camelCase ↔ snake_case so the same renderer handles BOTH
      // postMessage payloads (typically snake_case from the broadcast control
      // panel) AND server-feed payloads from
      // `/api/broadcast/v2/sessions/<id>/player-squads` (camelCase).
      function pick(item, camel, snake) {
        if (!item) return undefined;
        if (item[camel] != null) return item[camel];
        if (item[snake] != null) return item[snake];
        return undefined;
      }
      function cardHtml(item, isSub) {
        var itemType = pick(item, 'itemType', 'item_type');
        var slotIdx  = pick(item, 'slotIndex', 'slot_index');
        var nationalityFlag = pick(item, 'nationalityFlag', 'nationality_flag');
        var cardImg  = pick(item, 'cardImageUrl', 'card_image_url');
        var cardBg   = pick(item, 'cardBgUrl',   'card_bg_url');
        var mains    = (item && item.mains) || null;
        var cls = isSub ? 'sub-card ' : 'pitch-card ';
        cls += tintClass(itemType);
        // FUT card composite — when both frame (card_bg_url) + face
        // (card_image_url) are available, render a full FUT-style layered
        // card matching the futbin design. Without the bg we fall back to
        // the face-only render (still recognizable + tinted via item_type).
        // Without either we fall back to the original gradient placeholder.
        var hasFutbinComposite = !!(cardImg && cardBg);
        var hasFaceOnly        = !!cardImg && !cardBg;
        if (hasFutbinComposite) cls += ' has-fut-card';
        else if (hasFaceOnly)   cls += ' has-img';
        var rating = (item && item.rating != null) ? String(item.rating) : '--';
        var pos    = (item && item.position) || defaultLabelForSlot(slotIdx) || '';
        var name   = (item && item.name) || '';
        var flag   = nationalityFlag || '';

        if (hasFutbinComposite) {
          // FUTBIN's `card_bg_url` is the GENERIC variant ART TEMPLATE —
          // frame + decorative bg only, NO player face / rating / stats.
          // The full FUT card visible on futbin.com is composited
          // client-side from frame + face + HTML overlay text. We do the
          // same: stretch card_bg_url as the card backdrop, overlay
          // card_image_url as the face in the face slot, then CSS-render
          // rating + position + name + 6 mains stats on top.
          var statsHtml = '';
          if (mains) {
            statsHtml =
              '<div class="fut-stats">' +
                '<div><b>' + escHtml(mains.pac == null ? '--' : mains.pac) + '</b><span>PAC</span></div>' +
                '<div><b>' + escHtml(mains.dri == null ? '--' : mains.dri) + '</b><span>DRI</span></div>' +
                '<div><b>' + escHtml(mains.sho == null ? '--' : mains.sho) + '</b><span>SHO</span></div>' +
                '<div><b>' + escHtml(mains.def == null ? '--' : mains.def) + '</b><span>DEF</span></div>' +
                '<div><b>' + escHtml(mains.pas == null ? '--' : mains.pas) + '</b><span>PAS</span></div>' +
                '<div><b>' + escHtml(mains.phy == null ? '--' : mains.phy) + '</b><span>PHY</span></div>' +
              '</div>';
          }
          return '<div class="' + cls + '">' +
            '<div class="fut-frame" style="background-image:url(\'' + escHtml(cardBg) + '\')"></div>' +
            '<img class="fut-face" src="' + escHtml(cardImg) + '" alt="' + escHtml(name) + '" loading="lazy" referrerpolicy="no-referrer" />' +
            '<div class="fut-overlay">' +
              '<div class="fut-rating">' + escHtml(rating) + '</div>' +
              '<div class="fut-pos">' + escHtml(pos) + '</div>' +
              '<div class="fut-name">' + escHtml(name).toUpperCase() + '</div>' +
              statsHtml +
            '</div>' +
          '</div>';
        }

        // Face-only fallback (cardImageUrl present but no cardBgUrl).
        var bodyHtml = cardImg
          ? '<img class="card-img" src="' + escHtml(cardImg) + '" alt="' + escHtml(name) + '" loading="lazy" referrerpolicy="no-referrer" />'
          : '<div class="card-body" aria-hidden="true"></div>';
        return '<div class="' + cls + '">' +
          '<div class="card-head">' +
            '<span class="card-rating">' + escHtml(rating) + '</span>' +
            '<span class="card-pos">' + escHtml(pos) + '</span>' +
          '</div>' +
          bodyHtml +
          '<div class="card-foot">' +
            '<span class="card-name">' + escHtml(name).toUpperCase() + '</span>' +
            (flag ? '<span class="card-flag">' + escHtml(flag) + '</span>' : '') +
          '</div>' +
        '</div>';
      }

      // Build the absolute-positioned slot divs from a pitchSlots[]
      // map (server-resolved from the player's submitted formation via
      // PitchLayout::getFormationSlots). The pitch box is wiped and
      // rebuilt on every render so a formation change between refreshes
      // never leaves stale slots from the previous formation.
      function renderPitch(items, pitchSlots) {
        var pitch = document.querySelector('[data-element-id="pitch"]');
        if (!pitch) return;
        // Pick the slot map, in priority order:
        //   1. caller-supplied pitchSlots[] (server feed shape).
        //   2. last known map (currentPitchSlots — re-renders triggered
        //      by mid-stream chemistry updates without a fresh formation).
        //   3. baked-in 4-3-3 fallback.
        var slotMap = Array.isArray(pitchSlots) && pitchSlots.length === 11
          ? pitchSlots
          : (Array.isArray(currentPitchSlots) && currentPitchSlots.length === 11
            ? currentPitchSlots
            : DEFAULT_PITCH_SLOTS_433);
        // Persist for subsequent renders that omit pitchSlots.
        currentPitchSlots = slotMap;
        // Index items by slotIndex. Accept both camelCase (server feed)
        // and snake_case (postMessage demo / control panel) shapes.
        var bySlot = {};
        if (Array.isArray(items)) {
          items.forEach(function (it) {
            if (!it) return;
            var idx = pick(it, 'slotIndex', 'slot_index');
            if (idx == null) return;
            bySlot[idx] = it;
          });
        }
        // Wipe + rebuild.
        pitch.innerHTML = '';
        slotMap.forEach(function (s) {
          var slot = document.createElement('div');
          slot.className = 'slot';
          slot.setAttribute('data-slot-index', String(s.slotIndex));
          slot.style.top = (typeof s.top === 'number' ? s.top : 50) + '%';
          slot.style.left = (typeof s.left === 'number' ? s.left : 50) + '%';
          var item = bySlot[s.slotIndex];
          var posLabel = s.label || defaultLabelForSlot(s.slotIndex);
          if (item) {
            slot.innerHTML = cardHtml(item, false) +
              '<span class="slot-label">' + escHtml(posLabel) +
                (item.chemistry ? ' <span class="chem">' + escHtml(item.chemistry) + '</span>' : '') +
              '</span>';
          }
          pitch.appendChild(slot);
        });
      }

      function renderSubs(items) {
        var grid = document.querySelector('[data-element-id="subs-grid"]');
        if (!grid || !Array.isArray(items)) return;
        var html = '';
        for (var i = 0; i < items.length; i++) {
          var it = items[i] || {};
          html += cardHtml(it, true);
        }
        grid.innerHTML = html;
      }

      function readPayload(data) {
        if (!data) return null;
        if (data.payload && typeof data.payload === 'object') return data.payload;
        return data;
      }

      // When the broadcast control panel triggers with a different
      // playerId (operator picks Mr Oga then Faruk etc), the postMessage
      // payload only carries `{playerId}` — not the full draft. Re-fetch
      // the player-squads endpoint with that id so name + photo +
      // formation + chemistry + cards all repaint.
      function fetchAndUpdate(playerId) {
        try {
          var qs = new URLSearchParams(window.location.search);
          var sess = qs.get('session');
          var tok  = qs.get('token');
          if (!sess || !tok || !playerId) return;
          var url = '/api/broadcast/v2/sessions/' + encodeURIComponent(sess) +
                    '/player-squads?t=' + encodeURIComponent(tok) +
                    '&playerId=' + encodeURIComponent(playerId);
          fetch(url, { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d && d.payload) update(d.payload);
            })
            .catch(function (e) {
              console.warn('[19-player-squads] fetchAndUpdate failed', e);
            });
        } catch (e) { /* ignore */ }
      }

      function update(data) {
        var p = readPayload(data);
        if (!p) return;
        // Broadcast Trigger path: only `{playerId}` arrived (no draftOwner /
        // starting / subs). Re-fetch the full payload from the server, then
        // recurse with the populated payload.
        if (p.playerId && !p.draftOwner && !Array.isArray(p.starting)) {
          fetchAndUpdate(p.playerId);
          return;
        }
        if (p.draftOwner) {
          var nameEl = document.querySelector('[data-element-id="draft-owner-name"]');
          if (nameEl && p.draftOwner.displayName) {
            nameEl.textContent = String(p.draftOwner.displayName).toUpperCase();
          }
          var photoEl = document.querySelector('[data-element-id="draft-owner-photo"]');
          if (photoEl && p.draftOwner.headshotUrl) {
            photoEl.setAttribute('src', p.draftOwner.headshotUrl);
          }
        }
        // Empty-state: no submission for the requested week. Show "—" for
        // formation + chemistry, wipe pitch + subs. This is the user's
        // explicit spec — "if they have not submitted it should come up
        // as a -".
        var hasSubmission = p.submission != null;
        var formEl = document.querySelector('[data-element-id="formation-value"]');
        if (formEl) {
          formEl.textContent = (hasSubmission && p.formation) ? String(p.formation) : '—';
        }
        var chemEl = document.querySelector('[data-element-id="chemistry-value"]');
        if (chemEl) {
          // Bug 10 (2026-05-01) — chemistry now arrives as either a string
          // ("30/33"), a number (30), or the structured form
          // { total: 30, perSlot: [...] }. Render `total/33` regardless.
          var chemVal = '—';
          if (hasSubmission && p.chemistry != null) {
            if (typeof p.chemistry === 'object' && p.chemistry.total != null) {
              chemVal = String(p.chemistry.total) + '/33';
            } else if (typeof p.chemistry === 'number') {
              chemVal = String(p.chemistry) + '/33';
            } else {
              chemVal = String(p.chemistry);
            }
          }
          chemEl.textContent = chemVal;
        }
        // User report 2026-05-02 — repaint pitch at the formation the
        // player actually submitted. `pitchSlots` arrives from
        // /api/broadcast/v2/sessions/<id>/player-squads as 11 entries
        // each `{ slotIndex, label, top, left }` (server-resolved from
        // PitchLayout::getFormationSlots so picker + overlay agree).
        // When the payload is the legacy demo-loop / postMessage shape
        // it omits pitchSlots — we fall back to the last-rendered map.
        if (Array.isArray(p.starting)) {
          renderPitch(p.starting, Array.isArray(p.pitchSlots) ? p.pitchSlots : null);
        } else if (!hasSubmission) {
          renderPitch([], Array.isArray(p.pitchSlots) ? p.pitchSlots : null);
        }
        if (Array.isArray(p.subs))     renderSubs(p.subs);
        else if (!hasSubmission) renderSubs([]);
      }

      function show() {
        document.body.classList.remove('cade-exiting');
        document.body.classList.add('cade-visible');
      }
      function hide() {
        document.body.classList.remove('cade-visible');
        document.body.classList.add('cade-exiting');
      }

      window.addEventListener('message', function (ev) {
        var msg = ev && ev.data;
        if (!msg || typeof msg !== 'object') return;
        console.info('[overlay/19-player-squads] message', msg.type || msg.event || '?', msg.payload || msg.data);
        if (msg.type === 'show') {
          update(msg.data || msg.payload || {});
          show();
        } else if (msg.type === 'update') {
          update(msg.data || msg.payload || {});
        } else if (msg.type === 'hide') {
          hide();
        }
      }, false);

      // Expose for diagnostics + initial-fetch wiring.
      window.__cadeOverlay19 = { update: update, show: show, hide: hide };
    })();
  </script>

  <script data-tag="cade-visible-gate-observer-v2">
  (function(){
    /* Task B 2026-05-19 — bg layers removed; driven by body.cade-bg-persistent. */
    var SEL = '.header-row,.title-block,.stat-block,.pitch-wrap,.subs-panel,.partners,.season-mark,.pitch-card,.sub-card';
    var INNER_SEL = '.title-line,.draft-photo,.stat-label,.stat-value,.subs-label,.slot-label,.card-rating,.card-pos,.card-name,.card-flag,.card-body,.card-head,.card-foot,.pitch,.subs-grid,.partners-row,.partners-label';
    function apply() {
      var b = document.body;
      if (!b) return;
      var vis = b.classList.contains('cade-visible');
      var exit = b.classList.contains('cade-exiting');
      document.querySelectorAll(SEL).forEach(function(el){
        if (!el.dataset.cadeTransition) {
          el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
          el.dataset.cadeTransition = '1';
        }
        if (vis) {
          el.style.setProperty('opacity', '1', 'important');
          el.style.removeProperty('transform');
          el.style.setProperty('visibility', 'visible', 'important');
        } else if (exit) {
          el.style.setProperty('opacity', '0', 'important');
        } else {
          el.style.setProperty('opacity', '0', 'important');
        }
      });
      document.querySelectorAll(INNER_SEL).forEach(function(el){
        if (!el.dataset.cadeTransition) {
          el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
          el.dataset.cadeTransition = '1';
        }
        if (vis) {
          el.style.setProperty('opacity', '1', 'important');
        } else if (!exit) {
          el.style.removeProperty('opacity');
        }
      });
    }
    apply();
    new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
  })();
  </script>
