<!DOCTYPE html>
<!--
  CADE ELITE LEAGUE — OVERLAY #04 — H2H 2-PLAYER (V2 PILOT SYSTEM REBUILD)
  Full-screen 1920×1080 head-to-head matchup card.
  Built on the v2 pilot design system from ../01-brb/index.html:
    - Same @font-face block (Agharti + Quedora local woff2)
    - Same vertical halftone-green stadium BG + vignette + scanline grain
    - Same top CADE+Pro League logo pair w/ vertical separator
    - Same side chevron motifs (left + right edges)
    - Same bottom marquee partner strip (4 partners, 3× duplicated track)
  Distinct centerpiece: dramatic dual fullbody photos anchored to L/R edges,
  oversized condensed name backdrops behind each player (green / pink),
  HUD-frame stats card center with 9 cascading rows + win-probability bar.

  DATA WIRES: playerA = {name, photoUrl, orgLogoUrl, pos, p, w, d, l, gf, ga, gd, pts, winProb}, playerB same
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>CADE — H2H 2-Player</title>


<script id="cade-token-bootstrap">
(function() {
  // Wave 2 Stage 3 — cross-document design + text + partner propagation.
  //
  // Read base64-encoded JSON token maps from the iframe URL query
  // string and emit <style> blocks that win the CSS source-order
  // cascade (appended LATER in <head> than the author defaults).
  //
  // Token shapes:
  //   tokens / previewTokens     — { 'bg-color': '#000', ... }
  //   textTokens / previewTextTokens — { '<elementId>': { visible?,
  //     content?, styles?: { color, fontFamily, fontSize, ... } } }
  //   partnerTokens / previewPartnerTokens — {
  //     layout?: { anchor, positionXPx, positionYPx, scalePct,
  //                itemSpacingPx, orientation, justification,
  //                zIndex, visible },
  //     logos?: [ { partnerKey, label, alt, fileUrl, visible?, sort? } ]
  //   }
  //
  // Spec: docs/superpowers/specs/2026-04-29-overlay-design-page-v2.md §6.2
  function decodeTokens(param) {
    if (!param) return null;
    try {
      var json = decodeURIComponent(escape(atob(param)));
      var obj = JSON.parse(json);
      if (typeof obj !== 'object' || !obj) return null;
      return obj;
    } catch (e) { return null; }
  }
  function buildCssVars(tokens) {
    if (!tokens) return '';
    var parts = [];
    var imageKeys = { 'bg-image': 1 };
    for (var k in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, k)) continue;
      var v = tokens[k];
      if (typeof v !== 'string') continue;
      var safe = v.replace(/[;{}<>"']/g, '');
      if (imageKeys[k]) {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': url("' + safe + '")');
      } else {
        if (!safe) continue;
        parts.push('--overlay-' + k + ': ' + safe);
      }
    }
    return parts.length ? ':root{' + parts.join(';') + ';}' : '';
  }
  function sanitizeCss(v) {
    return String(v == null ? '' : v).replace(/[;{}<>"\\`]/g, '');
  }
  function buildTextRules(tokens) {
    if (!tokens || typeof tokens !== 'object') return '';
    var rules = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      var s = t.styles || {};
      var declarations = [];
      if (s.color)         declarations.push('color:' + sanitizeCss(s.color));
      if (s.fontFamily)    declarations.push("font-family:'" + sanitizeCss(s.fontFamily) + "'");
      if (s.fontWeight)    declarations.push('font-weight:' + (+s.fontWeight || 400));
      if (s.fontSize)      declarations.push('font-size:' + sanitizeCss(s.fontSize));
      if (s.letterSpacing) declarations.push('letter-spacing:' + sanitizeCss(s.letterSpacing));
      if (s.lineHeight != null) declarations.push('line-height:' + (+s.lineHeight || 1));
      if (s.textAlign)     declarations.push('text-align:' + sanitizeCss(s.textAlign));
      if (s.opacity != null) declarations.push('opacity:' + (+s.opacity || 0));
      // Y-position bug fix (2026-04-28): switch from `left/top + position:absolute`
      // to the CSS individual `translate:` property. `absolute` resolved against
      // the nearest positioned ancestor (often a transformed centering wrapper),
      // so `top:Npx` did not move the element on the 1920x1080 canvas. `translate`
      // is a pure visual displacement and composes with existing `transform: ...`
      // animation keyframes via the Transforms 2 spec.
      if (s.left || s.top) {
        var tx = s.left ? sanitizeCss(s.left) : '0px';
        var ty = s.top ? sanitizeCss(s.top) : '0px';
        declarations.push('translate:' + tx + ' ' + ty + ' !important');
      }
      if (s.zIndex != null) declarations.push('z-index:' + (+s.zIndex || 0));
      if (t.visible === false) declarations.push('display:none');
      if (declarations.length) {
        rules.push('[data-element-id="' + elId + '"]{' + declarations.join(';') + ';}');
      }
    }
    return rules.join('\n');
  }
  function applyTextContent(tokens) {
    if (!tokens || typeof tokens !== 'object') return;
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var t = tokens[elId];
      if (!t || typeof t !== 'object') continue;
      if (typeof t.content !== 'string') continue;
      if (t.content === '' || t.content == null) continue;
      var node = document.querySelector('[data-element-id="' + elId + '"]');
      if (!node) continue;
      try { node.textContent = t.content; } catch (e) { /* read-only */ }
    }
  }
  function buildPartnerLayoutRule(layout) {
    if (!layout || typeof layout !== 'object') return '';
    if (layout.visible === false) {
      return '[data-element-id="partners-strip"]{display:none !important;}';
    }
    var declarations = [];
    declarations.push('display:flex !important');
    declarations.push('flex-direction:' + (layout.orientation === 'vertical' ? 'column' : 'row') + ' !important');
    declarations.push('justify-content:' + sanitizeCss(layout.justification || 'center') + ' !important');
    declarations.push('align-items:center !important');
    declarations.push('gap:' + ((+layout.itemSpacingPx) || 0) + 'px !important');
    declarations.push('z-index:' + ((+layout.zIndex) || 12) + ' !important');
    declarations.push('position:absolute !important');
    var anchor = layout.anchor || 'bottom-center';
    var px = (+layout.positionXPx) || 0;
    var py = (+layout.positionYPx) || 0;
    var sx = ((+layout.scalePct) || 100) / 100;
    var transformOps = [];
    if (anchor.indexOf('top') === 0) {
      declarations.push('top:' + py + 'px !important');
      declarations.push('bottom:auto !important');
    } else if (anchor.indexOf('bottom') === 0) {
      declarations.push('bottom:' + py + 'px !important');
      declarations.push('top:auto !important');
    } else {
      declarations.push('top:' + py + 'px !important');
      declarations.push('bottom:auto !important');
      transformOps.push('translateY(-50%)');
    }
    if (anchor.indexOf('left') !== -1) {
      declarations.push('left:' + px + 'px !important');
      declarations.push('right:auto !important');
    } else if (anchor.indexOf('right') !== -1) {
      declarations.push('right:' + px + 'px !important');
      declarations.push('left:auto');
    } else {
      declarations.push('left:50% !important');
      declarations.push('right:auto !important');
      transformOps.push('translateX(-50%)');
    }
    if (sx !== 1) declarations.push('scale:' + sx + ' !important');
    if (transformOps.length) {
      declarations.push('transform:' + transformOps.join(' ') + ' !important');
      declarations.push('transform-origin:center center');
    }
    return '[data-element-id="partners-strip"]{' + declarations.join(';') + ';}';
  }
  function applyPartnerLogos(logos, layout) {
    if (!Array.isArray(logos)) return false;
    var strip = document.querySelector('[data-element-id="partners-strip"]');
    if (!strip) return false;
    // Filter visible + sort.
    var sorted = logos
      .filter(function(l) { return l && l.visible !== false && typeof l.fileUrl === 'string'; })
      .slice()
      .sort(function(a, b) {
        var sa = typeof a.sort === 'number' ? a.sort : 999;
        var sb = typeof b.sort === 'number' ? b.sort : 999;
        return sa - sb;
      });
    if (sorted.length === 0 && (!layout || layout.visible !== false)) {
      // No logos but layout present — leave existing children alone.
      return false;
    }
    // Wipe existing children.
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    // Mark as flex container so the layout CSS takes effect even without
    // browser quirks.
    sorted.forEach(function(l) {
      var img = document.createElement('img');
      var safeKey = sanitizeCss(l.partnerKey || 'x');
      img.className = 'partner partner--' + safeKey;
      img.src = sanitizeCss(l.fileUrl);
      img.alt = sanitizeCss(l.alt || l.label || '');
      img.setAttribute('data-partner-key', safeKey);
      strip.appendChild(img);
    });
    return true;
  }
  // ────────── Stage 4 — element animations ──────────
  //
  // Build @keyframes BODY for a given preset anim type. Mirrors
  // server/overlays/animations/elements.ts::buildKeyframesBody — same
  // values across server-side resolver + client-side bootstrap so
  // SSR-emitted styles + URL-borne overrides yield identical motion.
  function buildPresetKeyframes(animType, name, customBody) {
    switch (animType) {
      case 'slide-left':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-right':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}';
      case 'slide-up':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}';
      case 'slide-down':
        return '@keyframes ' + name + '{from{opacity:0;transform:translateY(-32px)}to{opacity:1;transform:translateY(0)}}';
      case 'fade':
        return '@keyframes ' + name + '{from{opacity:0}to{opacity:1}}';
      case 'scale':
        return '@keyframes ' + name + '{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}';
      case 'rotate':
        return '@keyframes ' + name + '{from{opacity:0;transform:rotate(-12deg)}to{opacity:1;transform:rotate(0)}}';
      case 'bounce':
        return '@keyframes ' + name + '{0%{opacity:0;transform:translateY(20px)}60%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}';
      case 'pulse':
        return '@keyframes ' + name + '{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}';
      case 'glow':
        return '@keyframes ' + name + '{0%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}50%{filter:drop-shadow(0 0 24px rgba(107,205,6,0.55))}100%{filter:drop-shadow(0 0 0 rgba(107,205,6,0))}}';
      case 'shake':
        return '@keyframes ' + name + '{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
      case 'flip':
        return '@keyframes ' + name + '{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:perspective(800px) rotateY(0)}}';
      case 'custom-css':
        // Defence-in-depth: strip url(), at-rules, and angle/backtick
        // characters even if server sanitizer was bypassed (URL-borne).
        if (typeof customBody !== 'string') return '';
        if (/\burl\s*\(/i.test(customBody)) return '';
        if (/@(import|font-face|charset|media|supports|keyframes)\b/i.test(customBody)) return '';
        if (/[<>\`]/.test(customBody)) return '';
        return '@keyframes ' + name + '{' + customBody + '}';
      case 'none':
      default:
        return '';
    }
  }
  function buildAnimRulesAndKeyframes(tokens) {
    if (!tokens || typeof tokens !== 'object') return { keyframes: '', rules: '' };
    var keyframesParts = [];
    var rulesParts = [];
    for (var elId in tokens) {
      if (!Object.prototype.hasOwnProperty.call(tokens, elId)) continue;
      if (!/^[a-z][a-z0-9-]*$/.test(elId)) continue;
      var phases = tokens[elId];
      if (!phases || typeof phases !== 'object') continue;
      for (var phase in phases) {
        if (!Object.prototype.hasOwnProperty.call(phases, phase)) continue;
        if (phase !== 'entry' && phase !== 'exit' && phase !== 'continuous') continue;
        var p = phases[phase];
        if (!p || typeof p !== 'object') continue;
        if (p.enabled === false) continue;
        if (!p.animType || p.animType === 'none') continue;
        var animName = 'cade-' + elId + '-' + phase;
        var kf = buildPresetKeyframes(
          p.animType,
          animName,
          p.customCssKeyframes || ''
        );
        if (!kf) continue;
        keyframesParts.push(kf);
        var duration = (+p.durationMs) || 360;
        var delay = (+p.delayMs) || 0;
        var easing = sanitizeCss(p.easing || 'ease-out');
        var iterations = sanitizeCss(p.iterationCount || '1');
        // Phase-gated selector. Continuous animations only run while
        // the overlay is visible (cade-visible class on body).
        var sel =
          phase === 'exit'
            ? 'body.cade-exiting [data-element-id="' + elId + '"]'
            : 'body.cade-visible [data-element-id="' + elId + '"]';
        var rule =
          'animation:' + animName +
          ' ' + duration + 'ms' +
          ' ' + easing +
          ' ' + delay + 'ms' +
          ' ' + iterations +
          ' both;';
        rulesParts.push(sel + '{' + rule + '}');
      }
    }
    return {
      keyframes: keyframesParts.join('\n'),
      rules: rulesParts.join('\n'),
    };
  }
  try {
    var qs = new URLSearchParams(location.search);
    var design = decodeTokens(qs.get('tokens'));
    var preview = decodeTokens(qs.get('previewTokens'));
    var textTokens = decodeTokens(qs.get('textTokens'));
    var previewTextTokens = decodeTokens(qs.get('previewTextTokens'));
    var partnerTokens = decodeTokens(qs.get('partnerTokens'));
    var previewPartnerTokens = decodeTokens(qs.get('previewPartnerTokens'));
    var animTokens = decodeTokens(qs.get('animTokens'));
    var previewAnimTokens = decodeTokens(qs.get('previewAnimTokens'));
    // Source order: design first, preview second so preview wins.
    var cssVarRule = buildCssVars(design) + buildCssVars(preview);
    var textRule = buildTextRules(textTokens) + (buildTextRules(textTokens).length && buildTextRules(previewTextTokens).length ? '\n' : '') + buildTextRules(previewTextTokens);
    // Partner layout: preview wins by being applied second (later
    // <style> block wins on identical selector via source-order).
    var partnerRules = [];
    if (partnerTokens && partnerTokens.layout) {
      var r1 = buildPartnerLayoutRule(partnerTokens.layout);
      if (r1) partnerRules.push(r1);
    }
    if (previewPartnerTokens && previewPartnerTokens.layout) {
      var r2 = buildPartnerLayoutRule(previewPartnerTokens.layout);
      if (r2) partnerRules.push(r2);
    }
    // Stage 4 — element animations. Build keyframes + rules from both
    // design + preview maps. Source-order wins on identical names: the
    // preview block emits second, so its keyframes & rules overwrite
    // design's via CSS cascade (same selector + same animation-name).
    var animDesign = buildAnimRulesAndKeyframes(animTokens);
    var animPreview = buildAnimRulesAndKeyframes(previewAnimTokens);
    var animKeyframesCss = animDesign.keyframes +
      (animDesign.keyframes && animPreview.keyframes ? '\n' : '') +
      animPreview.keyframes;
    var animRulesCss = animDesign.rules +
      (animDesign.rules && animPreview.rules ? '\n' : '') +
      animPreview.rules;
    var emit = function() {
      if (!document.head) return;
      if (cssVarRule) {
        var s1 = document.createElement('style');
        s1.id = 'cade-injected-tokens';
        s1.textContent = cssVarRule;
        document.head.appendChild(s1);
      }
      if (textRule) {
        var s2 = document.createElement('style');
        s2.id = 'cade-injected-text';
        s2.textContent = textRule;
        document.head.appendChild(s2);
      }
      if (partnerRules.length) {
        var s3 = document.createElement('style');
        s3.id = 'cade-injected-partners-layout';
        s3.textContent = partnerRules.join('\n');
        document.head.appendChild(s3);
      }
      // Stage 4 — animation keyframes block FIRST (must precede rules
      // so the named animations resolve).
      if (animKeyframesCss) {
        var s4 = document.createElement('style');
        s4.id = 'cade-injected-anim-keyframes';
        s4.textContent = animKeyframesCss;
        document.head.appendChild(s4);
      }
      if (animRulesCss) {
        var s5 = document.createElement('style');
        s5.id = 'cade-injected-anim-rules';
        s5.textContent = animRulesCss;
        document.head.appendChild(s5);
      }
      // Apply textContent edits AFTER DOM is parsed.
      applyTextContent(textTokens);
      applyTextContent(previewTextTokens);
      // Rebuild partner strip children — preview wins by being applied
      // second (overwrites design's children).
      if (partnerTokens && Array.isArray(partnerTokens.logos)) {
        applyPartnerLogos(partnerTokens.logos, partnerTokens.layout);
      }
      if (previewPartnerTokens && Array.isArray(previewPartnerTokens.logos)) {
        applyPartnerLogos(previewPartnerTokens.logos, previewPartnerTokens.layout);
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', emit);
    } else {
      emit();
    }
  } catch (e) {
    // Bootstrap MUST never throw — fall back to HTML defaults.
  }
})();
</script>

  /* ============================================================
     DESIGN TOKENS (consumed via CSS variables) — Phase 2 of overlay
     design system. SSR may inject `:root { --overlay-* }` overrides
     above this declaration; fallbacks here keep first-deploy a no-op.
     See docs/superpowers/specs/2026-04-29-overlay-design-system.md §3.2.
  ============================================================ */
  :root {
    --overlay-bg-color: #050505;
    --overlay-accent-color: #6bcd06;
    --overlay-secondary-color: #fe036d;
    --overlay-text-color: #ffffff;
    --overlay-font-display: 'Agharti';
    --overlay-font-body: 'Quedora';
  }

  /* ── DESIGN TOKENS ─────────────────────────────────────────────
     Local aliases consume the spec-level overlay tokens above so
     existing `var(--green)` / `var(--pink)` / `var(--ink)` consumers
     flow through to the design system. Hex fallbacks keep visual
     defaults unchanged when no SSR token override is injected. */
  :root {
    --green:        var(--overlay-accent-color, #6bcd06);
    --green-glow:   rgba(107, 205, 6, 0.55);
    --green-faint:  rgba(107, 205, 6, 0.18);
    --pink:         var(--overlay-secondary-color, #fe036d);
    --pink-glow:    rgba(254, 3, 109, 0.55);
    --pink-faint:   rgba(254, 3, 109, 0.18);
    --black:        var(--overlay-bg-color, #050505);
    --ink:          var(--overlay-text-color, #ffffff);
    --display:      var(--overlay-font-display, 'Agharti'), 'Impact', sans-serif;
    --accent:       var(--overlay-font-body, 'Quedora'), 'Inter', sans-serif;

    /* Cycle is set extremely high so the auto-OUT animations effectively
       never trigger. Strict-gate model: design holds steady once shown,
       operator drives Update / Hide via postMessage. */
    --cycle: 99999s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    color-scheme: dark;
    color: var(--ink);
    font-family: var(--accent);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* === SPLIT GATE (Category B full-canvas):
     Body + bg-image always visible (halftone-green stadium shows continuously).
     Inner content shells: HIDDEN (opacity 0, animation-name none) until
     cade-visible. On cade-visible, each shell plays its own entry animation
     forward fresh (single play, no cycle). On cade-exiting, all shells fade out.
     Atmospheric bg-image / chev-pulse / dot-pulse animations always run. === */
  body { opacity: 1 !important; }

  /* HIDE bg + inner content until trigger ON. animation-name: none cancels
     the entry animations during the dormant state — when cade-visible
     is added, the animation re-runs fresh (with help of show() reflow). */
  body:not(.cade-visible):not(.cade-exiting) .bg-image,
  body:not(.cade-visible):not(.cade-exiting) .bg-vignette,
  body:not(.cade-visible):not(.cade-exiting) .bg-grain,
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .chevrons,
  body:not(.cade-visible):not(.cade-exiting) .h2h-kicker-wrap,
  body:not(.cade-visible):not(.cade-exiting) .player-col,
  body:not(.cade-visible):not(.cade-exiting) .name-backdrop,
  body:not(.cade-visible):not(.cade-exiting) .stats-card,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .season-mark,
  body:not(.cade-visible):not(.cade-exiting) .winprob-bar-block,
  body:not(.cade-visible):not(.cade-exiting) .stat-row {
    opacity: 0 !important;
  }
  body:not(.cade-visible):not(.cade-exiting) .top-band,
  body:not(.cade-visible):not(.cade-exiting) .chevrons,
  body:not(.cade-visible):not(.cade-exiting) .h2h-kicker-wrap,
  body:not(.cade-visible):not(.cade-exiting) .player-col,
  body:not(.cade-visible):not(.cade-exiting) .name-backdrop,
  body:not(.cade-visible):not(.cade-exiting) .stats-card,
  body:not(.cade-visible):not(.cade-exiting) .partners,
  body:not(.cade-visible):not(.cade-exiting) .season-mark,
  body:not(.cade-visible):not(.cade-exiting) .winprob-bar-block,
  body:not(.cade-visible):not(.cade-exiting) .stat-row {
    animation-name: none !important;
  }

  /* Smooth exit on cade-exiting — applies cade-fade-out to all content shells */
  body.cade-exiting .bg-image,
  body.cade-exiting .bg-vignette,
  body.cade-exiting .bg-grain {
    opacity: 0 !important;
    transition: opacity 0.5s cubic-bezier(0.7, 0, 0.84, 0);
  }
  body.cade-exiting .top-band,
  body.cade-exiting .chevrons,
  body.cade-exiting .h2h-kicker-wrap,
  body.cade-exiting .player-col,
  body.cade-exiting .stats-card,
  body.cade-exiting .partners,
  body.cade-exiting .season-mark,
  body.cade-exiting .name-backdrop,
  body.cade-exiting .winprob-bar-block,
  body.cade-exiting .stat-row {
    animation: cade-fade-out 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
  }
  @keyframes cade-fade-out {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* ── STAGE (1920×1080 transparent canvas) ──────────────────── */
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    isolation: isolate;
    --winA-pct: 50%;
    --winB-pct: 50%;
  }

  /* ── BG: halftone-green stadium texture (from pilot) ───────── */
  .bg-image {
    position: absolute;
    inset: -3% -3%;
    background-image: var(--overlay-bg-image, url('../../../designsample/ELITE%20S2%20BG.png'));
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform-origin: 50% 50%;
    animation: bg-drift 20s ease-in-out infinite alternate,
               bg-breathe 6s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes bg-drift {
    0%   { transform: scale(1.00) translate(0, 0); }
    100% { transform: scale(1.04) translate(-1.2%, -0.6%); }
  }
  @keyframes bg-breathe {
    0%, 100% { filter: brightness(1.00) saturate(1.00); }
    50%      { filter: brightness(1.02) saturate(1.05); }
  }

  /* darker vignette so center stats card reads cleanly + photos pop */
  .bg-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(5,5,5,0.10) 0%, rgba(5,5,5,0.55) 60%, rgba(5,5,5,0.90) 100%),
      linear-gradient(to right,
        rgba(107,205,6,0.10) 0%,
        rgba(5,5,5,0.10) 30%,
        rgba(5,5,5,0.10) 70%,
        rgba(254,3,109,0.10) 100%
      );
    z-index: 1;
    pointer-events: none;
  }

  .bg-grain {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0 1px,
        transparent 1px 3px
      );
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* ── TOP HEADER BAND (CADE | PRO LEAGUE) — enlarged 40% per brief ── */
  .top-band {
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    z-index: 30;
    animation: top-fade 1.0s 0s ease-out both,
               top-out 1.0s calc(var(--cycle) - 1.6s) ease-in both;
  }

  .top-band .logo {
    height: 120px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
  }
  .top-band .logo--cade { height: 110px; }
  .top-band .logo--pro  { height: 128px; }

  .top-band .divider {
    width: 2px;
    height: 96px;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 20%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 80%,
      rgba(255,255,255,0) 100%
    );
    border-radius: 1px;
  }

  @keyframes top-fade {
    0%   { opacity: 0; transform: translateY(-24px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes top-out {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-24px); }
  }

  /* ── SIDE CHEVRONS (decorative) — same as pilot, positioned tighter ── */
  .chevrons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 30px;
    z-index: 4;
    pointer-events: none;
    animation: chev-fade 1.4s 0.1s ease-out both,
               chev-out 0.8s calc(var(--cycle) - 1.4s) ease-in both;
  }
  .chevrons--left  { left: 30px; }
  .chevrons--right { right: 30px; }

  .chevron {
    width: 70px;
    height: 50px;
    color: var(--green);
    opacity: 0.45;
    animation: chev-pulse 4.2s ease-in-out infinite;
  }
  .chevron svg { width: 100%; height: 100%; display: block; }

  .chevrons--left  .chevron:nth-child(1) { animation-delay: 0s;    }
  .chevrons--left  .chevron:nth-child(2) { animation-delay: 0.4s;  }
  .chevrons--left  .chevron:nth-child(3) { animation-delay: 0.8s;  }
  .chevrons--left  .chevron:nth-child(4) { animation-delay: 1.2s;  }
  .chevrons--right .chevron { color: var(--pink); }
  .chevrons--right .chevron:nth-child(1) { animation-delay: 0.6s;  }
  .chevrons--right .chevron:nth-child(2) { animation-delay: 1.0s;  }
  .chevrons--right .chevron:nth-child(3) { animation-delay: 1.4s;  }
  .chevrons--right .chevron:nth-child(4) { animation-delay: 1.8s;  }

  @keyframes chev-pulse {
    0%, 100% { opacity: 0.25; transform: translateX(0); }
    50%      { opacity: 0.75; transform: translateX(6px); }
  }
  .chevrons--right .chevron {
    animation-name: chev-pulse-right;
  }
  @keyframes chev-pulse-right {
    0%, 100% { opacity: 0.25; transform: translateX(0); }
    50%      { opacity: 0.75; transform: translateX(-6px); }
  }
  @keyframes chev-fade {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes chev-out {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ── KICKER PILL ABOVE STATS — centered under top logos ────── */
  /* Wrapper guarantees centering: full-width parent + text-align center,
     pill itself is inline-block so margin auto + content-fit width work. */
  .h2h-kicker-wrap {
    position: absolute;
    top: 200px;
    left: 0;
    right: 0;
    width: 100%;
    text-align: center;
    z-index: 30;
    animation: top-fade 1.0s 0.15s ease-out both,
               top-out 1.0s calc(var(--cycle) - 1.45s) ease-in both;
  }
  .h2h-kicker {
    display: inline-block;
    font-family: var(--accent);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.32em;
    /* compensate for letter-spacing pushing text rightward inside box:
       trailing space in the spacing pattern creates a perceptual offset.
       padding-left adds the matching amount on the left so glyph-content
       reads as truly centered to the eye. */
    padding: 9px 28px 9px 36px;
    color: var(--ink);
    text-transform: uppercase;
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    text-align: center;
  }
  .h2h-kicker .vs {
    color: var(--green);
    margin: 0 12px;
    font-weight: 900;
    text-shadow: 0 0 12px var(--green-glow);
  }

  /* ── PLAYER COLUMNS (LEFT + RIGHT) — narrowed + pulled toward center ── */
  .player-col {
    position: absolute;
    top: 270px;
    height: 640px;
    width: 540px;
    z-index: 8;
    overflow: visible;
  }
  .player-col--a {
    left: 110px;
    animation: player-a-in 1.0s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both,
               player-a-out 0.9s calc(var(--cycle) - 1.1s) cubic-bezier(0.55, 0, 0.78, 0) both;
  }
  .player-col--b {
    right: 110px;
    animation: player-b-in 1.0s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both,
               player-b-out 0.9s calc(var(--cycle) - 1.1s) cubic-bezier(0.55, 0, 0.78, 0) both;
  }

  @keyframes player-a-in {
    0%   { opacity: 0; transform: translateX(-180px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes player-a-out {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(-180px); }
  }
  @keyframes player-b-in {
    0%   { opacity: 0; transform: translateX(180px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes player-b-out {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(180px); }
  }

  /* HUGE Agharti condensed name backdrop behind each photo */
  .name-backdrop {
    position: absolute;
    top: 30px;
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 280px;
    line-height: 0.82;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 1;
    animation: backdrop-drift 14s ease-in-out infinite alternate;
  }
  .player-col--a .name-backdrop {
    left: -40px;
    color: rgba(107, 205, 6, 0.22);
    text-shadow:
      0 0 38px rgba(107,205,6,0.28),
      0 0 80px rgba(107,205,6,0.14);
  }
  .player-col--b .name-backdrop {
    right: -40px;
    text-align: right;
    color: rgba(254, 3, 109, 0.22);
    text-shadow:
      0 0 38px rgba(254,3,109,0.28),
      0 0 80px rgba(254,3,109,0.14);
  }
  @keyframes backdrop-drift {
    0%   { transform: translateX(0)   scale(1);    opacity: 0.85; }
    50%  { opacity: 1; }
    100% { transform: translateX(-12px) scale(1.02); opacity: 0.85; }
  }
  .player-col--b .name-backdrop {
    animation-name: backdrop-drift-b;
  }
  @keyframes backdrop-drift-b {
    0%   { transform: translateX(0)   scale(1);    opacity: 0.85; }
    50%  { opacity: 1; }
    100% { transform: translateX(12px) scale(1.02);  opacity: 0.85; }
  }

  /* Player fullbody photo — sized to leave gap above partner strip */
  .player-photo-wrap {
    position: absolute;
    bottom: 0;
    width: 480px;
    height: 600px;
    z-index: 3;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .player-col--a .player-photo-wrap { left: 30px; }
  .player-col--b .player-photo-wrap { right: 30px; }

  .player-photo {
    width: auto;
    height: 580px;
    display: block;
    object-fit: contain;
    object-position: bottom center;
    filter: drop-shadow(0 28px 50px rgba(0,0,0,0.85)) drop-shadow(0 -8px 24px rgba(0,0,0,0.45));
  }

  /* fallback initial circle when photo 404s */
  .player-photo.broken { display: none; }
  .player-photo.broken + .photo-fallback { display: flex; }
  .photo-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    width: 360px;
    height: 480px;
    border-radius: 14px;
    font-family: var(--display);
    font-weight: 900;
    font-size: 240px;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.04em;
    border: 3px solid rgba(255,255,255,0.18);
  }
  .player-col--a .photo-fallback {
    background: linear-gradient(135deg, rgba(107,205,6,0.55), rgba(107,205,6,0.15));
    box-shadow: 0 0 40px var(--green-glow), inset 0 0 60px rgba(107,205,6,0.20);
  }
  .player-col--b .photo-fallback {
    background: linear-gradient(135deg, rgba(254,3,109,0.55), rgba(254,3,109,0.15));
    box-shadow: 0 0 40px var(--pink-glow), inset 0 0 60px rgba(254,3,109,0.20);
  }

  /* Player nameplate (smaller, in front of backdrop, near top) */
  .player-nameplate {
    position: absolute;
    top: 20px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-col--a .player-nameplate { left: 50px;  align-items: flex-start; }
  .player-col--b .player-nameplate { right: 50px; align-items: flex-end;   }

  .player-tag {
    font-family: var(--accent);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.34em;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    padding: 4px 12px;
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 3px;
    background: rgba(0,0,0,0.40);
  }
  .player-col--a .player-tag { border-color: rgba(107,205,6,0.45); color: var(--green); }
  .player-col--b .player-tag { border-color: rgba(254,3,109,0.45); color: var(--pink);  }

  .player-name {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 96px;
    line-height: 0.86;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-transform: uppercase;
    text-shadow: 0 4px 14px rgba(0,0,0,0.85), 0 0 22px rgba(0,0,0,0.55);
  }

  .player-org {
    margin-top: 8px;
    height: 56px;
    width: auto;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.65));
    border-radius: 6px;
  }
  .player-col--b .player-org { margin-left: auto; }

  /* ── CENTER STATS HUD CARD — repositioned to leave ≥80px gap to partner strip ── */
  .stats-card {
    position: absolute;
    top: 270px;
    left: 50%;
    transform: translateX(-50%);
    width: 820px;
    height: 600px;
    z-index: 15;
    background: linear-gradient(180deg,
      rgba(8, 12, 6, 0.94) 0%,
      rgba(5, 8, 4, 0.97) 50%,
      rgba(8, 12, 6, 0.94) 100%
    );
    border: 2px solid var(--green);
    /* angled corner cuts (gamer-UI HUD frame) */
    clip-path: polygon(
      0 22px, 22px 0,
      calc(100% - 22px) 0, 100% 22px,
      100% calc(100% - 22px), calc(100% - 22px) 100%,
      22px 100%, 0 calc(100% - 22px)
    );
    box-shadow:
      0 0 0 1px rgba(107,205,6,0.30),
      0 0 60px rgba(107,205,6,0.18),
      inset 0 0 80px rgba(0,0,0,0.55);
    animation: card-in 0.9s 0.6s cubic-bezier(0.22, 1, 0.36, 1) both,
               card-out 0.8s calc(var(--cycle) - 1.0s) cubic-bezier(0.55, 0, 0.78, 0) both;
  }

  @keyframes card-in {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.86); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }
  @keyframes card-out {
    0%   { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.92); }
  }

  /* corner accents on the HUD frame */
  .stats-card::before,
  .stats-card::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    border: 3px solid var(--green);
    pointer-events: none;
  }
  .stats-card::before {
    top: 12px;
    left: 12px;
    border-right: none;
    border-bottom: none;
  }
  .stats-card::after {
    bottom: 12px;
    right: 12px;
    border-left: none;
    border-top: none;
  }

  .stats-inner {
    width: 100%;
    height: 100%;
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
  }

  .stats-header {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(107,205,6,0.30);
    margin-bottom: 6px;
  }
  .stats-header .col-name {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 75%;
    font-size: 44px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }
  .stats-header .col-name--a { color: var(--green); text-align: left;  }
  .stats-header .col-name--b { color: var(--pink);  text-align: right; }
  .stats-header .col-vs {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 100%;
    font-size: 26px;
    letter-spacing: 0.32em;
    color: rgba(255,255,255,0.58);
    text-transform: uppercase;
    text-align: center;
  }

  /* stat rows */
  .stats-rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px 0 0;
  }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    align-items: center;
    padding: 9px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .stat-row:last-of-type { border-bottom: none; }

  .stat-row .stat-label {
    grid-column: 2;
    font-family: var(--accent);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.30em;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
    text-align: center;
  }
  .stat-row .stat-val {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 100%;
    font-size: 38px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .stat-row .stat-val--a { text-align: left;  padding-left:  8px; }
  .stat-row .stat-val--b { text-align: right; padding-right: 8px; }

  /* highlight better/worse per row */
  .stat-row .stat-val.better {
    color: var(--green);
    text-shadow: 0 0 18px rgba(107,205,6,0.55);
  }
  .stat-row .stat-val.worse  {
    color: var(--pink);
    text-shadow: 0 0 14px rgba(254,3,109,0.42);
  }
  .stat-row .stat-val.tie    {
    color: rgba(255,255,255,0.85);
  }

  /* idle pulse on values during the hold phase */
  .stat-row .stat-val.better { animation: val-pulse-green 2.6s 2.0s ease-in-out infinite; }
  .stat-row .stat-val.worse  { animation: val-pulse-pink  2.6s 2.0s ease-in-out infinite; }

  @keyframes val-pulse-green {
    0%, 100% { filter: brightness(1.00) saturate(1.00); }
    50%      { filter: brightness(1.20) saturate(1.25); }
  }
  @keyframes val-pulse-pink {
    0%, 100% { filter: brightness(1.00) saturate(1.00); }
    50%      { filter: brightness(1.12) saturate(1.10); }
  }

  /* row cascade entry/exit — staggered via per-row delay vars */
  .stat-row {
    opacity: 0;
    animation:
      row-in   0.5s ease-out forwards,
      row-out  0.4s ease-in  forwards;
    animation-delay: var(--in-delay), var(--out-delay);
  }
  @keyframes row-in {
    0%   { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes row-out {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* base entry start = 0.95s, +60ms per row.
     exit reverse cascade — last row exits first, top row last.
     exit base = (cycle - 1.5s) — matches stats-card scale-out window. */
  .stat-row.r1 { --in-delay: 0.95s; --out-delay: calc(var(--cycle) - 0.60s); }
  .stat-row.r2 { --in-delay: 1.01s; --out-delay: calc(var(--cycle) - 0.66s); }
  .stat-row.r3 { --in-delay: 1.07s; --out-delay: calc(var(--cycle) - 0.72s); }
  .stat-row.r4 { --in-delay: 1.13s; --out-delay: calc(var(--cycle) - 0.78s); }

    (function () {

      };
      var PLAYER_ORG = {
        adefola:      '/overlays/v2/_assets/Orgs/cade%20esport%20-%20ADEFOLA.png',
        anife:        '/overlays/v2/_assets/Orgs/AFROPANDA%20ESPORTS%20-%20ANIFE.jpeg',

      var NAME_TO_SLUG = {

      function readPlayer(p) {
        if (!p) return null;
        // 2026-04-28 Phase B4 — endpoint returns `gamerTag` (canonical) +

        // Pick the first non-empty in priority order.
        var rawName = p.displayName || p.name || p.gamerTag || '';

          if (canon) slug = canon;
        }
        var name = rawName || (slug ? slug.replace(/_/g, ' ').toUpperCase() : '');
        // Server payload photoUrl/orgLogoUrl (when present) win over the static slug map.
        // Phase B4 — pick up stat fields off either shape:
        //   server (H2HCard): pos, played, wins, draws, losses, gf, ga, gd, pts, winProbPct
        //   nested (postMessage from a future shape): p.stats = {...}
        var stats = (p.stats && typeof p.stats === 'object') ? p.stats : null;
        return {
          slug: slug,
          name: name,
          photoUrl: p.photoUrl || null,
          orgLogoUrl: p.orgLogoUrl || null,
          stats: {
            position:    pickStat(stats, 'position', p.pos),
            played:      pickStat(stats, 'played',   p.played),
            wins:        pickStat(stats, 'wins',     p.wins),
            draws:       pickStat(stats, 'draws',    p.draws),
            losses:      pickStat(stats, 'losses',   p.losses),
            gf:          pickStat(stats, 'gf',       p.gf),
            ga:          pickStat(stats, 'ga',       p.ga),
            gd:          pickStat(stats, 'gd',       p.gd),
            points:      pickStat(stats, 'points',   p.pts != null ? p.pts : p.points),
            winProbPct:  pickStat(stats, 'winProbPct', p.winProbPct)
          }
        };
      }
      function pickStat(stats, key, fallback) {
        if (stats && stats[key] !== undefined && stats[key] !== null) return stats[key];
        if (fallback !== undefined && fallback !== null) return fallback;
        return null;
      }

      function applyToCol(colEl, info) {
        if (!colEl || !info) return;
        var nameEl    = colEl.querySelector('.player-name');
        var backdrop  = colEl.querySelector('.name-backdrop');
        var photoEl   = colEl.querySelector('.player-photo');
        var orgEl     = colEl.querySelector('.player-org');
        var fbEl      = colEl.querySelector('.photo-fallback');
        if (nameEl)   nameEl.textContent = info.name || '';
        if (backdrop) backdrop.textContent = info.name || '';
        if (photoEl) {
          var src = info.photoUrl || PLAYER_PHOTO[info.slug];
          if (src) {
            photoEl.classList.remove('broken');
            photoEl.src = src;
            photoEl.alt = info.name || '';
          } else {
            photoEl.classList.add('broken');
          }
        }
        if (orgEl) {
          var orgSrc = info.orgLogoUrl || PLAYER_ORG[info.slug];
          if (orgSrc) {
            orgEl.style.display = '';
            orgEl.src = orgSrc;
          } else {
            orgEl.style.display = 'none';
          }
        }
        if (fbEl && info.name) fbEl.textContent = info.name.charAt(0).toUpperCase();
      }

      /**
       * Phase B4 — render stat-row cells from info.stats. The center
       * stats-card has a single set of cells per row spanning both
       * players; we look up `data-stat="<key>"` on the matching side
       * (--a / --b) of every row. Side is passed in.
       */
      function applyStatsToSide(info, side) {
        if (!info || !info.stats) return;
        var sel = '.stats-card .stat-val--' + side + '[data-stat]';
        var nodes = document.querySelectorAll(sel);
        if (!nodes || nodes.length === 0) return;
        var s = info.stats;
        nodes.forEach(function (el) {
          var key = el.getAttribute('data-stat');
          var val = (key === 'win-prob') ? s.winProbPct : s[key];
          if (val === null || val === undefined) {
            el.textContent = '—';
          } else if (key === 'win-prob') {
            // Round to nearest int + suffix.
            var n = Number(val);
            if (!isFinite(n)) { el.textContent = '—'; return; }
            el.textContent = String(Math.round(n)) + '%';
          } else {
            el.textContent = String(val);
          }
        });
        // Also paint the win-probability bar widths if both sides are
        // resolved by the time this fires.
        var aPct = readWinProb('a');
        var bPct = readWinProb('b');
        if (aPct != null && bPct != null) {
          var stage = document.querySelector('.stage');
          if (stage) {
            stage.style.setProperty('--winA-pct', aPct + '%');
            stage.style.setProperty('--winB-pct', bPct + '%');
          }
        }
      }
      function readWinProb(side) {
        var el = document.querySelector(
          '.stats-card .winprob-val--' + side + '[data-stat="win-prob"]'
        );
        if (!el) return null;
        var t = (el.textContent || '').trim();
        if (!t || t === '—') return null;
        var n = parseFloat(t);
        return isFinite(n) ? n : null;
      }

      function applyHeader(info, side) {
        var hdr = document.querySelector('.stats-header .col-name--' + side);
        if (hdr) hdr.textContent = (info && info.name) || '';
      }

      function update(data) {
        if (!data) return;
        // Phase B4 — accept both shapes:
        //   { players: [{slug,name,...}] }    (postMessage from control panel)
        //   { cards:   [{playerId,name,...}] } (server endpoint H2HCard[])
        var players = Array.isArray(data.players)
          ? data.players
          : Array.isArray(data.cards)
            ? data.cards
            : null;
        if (!players) return;
        var a = readPlayer(players[0]);
        var b = readPlayer(players[1]);
        var colA = document.querySelector('.player-col--a');
        var colB = document.querySelector('.player-col--b');
        if (a) {
          applyToCol(colA, a);
          applyHeader(a, 'a');
          applyStatsToSide(a, 'a');
        }
        if (b) {
          applyToCol(colB, b);
          applyHeader(b, 'b');
          applyStatsToSide(b, 'b');
        }
      }

      function show() {
        if (!stage) return;
        document.body.classList.remove('cade-exiting');
        document.body.classList.add('cade-visible');
        // restart entry animations on every show by reflowing animated nodes
        var animated = stage.querySelectorAll(
          '.top-band, .chevrons, .h2h-kicker-wrap, .player-col, .stats-card, .stat-row, .winprob, .winprob-bar-a, .winprob-bar-b, .partners'
        );
        animated.forEach(function (el) {
          var orig = el.style.animation;
          el.style.animation = 'none';
          void el.offsetHeight;
          el.style.animation = orig || '';
        });
      }

      function hide() {
        document.body.classList.remove('cade-visible');
        document.body.classList.add('cade-exiting');
      }

      window.addEventListener('message', function (ev) {
        var msg = ev && ev.data;
        if (!msg || typeof msg !== 'object') return;
        liveMode = true;
        // CONTRACT (per CLAUDE.md §14):
        //   show   → render data + add cade-visible
        //   hide   → swap cade-visible → cade-exiting
        //   update → re-render with new data, NO class change (no auto-show)
        if (msg.type === 'show') {
          update(msg.data || {});
          show();
        } else if (msg.type === 'update') {
          update(msg.data || msg.payload || {});
        } else if (msg.type === 'hide') {
          hide();
        }
      }, false);

      // Demo loop REMOVED — strict gate means stage is hidden until trigger.
      // Once shown, design holds steady. Operator hits Update to refresh.
    })();
  </script>
<script data-tag="cade-visible-gate-observer-v2">
(function(){
  // Phase B4 — `.player-col` REMOVED from SEL so the keyframe entry slide
  // (player-a-in / player-b-in starting from opacity:0) gets to play.
  // The gate observer was forcing `opacity: 1 !important` immediately on
  // cade-visible add, which clobbered the keyframe `from-opacity:0` step
  // and left the entry feeling muted. Visibility is still gated via the
  // `body.cade-visible` CSS rule on `.player-col` itself + the keyframe
  // animation handles the from-state.
  var SEL = '.bg-image,.bg-vignette,.bg-grain,.chevrons,.h2h-kicker-wrap,.name-backdrop,.partners,.season-mark,.stat-row,.stats-card,.top-band,.winprob-bar-block';
  function apply() {
    var b = document.body;
    if (!b) return;
    var vis = b.classList.contains('cade-visible');
    document.querySelectorAll(SEL).forEach(function(el){
      // Set transition once so opacity flips animate smoothly.
      if (!el.dataset.cadeTransition) {
        el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity 360ms ease-out';
        el.dataset.cadeTransition = '1';
      }
      if (vis) {
        el.style.setProperty('opacity', '1', 'important');
        el.style.setProperty('visibility', 'visible', 'important');
      } else {
        el.style.setProperty('opacity', '0', 'important');
      }
    });
  }
  apply();
  new MutationObserver(apply).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
<script data-tag="cade-demo-mode">
(function(){
  if (new URLSearchParams(location.search).get('demo') !== '1') return;
  function fire(type){ window.dispatchEvent(new MessageEvent('message', { data: { type: type } })); }
  // Initial show after a tiny tick so the gate observer is wired.
  setTimeout(function(){ fire('show'); }, 200);
  // Loop: show 5s, hide 3s, repeat.
  setInterval(function(){ fire('hide'); }, 8000);
  setTimeout(function(){
    setInterval(function(){ fire('show'); }, 8000);
  }, 8000 - 5000); // offset so show fires 5s after each hide
})();
</script>
</body>
</html>
